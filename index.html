 \\(y'=-4x-1\\), không thỏa trên toàn \\(\\mathbb R\\). Với \\(m\\ne\\pm1\\), xét điều kiện tam thức; tài liệu kết luận hai giá trị nguyên thỏa là \\(m=0,1\\).</p><h3>Dạng 9. Đơn điệu trên nửa trục bằng cực tiểu phụ</h3><p><strong>[Pattern Name]</strong> Chuyển điều kiện mọi \\(x\\) thành điều kiện theo giá trị nhỏ nhất. <strong>[Recognition Sign]</strong> Đạo hàm có tham số và yêu cầu dấu trên \\((0,+\\infty)\\) hoặc một nửa trục. <strong>[4-Step Strategy]</strong></p><ol><li>Viết \\(f'(x)\\le0\\) hoặc \\(f'(x)\\ge0\\) trên miền.</li><li>Chuyển tham số về một phía, tạo \\(m\\le g(x)\\) hoặc \\(m\\ge g(x)\\).</li><li>Tìm min/max của \\(g\\) trên đúng miền.</li><li>Kết luận điều kiện tham số; kiểm tra điểm cực trị có nằm trong miền hay không.</li></ol><p><strong>[Common Traps]</strong> Tìm cực trị trên \\(\\mathbb R\\) trong khi đề chỉ xét nửa trục; quên miền mở hoặc điều kiện biên.</p><p><strong>Ví dụ A (theo tài liệu):</strong> \\(y=-x^3+3x^2+mx+1\\) nghịch biến trên \\((0,+\\infty)\\) khi \\(-3x^2+6x+m\\le0\\), tương đương \\(m\\le3x^2-6x\\) với mọi \\(x&gt;0\\). Biểu thức phụ đạt min \\(-3\\) tại \\(x=1\\), nên \\(m\\le-3\\). <strong>Ví dụ B:</strong> Nếu \\(f'(x)=m-(x-2)^2\\) trên \\(x&gt;0\\), muốn \\(f'\\le0\\) với mọi \\(x&gt;0\\) thì cần \\(m\\le\\inf_{x&gt;0}(x-2)^2=0\\). Điều kiện này minh họa việc tìm giá trị nhỏ nhất của biểu thức phụ trên đúng miền.</p><h3>Dạng 10. Bài toán ứng dụng: vận tốc và năng lượng</h3><p><strong>[Pattern Name]</strong> Lập hàm mục tiêu rồi xét đạo hàm. <strong>[Recognition Sign]</strong> Đề nói “vận tốc tăng”, “năng lượng giảm”, “thời gian vượt quãng đường”. <strong>[4-Step Strategy]</strong></p><ol><li>Xác định biến và đơn vị.</li><li>Lập công thức mục tiêu theo một biến; áp dụng điều kiện thực tế.</li><li>Tính đạo hàm và giải phương trình đạo hàm bằng 0.</li><li>Lập bảng dấu, kết luận khoảng tăng/giảm bằng lời gắn với bối cảnh.</li></ol><p><strong>[Common Traps]</strong> Không ghi miền biến; nhầm \\(S'\\) với \\(S''\\); bỏ điều kiện vận tốc tương đối dương.</p><p><strong>Ví dụ A (theo tài liệu):</strong> \\(S(t)=\\frac13t^3-3t^2+5t+2\\), \\(t\\ge0\\). Vận tốc \\(v=S'=t^2-6t+5\\). \\(v'=2t-6\\), nên vận tốc giảm khi \\(0&lt;t&lt;3\\), tăng khi \\(t&gt;3\\). Vật có vận tốc tăng trong \\((3,+\\infty)\\) theo cách diễn đạt của tài liệu. <strong>Ví dụ B (theo tài liệu):</strong> Cá bơi ngược dòng 300 km, dòng nước 6 km/h, vận tốc bơi khi nước đứng yên là \\(v&gt;6\\). Thời gian \\(t=300/(v-6)\\); năng lượng \\(E(v)=300c\\,v^3/(v-6)\\). Đạo hàm đổi dấu tại \\(v=9\\), năng lượng giảm trên \\((6,9)\\) theo bảng biến thiên của tài liệu.</p><hr><h3>6. MACHINE-READY FLASHCARD TABLE</h3><p><strong>Quy ước:</strong> Mỗi hàng là một thẻ. Cột <code>Front</code> là mặt trước; <code>Back</code> là đáp án ngắn; <code>Explanation/Trap</code> nêu lí do hoặc lỗi dễ mắc. Dữ liệu được dùng trong HTML app đi kèm.</p><div class=\"table-wrap\"><table><thead><tr><th>Front</th><th>Back</th><th>Explanation/Trap</th><th>Subject</th><th>Lesson</th></tr></thead><tbody><tr><td>Định nghĩa hàm đồng biến trên \\(K\\)?</td><td>\\(x<em>1&lt;x</em>2\\Rightarrow f(x<em>1)&lt;f(x</em>2)\\) với mọi \\(x<em>1,x</em>2\\in K\\).</td><td>Phải đúng với mọi cặp điểm trong khoảng.</td><td>Toán</td><td>Khái niệm đơn điệu</td></tr><tr><td>Định nghĩa hàm nghịch biến trên \\(K\\)?</td><td>\\(x<em>1&lt;x</em>2\\Rightarrow f(x<em>1)&gt;f(x</em>2)\\).</td><td>Đầu vào tăng, đầu ra giảm.</td><td>Toán</td><td>Khái niệm đơn điệu</td></tr><tr><td>Đồ thị đồng biến có chiều nào?</td><td>Đi lên từ trái sang phải.</td><td>Chỉ xét trong khoảng được hỏi.</td><td>Toán</td><td>Đọc đồ thị</td></tr><tr><td>Đồ thị nghịch biến có chiều nào?</td><td>Đi xuống từ trái sang phải.</td><td>Một đoạn đi xuống không đủ kết luận trên khoảng lớn.</td><td>Toán</td><td>Đọc đồ thị</td></tr><tr><td>Điều kiện đạo hàm để hàm đồng biến theo định lí tài liệu?</td><td>\\(f'\\ge0\\) trên \\(K\\), bằng 0 tại hữu hạn điểm.</td><td>Cần \\(f\\) có đạo hàm trên miền xét.</td><td>Toán</td><td>Định lí đạo hàm</td></tr><tr><td>Điều kiện đạo hàm để hàm nghịch biến theo định lí tài liệu?</td><td>\\(f'\\le0\\) trên \\(K\\), bằng 0 tại hữu hạn điểm.</td><td>Không áp dụng qua điểm hàm không xác định.</td><td>Toán</td><td>Định lí đạo hàm</td></tr><tr><td>Khi nào hàm không đổi theo định lí?</td><td>Khi \\(f'(x)=0\\) với mọi \\(x\\in K\\).</td><td>Bằng 0 tại một điểm chưa đủ.</td><td>Toán</td><td>Định lí đạo hàm</td></tr><tr><td>Bước đầu tiên khi xét đơn điệu từ công thức?</td><td>Tìm tập xác định.</td><td>Phân thức có thể loại điểm khỏi miền.</td><td>Toán</td><td>Quy trình chuẩn</td></tr><tr><td>Sau khi tính \\(f'\\), cần làm gì?</td><td>Giải \\(f'(x)=0\\) và tìm điểm không xác định nếu có.</td><td>Các điểm này chia trục thành khoảng xét dấu.</td><td>Toán</td><td>Quy trình chuẩn</td></tr><tr><td>Nghiệm bội chẵn thường làm dấu đổi không?</td><td>Không đổi dấu khi qua nghiệm.</td><td>Giả sử các nhân tử khác không đổi dấu tại đó.</td><td>Toán</td><td>Nghiệm bội</td></tr><tr><td>Nghiệm bội lẻ thường làm dấu đổi không?</td><td>Có, thường đổi dấu.</td><td>Kiểm tra các nhân tử còn lại.</td><td>Toán</td><td>Nghiệm bội</td></tr><tr><td>Nếu \\(f'(x)&gt;0\\), hàm biến thiên thế nào?</td><td>Đồng biến trên khoảng đang xét.</td><td>Khoảng phải nằm trong miền xác định.</td><td>Toán</td><td>Dấu đạo hàm</td></tr><tr><td>Nếu \\(f'(x)&lt;0\\), hàm biến thiên thế nào?</td><td>Nghịch biến trên khoảng đang xét.</td><td>Không gộp qua điểm gián đoạn.</td><td>Toán</td><td>Dấu đạo hàm</td></tr><tr><td>Với \\(f(x)=\\frac{x-1}{x+1}\\), điểm nào bị loại?</td><td>\\(x=-1\\).</td><td>Mẫu số bằng 0.</td><td>Toán</td><td>Hàm phân thức</td></tr><tr><td>Với \\(f(x)=\\frac{x-1}{x+1}\\), đạo hàm là gì?</td><td>\\(f'(x)=2/(x+1)^2&gt;0\\).</td><td>Tăng riêng trên hai khoảng xác định.</td><td>Toán</td><td>Hàm phân thức</td></tr><tr><td>Vì sao không gộp \\((-\\infty,-1)\\) và \\((-1,+\\infty)\\)?</td><td>Vì hàm không xác định tại \\(-1\\).</td><td>Cùng dấu đạo hàm không xóa điểm bị loại.</td><td>Toán</td><td>Hàm phân thức</td></tr><tr><td>Đồ thị \\(f'(x)\\) nằm trên trục hoành nói gì về \\(f\\)?</td><td>\\(f\\) đồng biến trên khoảng tương ứng.</td><td>Không nhầm đồ thị \\(f'\\) với \\(f\\).</td><td>Toán</td><td>Đồ thị đạo hàm</td></tr><tr><td>Đồ thị \\(f'(x)\\) nằm dưới trục hoành nói gì về \\(f\\)?</td><td>\\(f\\) nghịch biến trên khoảng tương ứng.</td><td>Xem dấu của \\(f'\\), không xem độ dốc của đồ thị \\(f'\\).</td><td>Toán</td><td>Đồ thị đạo hàm</td></tr><tr><td>Khi đạo hàm có tham số, điều kiện đồng biến là gì?</td><td>\\(f'(x)\\ge0\\) trên toàn miền yêu cầu, theo điều kiện định lí.</td><td>Phải đúng với mọi \\(x\\) trong miền.</td><td>Toán</td><td>Tham số</td></tr><tr><td>Khi đạo hàm có tham số, điều kiện nghịch biến là gì?</td><td>\\(f'(x)\\le0\\) trên toàn miền yêu cầu, theo điều kiện định lí.</td><td>Không chỉ kiểm tra một giá trị \\(x\\).</td><td>Toán</td><td>Tham số</td></tr><tr><td>Với tam thức \\(ax^2+bx+c\\), cần kiểm tra gì trước?</td><td>Kiểm tra \\(a=0\\) hay \\(a\\ne0\\).</td><td>Nếu \\(a=0\\), biểu thức giảm bậc.</td><td>Toán</td><td>Tham số</td></tr><tr><td>Bài hỏi số giá trị nguyên \\(m\\): làm gì cuối cùng?</td><td>Đếm số nguyên thuộc miền tham số đã tìm.</td><td>Không đếm biên bị loại.</td><td>Toán</td><td>Tham số</td></tr><tr><td>Bài toán chuyển động, \\(S'(t)\\) là gì?</td><td>Vận tốc \\(v(t)\\).</td><td>\\(S''(t)=v'(t)\\) là gia tốc theo cách gọi thông thường.</td><td>Toán</td><td>Ứng dụng</td></tr><tr><td>Trong bài cá hồi, vì sao \\(v&gt;6\\)?</td><td>Cá bơi ngược dòng, vận tốc thực tế \\(v-6\\) phải dương.</td><td>Điều kiện vật lí xác định miền biến.</td><td>Toán</td><td>Ứng dụng</td></tr><tr><td>Bốn bước cơ bản của dạng đạo hàm phân tích nhân tử?</td><td>Tìm nghiệm → xác định bội → lập bảng dấu → kết luận khoảng.</td><td>Không bỏ nghiệm hoặc nhầm bội.</td><td>Toán</td><td>Pattern manual</td></tr><tr><td>Bẫy khi đề cho đồ thị \\(f(x)\\)?</td><td>Khoảng cần chọn phải đơn điệu xuyên suốt.</td><td>Một đoạn đi lên không đủ.</td><td>Toán</td><td>Pattern manual</td></tr><tr><td>Bẫy khi đề cho đồ thị \\(f'(x)\\)?</td><td>Dựa vào trên/dưới trục hoành.</td><td>Không đọc hướng đi lên của đồ thị \\(f'\\).</td><td>Toán</td><td>Pattern manual</td></tr><tr><td>Với \\(y=-x^3+3x^2+mx+1\\), điều kiện tài liệu tìm được là gì?</td><td>\\(m\\le-3\\).</td><td>Dùng min của \\(3x^2-6x\\) trên \\(x&gt;0\\).</td><td>Toán</td><td>Tham số trên nửa trục</td></tr><tr><td>Theo tài liệu, cá hồi giảm năng lượng ở khoảng vận tốc nào?</td><td>\\(6&lt;v&lt;9\\) km/h.</td><td>Miền vật lí là \\(v&gt;6\\).</td><td>Toán</td><td>Ứng dụng năng lượng</td></tr></tbody></table></div><hr><h3>7. ACTIVE RECALL — TỰ KIỂM TRA</h3><p>Hãy trả lời trước khi xem đáp án ở cuối mục.</p><ol><li>Phát biểu định nghĩa đồng biến và nghịch biến bằng \\(x<em>1,x</em>2\\).</li><li>Đồ thị đi lên trên \\((0,2)\\), đi xuống trên \\((2,5)\\). Có thể kết luận gì trên \\((0,5)\\)?</li><li>Nếu \\(f'(x)\\ge0\\) và chỉ bằng 0 tại hữu hạn điểm, định lí cho kết luận gì?</li><li>Vì sao cần tìm tập xác định trước khi xét đạo hàm?</li><li>Với \\(f'(x)=(x+1)(x-1)^2\\), nghiệm nào làm dấu có khả năng đổi?</li><li>Nếu đồ thị \\(f'\\) nằm dưới trục hoành trên \\((-\\infty,2)\\), hàm \\(f\\) biến thiên thế nào ở đó?</li><li>Một hàm phân thức có \\(f'(x)&gt;0\\) ở cả hai phía \\(x=3\\), nhưng hàm không xác định tại \\(3\\). Cần nêu kết luận ra sao?</li><li>Khi giải bài tham số mà đạo hàm là tam thức bậc hai, vì sao phải xét trường hợp hệ số \\(x^2\\) bằng 0?</li><li>Với \\(S(t)\\) là quãng đường, \\(S'(t)\\) biểu diễn đại lượng nào?</li><li>Trong bài cá hồi, vì sao không xét \\(v\\le6\\)?</li></ol><h3>Đáp án tự kiểm tra</h3><ol><li>Đồng biến: \\(x<em>1&lt;x</em>2\\Rightarrow f(x<em>1)&lt;f(x</em>2)\\); nghịch biến: \\(x<em>1&lt;x</em>2\\Rightarrow f(x<em>1)&gt;f(x</em>2)\\).</li><li>Không thể kết luận đồng biến hay nghịch biến trên toàn \\((0,5)\\); phải chia khoảng tại điểm đổi chiều.</li><li>Hàm đồng biến trên miền theo định lí.</li><li>Để xác định miền có nghĩa và không kết luận xuyên qua điểm bị loại.</li><li>\\(x=-1\\) là nghiệm đơn nên dấu đổi; \\(x=1\\) là nghiệm bội chẵn nên dấu thường không đổi.</li><li>\\(f\\) nghịch biến trên \\((-\\infty,2)\\).</li><li>Nêu hai khoảng xác định riêng, tách tại \\(3\\).</li><li>Vì khi hệ số đầu bằng 0, đạo hàm không còn là tam thức bậc hai và điều kiện biệt thức không áp dụng như cũ.</li><li>Vận tốc.</li><li>Vì vận tốc thực tế khi bơi ngược dòng là \\(v-6\\), phải dương để vượt quãng đường.</li></ol><hr><h3>8. SCHEDULE — LỊCH ÔN TẬP</h3><p>Lịch gợi ý dựa trên nhịp ôn D0, D1, D3, D7, D14, D30, D60, D90. D0 là ngày học lần đầu; các ngày sau tính từ ngày D0.</p><div class=\"table-wrap\"><table><thead><tr><th>Mốc</th><th>Việc cần làm</th><th>Tiêu chí hoàn thành</th></tr></thead><tbody><tr><td>D0 — hôm nay</td><td>Đọc Deep Dive; tự lập bảng dấu cho ví dụ đơn giản; làm 10 câu Active Recall.</td><td>Giải thích được vì sao dấu \\(f'\\) quyết định chiều biến thiên.</td></tr><tr><td>D1</td><td>Ôn định nghĩa, định lí và hàm phân thức; làm lại thẻ sai.</td><td>Không nhầm điểm loại khỏi miền xác định.</td></tr><tr><td>D3</td><td>Luyện đạo hàm tích nhân tử, nghiệm bội, đọc đồ thị \\(f'\\).</td><td>Tự lập bảng dấu không xem lời giải.</td></tr><tr><td>D7</td><td>Làm nhóm bài tham số; tập xử lí hệ số bậc cao nhất bằng 0.</td><td>Viết đủ điều kiện miền và điều kiện dấu.</td></tr><tr><td>D14</td><td>Làm lại câu 1–13 của bộ tài liệu; ghi lại lỗi sai.</td><td>Tự giải và giải thích được các bước.</td></tr><tr><td>D30</td><td>Ôn ứng dụng chuyển động và năng lượng; làm bài trộn dạng.</td><td>Chuyển được bài toán lời văn thành hàm một biến.</td></tr><tr><td>D60</td><td>Kiểm tra tổng hợp không xem ghi chú.</td><td>Phân loại đúng dạng trước khi tính.</td></tr><tr><td>D90</td><td>Ôn thẻ còn yếu và làm một đề tự luyện.</td><td>Duy trì khả năng nhớ lâu và phát hiện bẫy.</td></tr></tbody></table></div><p><strong>Quy tắc cá nhân hóa:</strong> Nếu trả lời sai thẻ, xem lời giải và đánh dấu thẻ cần ôn lại sớm; nếu trả lời đúng nhưng không giải thích được, vẫn coi là chưa vững.</p><hr><h3>GHI CHÚ VỀ NGUỒN VÀ ĐỘ TIN CẬY</h3><ul><li>Nội dung lý thuyết, các dạng bài và kết quả được xây dựng dựa trên hai PDF có thể trích xuất văn bản do người học cung cấp.</li><li>PDF viết tay không có lớp văn bản trích xuất được nên không được dùng để suy đoán nội dung.</li><li>Một số biểu thức trong bản PDF bị lỗi OCR ở số mũ/ký hiệu; khi có nguy cơ ảnh hưởng kết quả, Study Pack ưu tiên biểu thức đọc được rõ trong lời giải hoặc nêu rõ điều kiện. Các ví dụ minh họa bổ sung được ghi theo mục đích sư phạm, không phải trích nguyên văn tài liệu.</li></ul>","tags":["Đạo hàm","Bảng xét dấu","Tham số","Study Pack"],"estimatedMinutes":60}]},{"id":"vat-ly","name":"Vật lý","icon":"⚛️","color":"#bde0fe","description":"Chất khí, sự chuyển thể, nhiệt độ và nhiệt kế","packs":[{"id":"vat-ly-buoi-02","title":"Chất khí, sự chuyển thể, nhiệt độ và nhiệt kế","subtitle":"Study Pack • Buổi 02","content":"<h3>STUDY PACK — VẬT LÝ BUỔI 02: CHẤT KHÍ, SỰ CHUYỂN THỂ, NHIỆT ĐỘ VÀ NHIỆT KẾ</h3>\n<blockquote>\n<p><strong>Phạm vi nguồn:</strong> Tài liệu lý thuyết, bài tập và đáp án Buổi 02 do người học cung cấp. Nội dung dưới đây bám theo các tài liệu này; chỗ nào mở rộng để giải thích cách làm sẽ được ghi rõ là diễn giải học tập. Các số liệu/đồ thị cần đọc từ hình gốc phải được đối chiếu trực tiếp với PDF.</p>\n</blockquote>\n<h3>1. Dashboard — Bảng điều khiển học tập</h3>\n<h4>Mục tiêu đầu ra</h4>\n<p>Sau khi học xong, người học có thể:</p>\n<ol>\n<li>Trình bày ba nội dung của mô hình động học phân tử.</li>\n<li>So sánh cấu trúc và tính chất của chất rắn, chất lỏng, chất khí.</li>\n<li>Phân biệt nóng chảy, đông đặc, hóa hơi, bay hơi, sôi, ngưng tụ, thăng hoa và ngưng kết.</li>\n<li>Đọc đồ thị nhiệt độ–thời gian và xác định trạng thái của chất ở từng đoạn.</li>\n<li>Phân biệt chất rắn kết tinh với chất rắn vô định hình.</li>\n<li>Giải thích chiều truyền nhiệt và trạng thái cân bằng nhiệt.</li>\n<li>Đổi nhiệt độ giữa Celsius, Kelvin và Fahrenheit; giải bài toán thang nhiệt độ mới.</li>\n<li>Chọn nhiệt kế phù hợp dựa trên giới hạn đo và nguyên lí hoạt động.</li>\n</ol>\n<h4>Bản đồ mức độ</h4>\n<table>\n<thead>\n<tr>\n  <th>Mã</th>\n  <th>Cụm kiến thức</th>\n  <th>Điều cần làm được</th>\n  <th>Lỗi cần tránh</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>K1</td>\n  <td>Mô hình động học phân tử</td>\n  <td>Nêu đủ cấu tạo hạt, chuyển động, lực tương tác</td>\n  <td>Nhầm phân tử đứng yên hoặc chỉ có lực hút</td>\n</tr>\n<tr>\n  <td>K2</td>\n  <td>Ba thể của chất</td>\n  <td>So sánh khoảng cách, trật tự, chuyển động, hình dạng, thể tích</td>\n  <td>Cho rằng chất lỏng có hình dạng riêng</td>\n</tr>\n<tr>\n  <td>K3</td>\n  <td>Chuyển thể</td>\n  <td>Gọi đúng chiều chuyển thể và ví dụ</td>\n  <td>Nhầm bay hơi với sôi; nhầm ngưng tụ với đông đặc</td>\n</tr>\n<tr>\n  <td>K4</td>\n  <td>Đồ thị chuyển thể</td>\n  <td>Đọc đoạn tăng nhiệt, nằm ngang, giảm nhiệt</td>\n  <td>Coi nhiệt độ luôn tăng khi tiếp tục cấp nhiệt</td>\n</tr>\n<tr>\n  <td>K5</td>\n  <td>Chất rắn</td>\n  <td>Phân biệt kết tinh/vô định hình</td>\n  <td>Cho rằng mọi chất rắn đều có nhiệt độ nóng chảy xác định</td>\n</tr>\n<tr>\n  <td>K6</td>\n  <td>Nhiệt độ và truyền nhiệt</td>\n  <td>Xác định chiều truyền nhiệt theo nhiệt độ</td>\n  <td>Dùng khối lượng/nhiệt năng làm tiêu chí thay cho nhiệt độ</td>\n</tr>\n<tr>\n  <td>K7</td>\n  <td>Thang nhiệt độ</td>\n  <td>Đổi °C ↔ K ↔ °F</td>\n  <td>Cộng 273 khi tính độ chênh lệch</td>\n</tr>\n<tr>\n  <td>K8</td>\n  <td>Nhiệt kế</td>\n  <td>Chọn dụng cụ có dải đo phù hợp</td>\n  <td>Chỉ nhìn tên nhiệt kế, bỏ qua giới hạn đo</td>\n</tr>\n</tbody>\n</table>\n<h4>Quy ước sử dụng</h4>\n<ul>\n<li><strong>Kiến thức nguồn:</strong> nội dung được nêu trong tài liệu lý thuyết hoặc được kiểm tra trong bộ bài tập.</li>\n<li><strong>Diễn giải học tập:</strong> cách nói lại, ví dụ mới hoặc quy trình giải nhằm giúp hiểu sâu hơn; không thay thế dữ kiện trong đề gốc.</li>\n<li>Công thức Kelvin–Celsius trong tài liệu dùng phép làm tròn: (T(K)=t(°C)+273), (t(°C)=T(K)-273).</li>\n</ul>\n<hr />\n<h3>2. Knowledge Graph — Đồ thị tri thức</h3>\n<pre><code class=\"language-text\">[K1 Mô hình động học phân tử]\n   ├─[Prerequisite]→ [K2 Cấu trúc rắn–lỏng–khí]\n   │                    ├─[Consequence]→ [K3 Tính chất mỗi thể]\n   │                    └─[Application]→ [K4 Giải thích chuyển thể]\n   └─[Application]→ [K5 Giải thích bay hơi và nóng chảy]\n\n[K4 Chuyển thể]\n   ├─[Contrast]→ [Bay hơi ↔ Sôi]\n   ├─[Contrast]→ [Nóng chảy ↔ Đông đặc]\n   ├─[Contrast]→ [Hóa hơi ↔ Ngưng tụ]\n   └─[Application]→ [K6 Đọc đồ thị nhiệt độ–thời gian]\n\n[K7 Chất rắn kết tinh ↔ vô định hình]\n   └─[Application]→ [Xác định có/không có nhiệt độ nóng chảy xác định]\n\n[K8 Nhiệt độ]\n   ├─[Consequence]→ [Chiều truyền nhiệt]\n   ├─[Prerequisite]→ [K9 Thang Celsius–Kelvin–Fahrenheit]\n   └─[Application]→ [K10 Chọn và đọc nhiệt kế]\n</code></pre>\n<h4>Quan hệ cần hiểu</h4>\n<ul>\n<li><strong>[Prerequisite] Tiền đề:</strong> phải nắm mô hình phân tử trước khi giải thích vì sao chất khí dễ nén hoặc vì sao chất lỏng bay hơi.</li>\n<li><strong>[Consequence] Hệ quả:</strong> khi hai vật có nhiệt độ khác nhau tiếp xúc, nhiệt năng truyền từ vật có nhiệt độ cao sang vật có nhiệt độ thấp.</li>\n<li><strong>[Contrast] Đối chiếu:</strong> bay hơi xảy ra ở mặt thoáng và có thể ở nhiều nhiệt độ; sôi xảy ra cả trong lòng lẫn mặt thoáng ở nhiệt độ sôi xác định của chất lỏng trong điều kiện xét.</li>\n<li><strong>[Application] Ứng dụng:</strong> dùng kiến thức chuyển thể để giải thích nước đá tan, nước đọng ngoài cốc lạnh, đúc kim loại và đồ thị đun nước.</li>\n</ul>\n<hr />\n<h3>3. Deep Dive — Giải thích chuyên sâu theo What → Why → How</h3>\n<h3>3.1. Mô hình động học phân tử (Molecular Kinetic Model)</h3>\n<h4>What — Là gì?</h4>\n<p>Mô hình động học phân tử mô tả chất được cấu tạo từ các hạt riêng biệt (nguyên tử/phân tử); các hạt luôn chuyển động hỗn loạn, không ngừng; giữa các hạt có lực tương tác gồm hút và đẩy. Theo tài liệu, nhiệt độ vật càng cao thì tốc độ chuyển động của các phân tử càng lớn.</p>\n<h4>Why — Vì sao quan trọng?</h4>\n<p>Mô hình này giải thích được nhiều tính chất vĩ mô mà mắt thường quan sát: chất khí khuếch tán khắp phòng, chất lỏng bay hơi, chất rắn nóng chảy, và sự khác nhau giữa ba thể. Không cần hình dung vật chất là một khối liên tục bất động; hãy tưởng tượng vô số hạt nhỏ đang tương tác.</p>\n<h4>How — Dùng như thế nào?</h4>\n<ol>\n<li>Xác định hiện tượng đang quan sát.</li>\n<li>Xác định các hạt ở trạng thái nào và chuyển động ra sao.</li>\n<li>Xét khoảng cách và lực tương tác giữa các hạt.</li>\n<li>Liên hệ chuyển động/tương tác vi mô với biểu hiện quan sát được.</li>\n</ol>\n<h4>Ba ví dụ đời thực</h4>\n<ol>\n<li><strong>Mùi nước hoa lan trong phòng:</strong> các phân tử chất thơm chuyển động hỗn loạn và lan ra không gian; đây là ứng dụng của sự chuyển động và khuếch tán của hạt.</li>\n<li><strong>Hạt phấn hoa trong thí nghiệm Brown:</strong> hạt phấn chuyển động thất thường vì các phân tử nước đang chuyển động và va chạm từ nhiều phía; không phải vì hạt phấn là sinh vật sống.</li>\n<li><strong>Làm nóng một vật:</strong> khi nhiệt độ tăng, chuyển động phân tử mạnh hơn theo mô hình trong tài liệu; điều này hỗ trợ giải thích sự thay đổi trạng thái khi nhận đủ năng lượng.</li>\n</ol>\n<h4>Feynman Check</h4>\n<p>Nếu phân tử nước không chuyển động hỗn loạn, ta có thể giải thích chuyển động Brown của hạt phấn hoa như thế nào? Hãy trả lời bằng cách nêu rõ “hạt phấn” và “phân tử nước” giữ vai trò gì.</p>\n<hr />\n<h3>3.2. Cấu trúc của chất rắn, chất lỏng và chất khí</h3>\n<h4>What</h4>\n<table>\n<thead>\n<tr>\n  <th>Thuộc tính</th>\n  <th>Chất rắn</th>\n  <th>Chất lỏng</th>\n  <th>Chất khí</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Khoảng cách phân tử</td>\n  <td>Rất gần, cỡ kích thước phân tử</td>\n  <td>Xa hơn chất rắn</td>\n  <td>Rất xa, có thể gấp hàng chục lần kích thước phân tử</td>\n</tr>\n<tr>\n  <td>Sắp xếp</td>\n  <td>Có trật tự ở chất rắn kết tinh</td>\n  <td>Kém trật tự hơn</td>\n  <td>Không có trật tự</td>\n</tr>\n<tr>\n  <td>Chuyển động</td>\n  <td>Dao động quanh vị trí cân bằng cố định</td>\n  <td>Dao động quanh vị trí cân bằng luôn thay đổi</td>\n  <td>Chuyển động hỗn loạn</td>\n</tr>\n<tr>\n  <td>Hình dạng</td>\n  <td>Xác định</td>\n  <td>Phụ thuộc phần bình chứa</td>\n  <td>Phụ thuộc bình chứa</td>\n</tr>\n<tr>\n  <td>Thể tích</td>\n  <td>Xác định</td>\n  <td>Xác định</td>\n  <td>Phụ thuộc bình chứa</td>\n</tr>\n<tr>\n  <td>Khả năng nén</td>\n  <td>Rất khó nén</td>\n  <td>Khó nén hơn khí</td>\n  <td>Dễ nén</td>\n</tr>\n</tbody>\n</table>\n<h4>Why</h4>\n<p>Khoảng cách giữa các hạt và cách chúng sắp xếp liên quan đến lực tương tác. Các hạt khí xa nhau nên lực liên kết yếu, có nhiều khoảng trống để thay đổi khoảng cách, vì thế khí dễ nén và chiếm toàn bộ bình. Chất lỏng giữ thể tích gần như xác định nhưng đổi hình dạng theo phần bình chứa. Chất rắn giữ cả hình dạng lẫn thể tích.</p>\n<h4>How — Quy trình so sánh</h4>\n<ol>\n<li>Hỏi “có hình dạng riêng không?”</li>\n<li>Hỏi “có thể tích riêng không?”</li>\n<li>So khoảng cách và trật tự phân tử.</li>\n<li>Từ đó suy ra chuyển động và khả năng nén.</li>\n</ol>\n<h4>Ba ví dụ đời thực</h4>\n<ol>\n<li><strong>Không khí trong xilanh có pít-tông:</strong> đẩy pít-tông vào có thể làm giảm thể tích khí đáng kể vì các phân tử khí cách xa nhau.</li>\n<li><strong>Nước rót từ cốc sang chai:</strong> nước đổi hình dạng theo phần bình chứa nhưng lượng nước vẫn chiếm thể tích gần như xác định.</li>\n<li><strong>Viên đá đặt trên bàn:</strong> viên đá giữ hình dạng và thể tích riêng trong điều kiện thông thường.</li>\n</ol>\n<h4>Feynman Check</h4>\n<p>Vì sao khí có thể bị nén dễ hơn chất lỏng? Trả lời bằng “khoảng cách giữa các phân tử”, không chỉ nói “vì khí nhẹ”.</p>\n<hr />\n<h3>3.3. Sự chuyển thể (Phase Change)</h3>\n<h4>What</h4>\n<ul>\n<li><strong>Nóng chảy:</strong> rắn → lỏng.</li>\n<li><strong>Đông đặc:</strong> lỏng → rắn.</li>\n<li><strong>Hóa hơi:</strong> lỏng → khí/hơi.</li>\n<li><strong>Ngưng tụ:</strong> khí/hơi → lỏng.</li>\n<li><strong>Thăng hoa:</strong> rắn → hơi trực tiếp.</li>\n<li><strong>Ngưng kết:</strong> hơi → rắn trực tiếp.</li>\n</ul>\n<p>Các điều kiện như nhiệt độ và áp suất thay đổi có thể làm chất chuyển từ thể này sang thể khác.</p>\n<h4>Why</h4>\n<p>Khi nhận hoặc mất năng lượng, chuyển động và tương tác giữa các hạt thay đổi. Chuyển thể không đồng nghĩa với tạo ra chất mới: nước đá tan vẫn là nước; nước hóa hơi vẫn là nước ở thể khí.</p>\n<h4>How — Nhận diện nhanh</h4>\n<ol>\n<li>Ghi thể ban đầu.</li>\n<li>Ghi thể cuối.</li>\n<li>So với sáu mũi tên chuyển thể.</li>\n<li>Nếu lỏng → khí, hỏi tiếp: xảy ra ở mặt thoáng (bay hơi) hay cả trong lòng chất lỏng (sôi).</li>\n</ol>\n<h4>Ba ví dụ đời thực</h4>\n<ol>\n<li><strong>Đá viên tan trong cốc:</strong> rắn → lỏng, nóng chảy.</li>\n<li><strong>Nước đóng thành đá trong ngăn đông:</strong> lỏng → rắn, đông đặc.</li>\n<li><strong>Giọt nước bám ngoài cốc nước lạnh:</strong> hơi nước trong không khí → lỏng, ngưng tụ; nước không “thấm xuyên” từ trong cốc ra ngoài.</li>\n</ol>\n<h4>Feynman Check</h4>\n<p>Một viên đá khô biến dần thành khí mà không thấy thành vũng chất lỏng. Tên hiện tượng nào phù hợp và vì sao?</p>\n<hr />\n<h3>3.4. Bay hơi và sôi — hai hình thức hóa hơi</h3>\n<h4>What</h4>\n<p><strong>Bay hơi</strong> là hóa hơi xảy ra ở mặt thoáng chất lỏng; có thể xảy ra ở bất kì nhiệt độ nào của chất lỏng. <strong>Sôi</strong> là hóa hơi xảy ra cả ở mặt thoáng và trong lòng chất lỏng, tại nhiệt độ sôi xác định trong điều kiện xét. Khi sôi, nhiệt độ chất lỏng không thay đổi trong suốt quá trình sôi theo kiến thức trong bộ bài tập.</p>\n<h4>Why</h4>\n<p>Ở mặt thoáng, một số phân tử có động năng đủ lớn có thể thắng lực hút và thoát khỏi chất lỏng. Khi được đun đến điều kiện sôi, sự hóa hơi diễn ra mạnh trong cả khối chất lỏng, tạo bọt hơi bên trong.</p>\n<h4>How — So sánh bằng dấu hiệu</h4>\n<ul>\n<li>Thấy chất lỏng cạn dần mà không sôi: bay hơi.</li>\n<li>Thấy bọt hơi hình thành trong lòng chất lỏng và chất lỏng sôi: sôi.</li>\n<li>Bay hơi: không có một nhiệt độ duy nhất bắt buộc.</li>\n<li>Sôi: gắn với nhiệt độ sôi xác định của chất lỏng trong điều kiện xét.</li>\n</ul>\n<h4>Ba ví dụ đời thực</h4>\n<ol>\n<li><strong>Quần áo ướt khô trên dây:</strong> nước bay hơi ở mặt thoáng của các sợi vải.</li>\n<li><strong>Nồi nước đang sôi:</strong> hơi hình thành trong lòng nước và thoát ra ở mặt thoáng.</li>\n<li><strong>Vũng nước biến mất trong ngày mát:</strong> vẫn có thể bay hơi dù nước chưa đạt nhiệt độ sôi.</li>\n</ol>\n<h4>Feynman Check</h4>\n<p>Vì sao nói “nước chỉ bay hơi khi đạt 100°C” là sai? Hãy phân biệt điều kiện của bay hơi với điều kiện của sôi.</p>\n<hr />\n<h3>3.5. Các yếu tố ảnh hưởng đến tốc độ bay hơi và thiết kế thí nghiệm</h3>\n<h4>What</h4>\n<p>Bộ bài tập trực tiếp nhấn mạnh việc kiểm tra sự phụ thuộc của tốc độ bay hơi vào nhiệt độ: dùng hai đĩa giống nhau, cùng loại chất lỏng, nhưng ở hai nhiệt độ khác nhau. Bài tập cũng gợi ý nước nóng bay hơi nhanh hơn nước lạnh trong điều kiện so sánh phù hợp.</p>\n<h4>Why</h4>\n<p>Một thí nghiệm công bằng chỉ nên thay đổi yếu tố đang kiểm tra. Nếu đồng thời đổi loại chất lỏng hoặc hình dạng đĩa, ta không thể kết luận thay đổi quan sát được là do nhiệt độ.</p>\n<h4>How — Thiết kế kiểm tra một biến</h4>\n<ol>\n<li>Nêu câu hỏi: tốc độ bay hơi có phụ thuộc nhiệt độ không?</li>\n<li>Giữ cố định loại chất lỏng, lượng ban đầu, diện tích mặt thoáng và dụng cụ.</li>\n<li>Chỉ thay đổi nhiệt độ.</li>\n<li>Đo lượng chất lỏng còn lại sau cùng khoảng thời gian; so sánh kết quả.</li>\n</ol>\n<h4>Ba ví dụ đời thực</h4>\n<ol>\n<li><strong>Hai đĩa nước:</strong> một đĩa nước ấm, một đĩa nước mát; cùng diện tích và thời gian, so lượng nước còn lại.</li>\n<li><strong>Phơi khăn:</strong> để kết luận ảnh hưởng của nhiệt độ, phải giữ loại khăn, lượng nước ban đầu và điều kiện gió/diện tích tương đương.</li>\n<li><strong>So sánh hai chất lỏng:</strong> nếu vừa đổi chất lỏng vừa đổi nhiệt độ thì kết quả không cô lập được tác động của nhiệt độ.</li>\n</ol>\n<h4>Feynman Check</h4>\n<p>Trong thí nghiệm kiểm tra nhiệt độ ảnh hưởng đến bay hơi, tại sao “dùng hai loại chất lỏng khác nhau” là lựa chọn không đúng?</p>\n<hr />\n<h3>3.6. Đồ thị nhiệt độ–thời gian khi đun nóng/làm nguội</h3>\n<h4>What</h4>\n<p>Đồ thị biểu diễn nhiệt độ của chất theo thời gian. Đoạn nghiêng thường biểu thị nhiệt độ đang thay đổi; đoạn nằm ngang trong quá trình chuyển thể biểu thị chất đang chuyển thể ở nhiệt độ không đổi theo mô hình bài học. Cần đọc chiều diễn biến của đồ thị và nhãn trục, không chỉ nhìn hình dạng.</p>\n<h4>Why</h4>\n<p>Nhiệt lượng cung cấp có thể làm tăng nhiệt độ hoặc được dùng cho quá trình chuyển thể. Vì vậy, tiếp tục cấp nhiệt không nhất thiết khiến nhiệt độ tăng liên tục.</p>\n<h4>How — Quy trình 4 bước</h4>\n<ol>\n<li>Đọc trục ngang (thời gian) và trục dọc (nhiệt độ).</li>\n<li>Xác định đoạn tăng, giảm hay nằm ngang.</li>\n<li>Đối chiếu mức nhiệt với nhiệt độ nóng chảy/sôi đã biết.</li>\n<li>Gán trạng thái: một thể hay hai thể cùng tồn tại trong giai đoạn chuyển thể.</li>\n</ol>\n<h4>Ví dụ theo dạng đồ thị trong tài liệu</h4>\n<ul>\n<li><strong>Đồ thị nước đá được đun:</strong> đoạn nằm ngang ở khoảng nóng chảy biểu thị nước tồn tại đồng thời ở thể rắn và lỏng; đoạn tăng nhiệt sau đó biểu thị nước lỏng nóng lên; đoạn nằm ngang ở nhiệt độ sôi biểu thị sôi.</li>\n<li><strong>Đồ thị nước được làm nóng rồi để nguội:</strong> tài liệu đáp án mô tả AB là nước được đun từ 0°C đến 100°C, BC là nước đang sôi, CD là nước đang nguội.</li>\n<li><strong>Đồ thị chất X:</strong> nếu đoạn nằm ngang tại 40°C là giai đoạn nóng chảy, tại nhiệt độ đó có thể cùng tồn tại rắn và lỏng; phải đọc đúng các mốc từ hình gốc.</li>\n</ul>\n<h4>Feynman Check</h4>\n<p>Khi một chất đang nóng chảy mà vẫn tiếp tục nhận nhiệt, vì sao nhiệt độ có thể chưa tăng? Hãy mô tả vai trò của năng lượng đối với liên kết giữa các hạt.</p>\n<hr />\n<h3>3.7. Chất rắn kết tinh và chất rắn vô định hình</h3>\n<h4>What</h4>\n<p><strong>Chất rắn kết tinh:</strong> có cấu trúc tinh thể và nhiệt độ nóng chảy xác định; chất rắn đơn tinh thể có thể dị hướng, đa tinh thể có thể đẳng hướng. Ví dụ trong tài liệu: hạt muối, thạch anh, kim cương (đơn tinh thể); hầu hết kim loại (đa tinh thể).<br />\n<strong>Chất rắn vô định hình:</strong> không có cấu trúc tinh thể, không có nhiệt độ nóng chảy xác định và có tính đẳng hướng. Ví dụ: thủy tinh, nhựa, cao su. Một số chất như đường, lưu huỳnh có thể tồn tại ở dạng tinh thể hoặc vô định hình.</p>\n<h4>Why</h4>\n<p>Cấu trúc sắp xếp của các hạt tạo nên khác biệt trong cách chất rắn chuyển sang lỏng. Chất kết tinh có chuyển thể nóng chảy gắn với nhiệt độ xác định; chất vô định hình mềm dần trong một khoảng nhiệt độ thay vì có một điểm nóng chảy xác định theo cách mô tả của bài học.</p>\n<h4>How</h4>\n<ol>\n<li>Kiểm tra có cấu trúc tinh thể hay không.</li>\n<li>Xét có nhiệt độ nóng chảy xác định hay không.</li>\n<li>Xem tính đẳng hướng/dị hướng nếu đề hỏi.</li>\n<li>Dùng ví dụ trong tài liệu để kiểm tra đáp án.</li>\n</ol>\n<h4>Ba ví dụ đời thực</h4>\n<ol>\n<li><strong>Tinh thể muối:</strong> ví dụ chất rắn kết tinh.</li>\n<li><strong>Kim loại thông dụng:</strong> hầu hết kim loại được nêu là đa tinh thể.</li>\n<li><strong>Thủy tinh cửa sổ hoặc cao su:</strong> ví dụ chất rắn vô định hình trong tài liệu.</li>\n</ol>\n<h4>Feynman Check</h4>\n<p>Vì sao không nên áp dụng máy móc khái niệm “một nhiệt độ nóng chảy xác định” cho mọi chất rắn?</p>\n<hr />\n<h3>3.8. Nhiệt độ, nhiệt năng và chiều truyền nhiệt</h3>\n<h4>What</h4>\n<p>Nhiệt độ cho biết trạng thái cân bằng nhiệt và chiều truyền nhiệt năng giữa các vật tiếp xúc. Khi hai vật có nhiệt độ khác nhau, nhiệt năng truyền từ vật có nhiệt độ cao hơn sang vật có nhiệt độ thấp hơn. Khi nhiệt độ bằng nhau, hai vật ở trạng thái cân bằng nhiệt và không có sự truyền nhiệt năng ròng giữa chúng theo mô tả của tài liệu.</p>\n<h4>Why</h4>\n<p>Nhiệt độ là căn cứ xác định chiều truyền nhiệt tự phát, không phải khối lượng hay vị trí cao thấp. Vật có khối lượng lớn không nhất thiết là vật truyền nhiệt sang vật nhỏ hơn; phải so sánh nhiệt độ.</p>\n<h4>How</h4>\n<ol>\n<li>Xác định nhiệt độ từng vật.</li>\n<li>So sánh nhiệt độ.</li>\n<li>Vật nóng hơn là nơi nhiệt năng truyền đi; vật lạnh hơn là nơi nhận.</li>\n<li>Khi nhiệt độ cân bằng, không còn truyền nhiệt ròng.</li>\n</ol>\n<h4>Ba ví dụ đời thực</h4>\n<ol>\n<li><strong>Thìa kim loại trong trà nóng:</strong> nhiệt truyền từ trà nóng sang thìa lạnh hơn.</li>\n<li><strong>Giọt nước đang sôi rơi vào cốc nước ấm:</strong> giọt nóng hơn mất nhiệt năng; nước trong cốc nhận nhiệt năng.</li>\n<li><strong>Hai vật cùng nhiệt độ đặt tiếp xúc:</strong> không có sự truyền nhiệt ròng do chênh lệch nhiệt độ.</li>\n</ol>\n<h4>Feynman Check</h4>\n<p>Một vật nặng 2 kg ở 20°C tiếp xúc với vật nhẹ 100 g ở 50°C. Chỉ từ thông tin này, chiều truyền nhiệt ban đầu là chiều nào? Vì sao khối lượng không quyết định câu trả lời?</p>\n<hr />\n<h3>3.9. Thang Celsius, Kelvin và Fahrenheit</h3>\n<h4>What</h4>\n<ul>\n<li>Celsius (°C): thang quen dùng ở Việt Nam; nước tinh khiết đóng băng ở 0°C và sôi ở 100°C ở áp suất tiêu chuẩn.</li>\n<li>Kelvin (K): thang nhiệt độ tuyệt đối; độ không tuyệt đối tương ứng 0 K.</li>\n<li>Quan hệ làm tròn trong tài liệu: (T(K)=t(°C)+273), (t(°C)=T(K)-273).</li>\n<li>Fahrenheit (°F): bài tập sử dụng quan hệ quy đổi chuẩn (F=\\frac{9}{5}C+32) và (C=\\frac{5}{9}(F-32)).</li>\n</ul>\n<h4>Why</h4>\n<p>Các thang dùng mốc và đơn vị khác nhau, nên số đọc không thể so sánh trực tiếp nếu chưa đổi về cùng thang. Tuy nhiên, <strong>độ chênh nhiệt độ</strong> có giá trị bằng nhau theo °C và K: tăng 6 K tương đương tăng 6°C.</p>\n<h4>How — công thức và ví dụ</h4>\n<ul>\n<li>°C → K: cộng 273 (theo quy ước làm tròn của tài liệu).</li>\n<li>K → °C: trừ 273.</li>\n<li>°C → °F: nhân 9/5 rồi cộng 32.</li>\n<li>°F → °C: trừ 32 rồi nhân 5/9.</li>\n</ul>\n<p><strong>Ví dụ 1:</strong> 35°C → (F=35×9/5+32=95°F).<br />\n<strong>Ví dụ 2:</strong> 293 K → (t=293-273=20°C), rồi (F=20×9/5+32=68°F).<br />\n<strong>Ví dụ 3:</strong> 104°F → (C=(104-32)×5/9=40°C), rồi (T≈40+273=313K).</p>\n<h4>Feynman Check</h4>\n<p>Một vật tăng nhiệt độ thêm 6 K. Vì sao không cần cộng 273 để tìm độ tăng theo Celsius?</p>\n<hr />\n<h3>3.10. Nhiệt kế và giới hạn đo</h3>\n<h4>What</h4>\n<p>Nhiệt kế là thiết bị đo nhiệt độ. Các nguyên lí trong tài liệu:</p>\n<ul>\n<li>Nhiệt kế chất lỏng: dựa vào sự giãn nở vì nhiệt của chất lỏng.</li>\n<li>Nhiệt kế điện tử: dựa vào sự thay đổi điện trở của vật dẫn.</li>\n<li>Nhiệt kế hồng ngoại: đo bức xạ nhiệt từ bề mặt vật mà không cần tiếp xúc.</li>\n<li>Giới hạn đo (GHĐ) là giá trị lớn nhất dụng cụ đo được; độ chia nhỏ nhất (ĐCNN) là giá trị ứng với một vạch chia nhỏ nhất.</li>\n</ul>\n<h4>Why</h4>\n<p>Một nhiệt kế chỉ phù hợp nếu dải đo bao phủ nhiệt độ cần đo. Nhiệt kế y tế 34–42°C không phù hợp để đo nước sôi; nhiệt kế có GHĐ 110°C có thể đo gần 100°C nếu được thiết kế và sử dụng đúng.</p>\n<h4>How</h4>\n<ol>\n<li>Ước lượng nhiệt độ cần đo.</li>\n<li>Đọc GHĐ và giới hạn dưới của nhiệt kế.</li>\n<li>Loại dụng cụ có dải đo không bao phủ giá trị cần đo.</li>\n<li>Chọn dụng cụ theo mục đích và nguyên lí đo.</li>\n</ol>\n<h4>Ba ví dụ đời thực</h4>\n<ol>\n<li><strong>Đo thân nhiệt:</strong> dùng nhiệt kế y tế có dải đo phù hợp vùng thân nhiệt.</li>\n<li><strong>Đo nước sôi:</strong> cần nhiệt kế có thể đo tới ít nhất 100°C; ví dụ trong bộ bài tập là nhiệt kế thủy ngân từ −10°C đến 110°C.</li>\n<li><strong>Đo bề mặt nóng mà không chạm:</strong> nhiệt kế hồng ngoại phù hợp vì đo bức xạ từ bề mặt.</li>\n</ol>\n<h4>Feynman Check</h4>\n<p>Tại sao một nhiệt kế có số vạch chia nhỏ nhưng GHĐ chỉ 42°C vẫn không thích hợp để đo nước sôi?</p>\n<hr />\n<h3>4. Comparison &amp; Traps — Bảng đối chiếu và bẫy thường gặp</h3>\n<h4>4.1. Chuyển thể</h4>\n<table>\n<thead>\n<tr>\n  <th>Quá trình</th>\n  <th>Chiều chuyển thể</th>\n  <th>Dấu hiệu nhận biết</th>\n  <th>Ví dụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Nóng chảy</td>\n  <td>Rắn → lỏng</td>\n  <td>Chất rắn tan thành lỏng</td>\n  <td>Nước đá tan</td>\n</tr>\n<tr>\n  <td>Đông đặc</td>\n  <td>Lỏng → rắn</td>\n  <td>Chất lỏng thành rắn</td>\n  <td>Nước đóng băng</td>\n</tr>\n<tr>\n  <td>Bay hơi</td>\n  <td>Lỏng → khí ở mặt thoáng</td>\n  <td>Có thể xảy ra ở nhiều nhiệt độ</td>\n  <td>Cốc nước cạn dần</td>\n</tr>\n<tr>\n  <td>Sôi</td>\n  <td>Lỏng → khí trong lòng và mặt thoáng</td>\n  <td>Có bọt hơi, nhiệt độ sôi xác định</td>\n  <td>Nồi nước sôi</td>\n</tr>\n<tr>\n  <td>Ngưng tụ</td>\n  <td>Khí → lỏng</td>\n  <td>Hơi tạo giọt lỏng</td>\n  <td>Nước đọng ngoài cốc lạnh</td>\n</tr>\n<tr>\n  <td>Thăng hoa</td>\n  <td>Rắn → khí trực tiếp</td>\n  <td>Không qua thể lỏng quan sát được</td>\n  <td>Đá khô</td>\n</tr>\n<tr>\n  <td>Ngưng kết</td>\n  <td>Khí → rắn trực tiếp</td>\n  <td>Hơi tạo chất rắn trực tiếp</td>\n  <td>Hơi tạo tinh thể băng trong điều kiện thích hợp</td>\n</tr>\n</tbody>\n</table>\n<h4>4.2. Bẫy về bay hơi và sôi</h4>\n<ul>\n<li>“Bay hơi chỉ xảy ra khi chất lỏng đạt nhiệt độ sôi” → Sai.</li>\n<li>“Bay hơi chỉ xảy ra trong lòng chất lỏng” → Sai; bay hơi xảy ra ở mặt thoáng.</li>\n<li>“Sôi xảy ra ở cả trong lòng lẫn mặt thoáng” → Đúng.</li>\n<li>“Trong khi sôi, nhiệt độ luôn tăng liên tục” → Sai theo mô hình bài học.</li>\n<li>“Sương đọng trên lá là bay hơi” → Sai; đó là ngưng tụ.</li>\n</ul>\n<h4>4.3. Bẫy về các thể</h4>\n<ul>\n<li>Chất khí không có hình dạng riêng, không có thể tích riêng; chiếm toàn bộ bình và dễ nén.</li>\n<li>Chất lỏng có thể tích xác định nhưng hình dạng phụ thuộc phần bình chứa.</li>\n<li>Chất rắn có hình dạng và thể tích xác định, khó nén.</li>\n<li>Khi chuyển thể, kích thước nguyên tử/phân tử không được xem là thay đổi trong bộ câu hỏi; trạng thái sắp xếp và khoảng cách thay đổi.</li>\n</ul>\n<h4>4.4. Bẫy về nhiệt độ</h4>\n<ul>\n<li>Nhiệt truyền theo chênh lệch nhiệt độ, không theo khối lượng.</li>\n<li>1 K chênh lệch bằng 1°C chênh lệch; không cộng 273 cho độ chênh.</li>\n<li>Nhiệt độ tuyệt đối 0 K không đồng nghĩa với 0°C.</li>\n<li>Cẩn thận khi đề dùng dấu âm: (-20°C) đến (7,2°C) tăng (27,2°C), tức (27,2K).</li>\n</ul>\n<h4>4.5. Bẫy khi thiết kế thí nghiệm</h4>\n<ul>\n<li>Muốn kiểm tra ảnh hưởng của nhiệt độ thì phải giữ các biến khác không đổi.</li>\n<li>Hai đĩa không giống nhau có thể có diện tích mặt thoáng khác nhau, làm sai kết luận.</li>\n<li>Dùng hai loại chất lỏng khác nhau khiến không thể quy kết khác biệt chỉ cho nhiệt độ.</li>\n</ul>\n<hr />\n<h3>5. Pattern Manual — Sổ tay nhận dạng dạng bài</h3>\n<h3>Dạng 1: Nhận diện hiện tượng chuyển thể</h3>\n<p><strong>Pattern Name:</strong> Mũi tên trạng thái<br />\n<strong>Recognition Sign:</strong> Đề mô tả chất đổi từ rắn/lỏng/khí sang trạng thái khác.</p>\n<p><strong>Chiến lược 4 bước</strong></p>\n<ol>\n<li>Viết trạng thái ban đầu.</li>\n<li>Viết trạng thái cuối.</li>\n<li>Ghép với mũi tên chuyển thể.</li>\n<li>Nếu là lỏng → khí, xác định bay hơi hay sôi theo vị trí diễn ra.</li>\n</ol>\n<p><strong>Bẫy thường gặp:</strong> Nhầm ngưng tụ (khí → lỏng) với đông đặc (lỏng → rắn).</p>\n<p><strong>Ví dụ chi tiết A:</strong> Nước đá tan. Ban đầu là rắn, cuối là lỏng; mũi tên rắn → lỏng; kết luận nóng chảy. Không gọi là ngưng tụ vì không bắt đầu từ hơi.<br />\n<strong>Ví dụ chi tiết B:</strong> Nước xuất hiện bên ngoài cốc lạnh. Hơi nước trong không khí chuyển thành giọt lỏng; khí → lỏng; kết luận ngưng tụ, không phải nước trong cốc thấm qua thành.</p>\n<h3>Dạng 2: Phân biệt bay hơi và sôi</h3>\n<p><strong>Pattern Name:</strong> Vị trí hóa hơi<br />\n<strong>Recognition Sign:</strong> Câu hỏi có “mặt thoáng”, “trong lòng”, “nhiệt độ bất kì”, “nhiệt độ sôi”, “bọt khí”.</p>\n<p><strong>Chiến lược 4 bước</strong></p>\n<ol>\n<li>Xác định chất có đang ở thể lỏng.</li>\n<li>Xem hóa hơi ở mặt thoáng hay cả trong lòng.</li>\n<li>Xem đề nêu nhiệt độ sôi xác định hay nhiệt độ bất kì.</li>\n<li>Kết luận bay hơi hoặc sôi và loại các lựa chọn đánh tráo dấu hiệu.</li>\n</ol>\n<p><strong>Bẫy thường gặp:</strong> Cả bay hơi và sôi đều là hóa hơi; không phải hai quá trình đối nghịch.</p>\n<p><strong>Ví dụ chi tiết A:</strong> Khăn ướt khô ngoài trời. Không cần đạt 100°C; nước thoát khỏi mặt thoáng thành hơi nên là bay hơi.<br />\n<strong>Ví dụ chi tiết B:</strong> Nước trong nồi sủi bọt khắp khối nước. Hóa hơi diễn ra cả bên trong và trên bề mặt ở nhiệt độ sôi; đó là sôi.</p>\n<h3>Dạng 3: Đọc đồ thị nhiệt độ–thời gian</h3>\n<p><strong>Pattern Name:</strong> Dốc – Ngang – Dốc<br />\n<strong>Recognition Sign:</strong> Đồ thị có các đoạn tăng/giảm và đoạn nằm ngang.</p>\n<p><strong>Chiến lược 4 bước</strong></p>\n<ol>\n<li>Đọc trục và đơn vị.</li>\n<li>Xác định đoạn đang tăng, giảm hay không đổi.</li>\n<li>So nhiệt độ đoạn ngang với mốc nóng chảy/sôi.</li>\n<li>Nêu trạng thái của chất và quá trình diễn ra.</li>\n</ol>\n<p><strong>Bẫy thường gặp:</strong> Đoạn nằm ngang không có nghĩa là chất không nhận nhiệt; năng lượng có thể tham gia chuyển thể.</p>\n<p><strong>Ví dụ chi tiết A:</strong> Đun nước đá: ở đoạn nóng chảy, rắn và lỏng cùng tồn tại; sau khi tan hết, nước lỏng tăng nhiệt độ.<br />\n<strong>Ví dụ chi tiết B:</strong> Đồ thị nước sôi: đoạn ngang tại nhiệt độ sôi biểu thị chất lỏng và hơi cùng hiện diện trong quá trình sôi; nhiệt độ không đổi theo mô hình bài học.</p>\n<h3>Dạng 4: Đổi nhiệt độ Celsius–Kelvin–Fahrenheit</h3>\n<p><strong>Pattern Name:</strong> Chuyển thang theo đúng công thức<br />\n<strong>Recognition Sign:</strong> Đề cho một đơn vị và yêu cầu đơn vị khác.</p>\n<p><strong>Chiến lược 4 bước</strong></p>\n<ol>\n<li>Ghi đơn vị đầu vào.</li>\n<li>Chọn công thức chuyển đúng chiều.</li>\n<li>Thay số và giữ dấu âm nếu có.</li>\n<li>Kiểm tra kết quả có hợp lí với mốc 0°C = 273 K = 32°F hay không.</li>\n</ol>\n<p><strong>Bẫy thường gặp:</strong> Dùng công thức K–°C cho Fahrenheit; cộng 273 vào độ chênh.</p>\n<p><strong>Ví dụ chi tiết A:</strong> 35°C sang °F: (35×9/5+32=95°F).<br />\n<strong>Ví dụ chi tiết B:</strong> 104°F sang K: (C=(104-32)×5/9=40°C); (K≈40+273=313K).</p>\n<h3>Dạng 5: Bài toán thang nhiệt độ tự định nghĩa</h3>\n<p><strong>Pattern Name:</strong> Nội suy tuyến tính giữa hai mốc<br />\n<strong>Recognition Sign:</strong> Thang X/Z có điểm nước đóng băng và sôi được gán số khác thường.</p>\n<p><strong>Chiến lược 4 bước</strong></p>\n<ol>\n<li>Ghi hai cặp mốc tương ứng.</li>\n<li>Giả sử quan hệ tuyến tính (X=aC+b).</li>\n<li>Thay hai mốc để tìm (a,b).</li>\n<li>Thay nhiệt độ cần đổi vào biểu thức và kiểm tra lại hai mốc.</li>\n</ol>\n<p><strong>Bẫy thường gặp:</strong> Giả sử mốc đóng băng luôn bằng 0 trên mọi thang; bỏ qua độ lệch gốc.</p>\n<p><strong>Ví dụ chi tiết A:</strong> Thang X: đóng băng −10X, sôi 90X. Khoảng 100X ứng với 100°C nên (X=C-10). Với 40°C, (X=30X).<br />\n<strong>Ví dụ chi tiết B:</strong> Thang Z: đóng băng −5°Z, sôi 105°Z. (Z=1,1C-5). Nếu Z = 61°Z thì (61=1,1C-5), suy ra (C=60°C).</p>\n<h3>Dạng 6: Chọn nhiệt kế</h3>\n<p><strong>Pattern Name:</strong> Phạm vi trước, độ chia sau<br />\n<strong>Recognition Sign:</strong> Đề hỏi nhiệt kế nào đo được thân nhiệt, nước sôi, không khí hoặc bề mặt nóng.</p>\n<p><strong>Chiến lược 4 bước</strong></p>\n<ol>\n<li>Xác định nhiệt độ cần đo.</li>\n<li>So với GHĐ và giới hạn dưới.</li>\n<li>Loại nhiệt kế có dải đo không bao phủ nhiệt độ đó.</li>\n<li>Chọn loại đáp ứng mục đích và nguyên lí phù hợp.</li>\n</ol>\n<p><strong>Bẫy thường gặp:</strong> Nhiệt kế có ĐCNN nhỏ vẫn không dùng được nếu GHĐ thấp hơn nhiệt độ cần đo.</p>\n<p><strong>Ví dụ chi tiết A:</strong> Đo nước sôi khoảng 100°C: nhiệt kế 34–42°C không phù hợp; dải −10–110°C bao phủ 100°C.<br />\n<strong>Ví dụ chi tiết B:</strong> Đo thân nhiệt: nhiệt kế y tế 34–42°C phù hợp hơn nhiệt kế công nghiệp có dải 0–400°C vì được thiết kế cho mục đích đo thân nhiệt.</p>\n<h3>Dạng 7: Thiết kế thí nghiệm công bằng</h3>\n<p><strong>Pattern Name:</strong> Một biến độc lập<br />\n<strong>Recognition Sign:</strong> Đề hỏi cách kiểm tra một yếu tố có ảnh hưởng đến tốc độ bay hơi hay không.</p>\n<p><strong>Chiến lược 4 bước</strong></p>\n<ol>\n<li>Xác định biến cần kiểm tra.</li>\n<li>Giữ cố định các yếu tố khác.</li>\n<li>Tạo hai điều kiện chỉ khác biến độc lập.</li>\n<li>Đo kết quả bằng cùng phương pháp, cùng khoảng thời gian.</li>\n</ol>\n<p><strong>Bẫy thường gặp:</strong> Đổi đồng thời nhiệt độ, diện tích và loại chất lỏng.</p>\n<p><strong>Ví dụ chi tiết A:</strong> So sánh nước ấm và nước mát trong hai đĩa giống nhau, cùng lượng nước ban đầu, cùng thời gian.<br />\n<strong>Ví dụ chi tiết B:</strong> Không thể kết luận riêng tác động nhiệt độ nếu một đĩa chứa cồn và đĩa còn lại chứa nước, vì loại chất lỏng cũng đã thay đổi.</p>\n<hr />\n<h3>6. Machine-Ready Flashcard Table — Bảng thẻ ghi nhớ</h3>\n<p>Định dạng cột: <strong>Front | Back | Explanation/Trap | Subject | Lesson</strong>. Các thẻ dưới đây được đưa thêm vào tệp ứng dụng HTML để có thể luyện tập, chỉnh sửa, ẩn/hiện và xóa bài.</p>\n<table>\n<thead>\n<tr>\n  <th>Front</th>\n  <th>Back</th>\n  <th>Explanation/Trap</th>\n  <th>Subject</th>\n  <th>Lesson</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Ba nội dung của mô hình động học phân tử là gì?</td>\n  <td>Chất cấu tạo từ hạt riêng biệt; hạt chuyển động hỗn loạn không ngừng; giữa hạt có lực hút và đẩy.</td>\n  <td>Không bỏ quên lực tương tác.</td>\n  <td>Vật lý</td>\n  <td>Mô hình phân tử</td>\n</tr>\n<tr>\n  <td>Nhiệt độ tăng thì tốc độ chuyển động phân tử thay đổi thế nào theo tài liệu?</td>\n  <td>Tăng.</td>\n  <td>Đây là quan hệ nêu trong mô hình của bài.</td>\n  <td>Vật lý</td>\n  <td>Mô hình phân tử</td>\n</tr>\n<tr>\n  <td>Vì sao hạt phấn hoa trong thí nghiệm Brown chuyển động hỗn độn?</td>\n  <td>Do các phân tử nước chuyển động không ngừng và va chạm vào hạt phấn từ nhiều phía.</td>\n  <td>Hạt phấn không cần là sinh vật sống.</td>\n  <td>Vật lý</td>\n  <td>Mô hình phân tử</td>\n</tr>\n<tr>\n  <td>Chất rắn có hình dạng và thể tích riêng không?</td>\n  <td>Có cả hình dạng và thể tích riêng.</td>\n  <td>Không nhầm với chất lỏng.</td>\n  <td>Vật lý</td>\n  <td>Ba thể của chất</td>\n</tr>\n<tr>\n  <td>Chất lỏng có hình dạng riêng không?</td>\n  <td>Không; hình dạng phụ thuộc phần bình chứa, nhưng thể tích xác định.</td>\n  <td>Câu bẫy thường nói chất lỏng có cả hai.</td>\n  <td>Vật lý</td>\n  <td>Ba thể của chất</td>\n</tr>\n<tr>\n  <td>Vì sao chất khí dễ nén?</td>\n  <td>Các phân tử ở rất xa nhau nên có thể giảm khoảng cách giữa chúng.</td>\n  <td>Không giải thích chỉ bằng “khí nhẹ”.</td>\n  <td>Vật lý</td>\n  <td>Ba thể của chất</td>\n</tr>\n<tr>\n  <td>Nóng chảy là chuyển từ thể nào sang thể nào?</td>\n  <td>Rắn → lỏng.</td>\n  <td>Không nhầm với hóa hơi.</td>\n  <td>Vật lý</td>\n  <td>Chuyển thể</td>\n</tr>\n<tr>\n  <td>Đông đặc là gì?</td>\n  <td>Chuyển từ lỏng → rắn.</td>\n  <td>Là chiều ngược với nóng chảy.</td>\n  <td>Vật lý</td>\n  <td>Chuyển thể</td>\n</tr>\n<tr>\n  <td>Ngưng tụ là gì?</td>\n  <td>Chuyển từ khí/hơi → lỏng.</td>\n  <td>Nước đọng ngoài cốc lạnh là ngưng tụ.</td>\n  <td>Vật lý</td>\n  <td>Chuyển thể</td>\n</tr>\n<tr>\n  <td>Thăng hoa là gì?</td>\n  <td>Chuyển trực tiếp từ rắn → hơi.</td>\n  <td>Không đi qua thể lỏng.</td>\n  <td>Vật lý</td>\n  <td>Chuyển thể</td>\n</tr>\n<tr>\n  <td>Ngưng kết là quá trình ngược với gì?</td>\n  <td>Thăng hoa; hơi chuyển trực tiếp thành rắn.</td>\n  <td>Phân biệt với ngưng tụ khí → lỏng.</td>\n  <td>Vật lý</td>\n  <td>Chuyển thể</td>\n</tr>\n<tr>\n  <td>Bay hơi xảy ra ở đâu?</td>\n  <td>Ở mặt thoáng chất lỏng.</td>\n  <td>Có thể xảy ra ở bất kì nhiệt độ nào.</td>\n  <td>Vật lý</td>\n  <td>Bay hơi và sôi</td>\n</tr>\n<tr>\n  <td>Sôi xảy ra ở đâu?</td>\n  <td>Cả trong lòng và trên mặt thoáng chất lỏng.</td>\n  <td>Gắn với nhiệt độ sôi trong điều kiện xét.</td>\n  <td>Vật lý</td>\n  <td>Bay hơi và sôi</td>\n</tr>\n<tr>\n  <td>Trong suốt quá trình sôi, nhiệt độ thay đổi thế nào theo bài học?</td>\n  <td>Không thay đổi.</td>\n  <td>Đừng nhầm với giai đoạn chất lỏng đang nóng lên trước khi sôi.</td>\n  <td>Vật lý</td>\n  <td>Bay hơi và sôi</td>\n</tr>\n<tr>\n  <td>Nước trong cốc cạn d>Không; chúng ở trạng thái cân bằng nhiệt.</td>\n  <td>Có thể có trao đổi vi mô nhưng không có truyền nhiệt ròng theo bài học.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt độ và truyền nhiệt</td>\n</tr>\n<tr>\n  <td>Công thức đổi °C sang K theo tài liệu là gì?</td>\n  <td>T(K) = t(°C) + 273.</td>\n  <td>Tài liệu dùng làm tròn 273.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>20°C xấp xỉ bao nhiêu K?</td>\n  <td>293 K.</td>\n  <td>20 + 273.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>293 K xấp xỉ bao nhiêu °C?</td>\n  <td>20°C.</td>\n  <td>293 − 273.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>Công thức đổi °C sang °F là gì?</td>\n  <td>F = 9C/5 + 32.</td>\n  <td>Đừng quên cộng 32.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>35°C bằng bao nhiêu °F?</td>\n  <td>95°F.</td>\n  <td>35×9/5 + 32 = 95.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>104°F bằng bao nhiêu °C?</td>\n  <td>40°C.</td>\n  <td>(104−32)×5/9 = 40.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>Độ tăng 6 K bằng độ tăng bao nhiêu °C?</td>\n  <td>6°C.</td>\n  <td>Độ chênh không cần cộng 273.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>Độ không tuyệt đối ứng với bao nhiêu K?</td>\n  <td>0 K.</td>\n  <td>Không phải 0°C.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>Nhiệt kế chất lỏng dựa trên nguyên lí nào?</td>\n  <td>Sự giãn nở vì nhiệt của chất lỏng.</td>\n  <td>Thủy ngân/rượu là ví dụ.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt kế</td>\n</tr>\n<tr>\n  <td>Nhiệt kế điện tử dựa trên thay đổi nào?</td>\n  <td>Sự thay đổi điện trở của vật dẫn.</td>\n  <td>Không phải sự giãn nở chất lỏng.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt kế</td>\n</tr>\n<tr>\n  <td>Nhiệt kế hồng ngoại đo bằng cách nào?</td>\n  <td>Đo bức xạ nhiệt phát ra từ bề mặt vật, không cần tiếp xúc.</td>\n  <td>Kết quả phụ thuộc bề mặt và cách sử dụng.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt kế</td>\n</tr>\n<tr>\n  <td>GHĐ của dụng cụ là gì?</td>\n  <td>Giá trị lớn nhất dụng cụ đo được.</td>\n  <td>Đừng nhầm với ĐCNN.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt kế</td>\n</tr>\n<tr>\n  <td>ĐCNN của dụng cụ là gì?</td>\n  <td>Giá trị ứng với một vạch chia nhỏ nhất.</td>\n  <td>Không phải giá trị lớn nhất.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt kế</td>\n</tr>\n<tr>\n  <td>Vì sao nhiệt kế y tế 34–42°C không đo được nước sôi?</td>\n  <td>Vì 100°C nằm ngoài dải đo của nó.</td>\n  <td>GHĐ và dải đo phải bao phủ giá trị cần đo.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt kế</td>\n</tr>\n<tr>\n  <td>Thang X có điểm đóng băng −10X và sôi 90X. Quan hệ X với C là gì?</td>\n  <td>X = C − 10.</td>\n  <td>Hai khoảng 100 đơn vị tương ứng 100°C.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ mới</td>\n</tr>\n<tr>\n  <td>Thang Z có mốc 0°C ↔ −5Z và 100°C ↔ 105Z. Quan hệ tuyến tính?</td>\n  <td>Z = 1,1C − 5.</td>\n  <td>Tính cả hệ số góc và độ lệch.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ mới</td>\n</tr>\n<tr>\n  <td>Khi đọc đồ thị, bước đầu tiên là gì?</td>\n  <td>Đọc tên và đơn vị hai trục.</td>\n  <td>Đừng đoán chỉ từ hình dạng.</td>\n  <td>Vật lý</td>\n  <td>Đồ thị chuyển thể</td>\n</tr>\n<tr>\n  <td>Khi chất lỏng bay hơi, các phân tử thoát ra từ đâu?</td>\n  <td>Mặt thoáng chất lỏng.</td>\n  <td>Một số phân tử có động năng đủ lớn để thắng lực hút.</td>\n  <td>Vật lý</td>\n  <td>Bay hơi và sôi</td>\n</tr>\n<tr>\n  <td>Trong mô hình tài liệu, khoảng cách phân tử lớn liên hệ thế nào với lực liên kết?</td>\n  <td>Khoảng cách lớn thì lực liên kết yếu.</td>\n  <td>Không đảo ngược quan hệ.</td>\n  <td>Vật lý</td>\n  <td>Mô hình phân tử</td>\n</tr>\n<tr>\n  <td>Các phân tử chất rắn dao động quanh vị trí nào?</td>\n  <td>Vị trí cân bằng cố định.</td>\n  <td>Đặc trưng của mô hình chất rắn.</td>\n  <td>Vật lý</td>\n  <td>Ba thể của chất</td>\n</tr>\n<tr>\n  <td>Các phân tử chất lỏng dao động quanh vị trí cân bằng như thế nào?</td>\n  <td>Vị trí cân bằng luôn luôn thay đổi.</td>\n  <td>Chất lỏng vẫn giữ thể tích xác định.</td>\n  <td>Vật lý</td>\n  <td>Ba thể của chất</td>\n</tr>\n<tr>\n  <td>Chất khí có thể tích riêng không?</td>\n  <td>Không; thể tích phụ thuộc bình chứa.</td>\n  <td>Khí chiếm toàn bộ thể tích bình.</td>\n  <td>Vật lý</td>\n  <td>Ba thể của chất</td>\n</tr>\n<tr>\n  <td>Sự ngưng tụ luôn là chuyển thể nào?</td>\n  <td>Hơi/khí → lỏng.</td>\n  <td>Không phải lỏng → rắn.</td>\n  <td>Vật lý</td>\n  <td>Chuyển thể</td>\n</tr>\n<tr>\n  <td>Vì sao không được đổi hai yếu tố trong thí nghiệm bay hơi?</td>\n  <td>Vì không xác định được yếu tố nào gây ra khác biệt.</td>\n  <td>Nguyên tắc kiểm soát biến.</td>\n  <td>Vật lý</td>\n  <td>Thí nghiệm bay hơi</td>\n</tr>\n<tr>\n  <td>0°C và 100°C là các mốc gì của nước tinh khiết ở áp suất tiêu chuẩn?</td>\n  <td>Đóng băng/tan và sôi tương ứng.</td>\n  <td>Mốc phụ thuộc điều kiện áp suất được nêu.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>Khi chất rắn kết tinh nóng chảy, điều gì xảy ra với trật tự tinh thể?</td>\n  <td>Trật tự tinh thể bị phá vỡ dần cho đến khi chất rắn nóng chảy hoàn toàn.</td>\n  <td>Nhiệt lượng có thể dùng cho chuyển thể.</td>\n  <td>Vật lý</td>\n  <td>Chất rắn</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3>7. Active Recall — Tự kiểm tra không nhìn tài liệu</h3>\n<p><strong>Cách làm:</strong> Trả lời bằng lời của mình trước khi mở đáp án. Nếu sai, đánh dấu thẻ tương ứng và ôn lại sau một khoảng nghỉ.</p>\n<h4>Câu hỏi</h4>\n<ol>\n<li>Nêu đủ ba nội dung của mô hình động học phân tử.</li>\n<li>So sánh chất rắn, chất lỏng và chất khí theo khoảng cách, trật tự, chuyển động, hình dạng và thể tích.</li>\n<li>Vì sao khí lan tỏa khắp phòng và dễ nén?</li>\n<li>Phân biệt nóng chảy, đông đặc, hóa hơi, ngưng tụ, thăng hoa và ngưng kết bằng mũi tên trạng thái.</li>\n<li>Nêu hai điểm khác nhau quan trọng giữa bay hơi và sôi.</li>\n<li>Vì sao khăn ướt có thể khô dù nhiệt độ môi trường thấp hơn nhiệt độ sôi của nước?</li>\n<li>Trong thí nghiệm kiểm tra nhiệt độ ảnh hưởng đến tốc độ bay hơi, cần giữ những điều kiện nào giống nhau?</li>\n<li>Trên đồ thị nhiệt độ–thời gian, đoạn nằm ngang trong giai đoạn chuyển thể biểu thị điều gì?</li>\n<li>Nêu một điểm khác nhau giữa chất rắn kết tinh và chất rắn vô định hình.</li>\n<li>Xác định chiều truyền nhiệt khi hai vật ở 80°C và 25°C tiếp xúc nhau.</li>\n<li>Đổi 35°C sang °F.</li>\n<li>Đổi 104°F sang °C rồi sang K.</li>\n<li>Vì sao độ tăng 6 K cũng là độ tăng 6°C?</li>\n<li>Nêu nguyên lí của nhiệt kế chất lỏng, điện tử và hồng ngoại.</li>\n<li>Vì sao phải kiểm tra giới hạn đo trước khi chọn nhiệt kế?</li>\n</ol>\n<h4>Đáp án tự đối chiếu</h4>\n<ol>\n<li>Hạt riêng biệt; chuyển động hỗn loạn không ngừng; lực tương tác hút và đẩy.</li>\n<li>Rắn: hạt gần, có trật tự, dao động quanh vị trí cố định, hình dạng/thể tích xác định. Lỏng: hạt xa hơn, kém trật tự, vị trí cân bằng thay đổi, hình dạng theo bình, thể tích xác định. Khí: hạt rất xa, không trật tự, chuyển động hỗn loạn, hình dạng/thể tích theo bình.</li>\n<li>Các hạt khí cách xa nhau, lực liên kết yếu và chuyển động hỗn loạn.</li>\n<li>Rắn→lỏng nóng chảy; lỏng→rắn đông đặc; lỏng→khí hóa hơi; khí→lỏng ngưng tụ; rắn→hơi thăng hoa; hơi→rắn ngưng kết.</li>\n<li>Bay hơi ở mặt thoáng, có thể xảy ra ở nhiều nhiệt độ; sôi xảy ra trong lòng và mặt thoáng, tại nhiệt độ sôi xác định trong điều kiện xét.</li>\n<li>Bay hơi xảy ra ở mặt thoáng tại nhiều nhiệt độ, không cần đạt nhiệt độ sôi.</li>\n<li>Loại chất lỏng, lượng ban đầu, diện tích mặt thoáng/dụng cụ, thời gian và các điều kiện khác phải giống nhau; chỉ đổi nhiệt độ.</li>\n<li>Chất đang chuyển thể; nhiệt độ không đổi trong đoạn đó theo mô hình bài học.</li>\n<li>Chất kết tinh có cấu trúc tinh thể và nhiệt độ nóng chảy xác định; vô định hình không có cấu trúc tinh thể và không có nhiệt độ nóng chảy xác định.</li>\n<li>Từ vật 80°C sang vật 25°C.</li>\n<li>(35×9/5+32=95°F).</li>\n<li>(C=(104-32)×5/9=40°C), (K≈40+273=313K).</li>\n<li>Hai thang có cùng độ lớn của một đơn vị nhiệt độ; khác nhau ở mốc gốc, không phải độ chia.</li>\n<li>Chất lỏng: giãn nở vì nhiệt; điện tử: thay đổi điện trở; hồng ngoại: đo bức xạ nhiệt bề mặt.</li>\n<li>Nếu nhiệt độ cần đo nằm ngoài dải đo, nhiệt kế không thể đo đúng hoặc không dùng an toàn.</li>\n</ol>\n<h4>Bài tự luận tổng hợp</h4>\n<p>Một bạn nói: “Cốc nước lạnh đặt trong phòng nóng có nước bám bên ngoài vì nước trong cốc thấm qua thành. Khi đun nước, nhiệt độ càng tăng mãi cho đến khi nước bay hơi hết.” Hãy chỉ ra từng ý sai và sửa lại bằng mô hình phân tử, khái niệm ngưng tụ và sự khác nhau giữa bay hơi với sôi.</p>\n<p><strong>Gợi ý chấm:</strong> Nêu được hơi nước trong không khí ngưng tụ trên thành cốc lạnh; bay hơi xảy ra ở mặt thoáng ở nhiều nhiệt độ; khi nước sôi, nhiệt độ không đổi trong suốt giai đoạn sôi theo mô hình bài học.</p>\n<hr />\n<h3>8. Schedule — Lịch ôn tập đề xuất</h3>\n<p>Lịch dưới đây là kế hoạch học tập gợi ý, không phải dữ kiện bắt buộc trong tài liệu. Điều chỉnh thời lượng theo lịch học và kết quả tự kiểm tra.</p>\n<table>\n<thead>\n<tr>\n  <th>Ngày</th>\n  <th>Nội dung</th>\n  <th>Nhiệm vụ cụ thể</th>\n  <th>Tiêu chí hoàn thành</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>D0 — Hôm nay</td>\n  <td>K1–K3: mô hình phân tử, ba thể, chuyển thể</td>\n  <td>Đọc Deep Dive 3.1–3.3; tạo sơ đồ 6 mũi tên chuyển thể; ôn thẻ định nghĩa</td>\n  <td>Gọi đúng 6 quá trình và giải thích 3 ví dụ không nhìn tài liệu</td>\n</tr>\n<tr>\n  <td>D1</td>\n  <td>Bay hơi, sôi, thí nghiệm</td>\n  <td>So sánh hai quá trình; viết quy trình thí nghiệm một biến; làm thẻ đến hạn</td>\n  <td>Phân biệt đúng ít nhất 8/10 tình huống</td>\n</tr>\n<tr>\n  <td>D3</td>\n  <td>Đồ thị và chất rắn</td>\n  <td>Vẽ lại đồ thị nóng chảy/sôi bằng lời; phân biệt kết tinh/vô định hình</td>\n  <td>Giải thích được đoạn nghiêng và đoạn ngang</td>\n</tr>\n<tr>\n  <td>D7</td>\n  <td>Nhiệt độ và truyền nhiệt</td>\n  <td>Tự đặt 5 tình huống truyền nhiệt; làm câu hỏi Active Recall 10–15</td>\n  <td>Không dùng khối lượng để suy ra chiều truyền nhiệt</td>\n</tr>\n<tr>\n  <td>D14</td>\n  <td>Chuyển đổi thang nhiệt độ</td>\n  <td>Làm 10 bài °C–K–°F và 3 bài thang mới</td>\n  <td>Tính đúng công thức, đơn vị và dấu âm</td>\n</tr>\n<tr>\n  <td>D30</td>\n  <td>Nhiệt kế và tổng ôn</td>\n  <td>Chọn nhiệt kế cho 5 mục đích; làm lại các câu từng sai</td>\n  <td>Đạt ít nhất 85% câu tự kiểm tra</td>\n</tr>\n<tr>\n  <td>D60</td>\n  <td>Ôn duy trì</td>\n  <td>Chỉ ôn thẻ còn yếu, tự giải thích bằng lời</td>\n  <td>Nói rõ What–Why–How cho mỗi cụm</td>\n</tr>\n<tr>\n  <td>D90</td>\n  <td>Kiểm tra tổng hợp</td>\n  <td>Làm đề trộn khái niệm, đồ thị và tính toán</td>\n  <td>Không xem ghi chú trong lần làm đầu</td>\n</tr>\n</tbody>\n</table>\n<h4>Quy trình mỗi phiên 25–35 phút</h4>\n<ol>\n<li><strong>5 phút:</strong> ghi lại điều còn nhớ trước khi đọc.</li>\n<li><strong>10–15 phút:</strong> đọc đúng phần kiến thức còn yếu.</li>\n<li><strong>5–10 phút:</strong> luyện flashcard theo cơ chế chủ động nhớ (Active Recall).</li>\n<li><strong>3–5 phút:</strong> ghi lỗi sai và hẹn ngày xem lại.</li>\n</ol>\n<h4>Quy tắc cập nhật lịch</h4>\n<ul>\n<li>Trả lời đúng và giải thích được “vì sao”: tăng khoảng cách ôn.</li>\n<li>Nhớ đáp án nhưng không giải thích được: giữ ở nhóm cần ôn sớm.</li>\n<li>Sai khái niệm hoặc nhầm chiều chuyển thể: quay lại sơ đồ kiến thức, sau đó làm lại ví dụ.</li>\n<li>Với bài tính toán, không chỉ đánh dấu đúng/sai; ghi lại công thức, phép thay số và đơn vị.</li>\n</ul>\n","tags":["Chất khí","Chuyển thể","Nhiệt độ","Nhiệt kế","Study Pack"],"estimatedMinutes":90}]}]};
const STORAGE_KEY='knowledge-universe-v12';
const REVIEW_DAYS=[0,1,3,7,14,30,60,90];
const DATA_STORAGE_KEY='knowledge-universe-data-v12';
try{const savedData=JSON.parse(localStorage.getItem(DATA_STORAGE_KEY)||'null');if(savedData&&Array.isArray(savedData.subjects)){const merged=savedData.subjects.slice();for(const seeded of DATA_STORE.subjects){if(!merged.some(existing=>existing.id===seeded.id))merged.push(seeded)}DATA_STORE.subjects.splice(0,DATA_STORE.subjects.length,...merged)}}catch(e){}
const state={view:'home',subjectId:null,packId:null,showFab:true,search:''};
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function readStore(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{reviews:{},settings:{showFab:true},completed:{}}}catch(e){return {reviews:{},settings:{showFab:true},completed:{}}}}
let store=readStore(); state.showFab=store.settings?.showFab!==false;
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3200)}
function storageInfo(){let used=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);used+=(k.length+(localStorage.getItem(k)||'').length)*2}}catch(e){};return {used,limit:5*1024*1024,pct:used/(5*1024*1024)*100}}
function saveStore(next=store){const info=storageInfo();if(info.pct>=100){alert(' LỖI: Đã đầy bộ nhớ! Không thể lưu thêm dữ liệu.');return false}try{localStorage.setItem(STORAGE_KEY,JSON.stringify(next));store=next;const after=storageInfo();if(after.pct>=80)alert(' Cảnh báo: Bộ nhớ sắp đầy! Hãy xóa bài cũ để tránh lỗi.');return true}catch(e){alert(' LỖI: Đã đầy bộ nhớ! Không thể lưu thêm dữ liệu.');return false}}
function persistData(){try{localStorage.setItem(DATA_STORAGE_KEY,JSON.stringify(DATA_STORE));const info=storageInfo();if(info.pct>=80)alert(' Cảnh báo: Bộ nhớ sắp đầy! Hãy xóa bài cũ để tránh lỗi.');return true}catch(e){alert(' LỖI: Đã đầy bộ nhớ! Không thể lưu thêm dữ liệu.');return false}}
function makeId(prefix='lesson'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function allPacks(includeHidden=false){return DATA_STORE.subjects.flatMap(s=>s.packs.filter(p=>includeHidden||!p.hidden).map(p=>({...p,subject:s})))}
function getSubject(){return DATA_STORE.subjects.find(s=>s.id===state.subjectId)}function getPack(){return allPacks(true).find(p=>p.id===state.packId)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inlineMd(s){let x=escapeHtml(s);x=x.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\[(.*?)\]\((https?:\/\/[^ )]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');return x}
function renderMarkdown(md){const lines=md.replace(/\r/g,'').split('\n');let out='',i=0;while(i<lines.length){let l=lines[i];if(!l.trim()){i++;continue}if(l.trim().startsWith('```')){let code=[];i++;while(i<lines.length&&!lines[i].trim().startsWith('```'))code.push(lines[i++]);i++;out+='<pre><code>'+escapeHtml(code.join('\n'))+'</code></pre>';continue}if(/^\s*\|.*\|\s*$/.test(l)){let rows=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i]))rows.push(lines[i++]);rows=rows.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r));if(rows.length){const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());out+='<table><thead><tr>'+cells(rows[0]).map(c=>'<th>'+inlineMd(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+cells(r).map(c=>'<td>'+inlineMd(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}continue}if(/^#{1,6}\s/.test(l)){const m=l.match(/^(#{1,6})\s+(.*)/);const n=m[1].length;out+=`<h${n}>${inlineMd(m[2])}</h${n}>`;i++;continue}if(/^\s*---+\s*$/.test(l)){out+='<hr>';i++;continue}if(/^\s*>/.test(l)){let q=[];while(i<lines.length&&/^\s*>/.test(lines[i]))q.push(lines[i++].replace(/^\s*>\s?/,''));out+='<blockquote>'+q.map(inlineMd).join('<br>')+'</blockquote>';continue}if(/^\s*[-*+]\s+/.test(l)){let items=[];while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i]))items.push('<li>'+inlineMd(lines[i++].replace(/^\s*[-*+]\s+/,''))+'</li>');out+='<ul>'+items.join('')+'</ul>';continue}if(/^\s*\d+\.\s+/.test(l)){let items=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i]))items.push('<li>'+inlineMd(lines[i++].replace(/^\s*\d+\.\s+/,''))+'</li>');out+='<ol>'+items.join('')+'</ol>';continue}let para=[l.trim()];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|```|\s*\||\s*>|\s*[-*+]\s+|\s*\d+\.\s+|\s*---)/.test(lines[i]))para.push(lines[i++].trim());out+='<p>'+para.map(inlineMd).join(' ')+'</p>'}return out}
function dueDate(packId){const r=store.reviews?.[packId];return r?.nextReviewDate?new Date(r.nextReviewDate):null}function fmtDate(d){return d?d.toLocaleDateString('vi-VN',{day:'2-digit',month:'short',year:'numeric'}):'Chưa lên lịch'}function reviewIndex(packId){return store.reviews?.[packId]?.stage||0}
function reviewStatus(packId){const d=dueDate(packId);if(!d)return 'Chưa bắt đầu';return d.getTime()<=Date.now()?'Đến hạn ôn':'Đã lên lịch'}
function setView(view){state.view=view;render();$('#fabWrap').classList.remove('open');$('#fabToggle').setAttribute('aria-expanded','false')}
function goSubject(id){state.subjectId=id;state.view='subject';render()}function goPack(id){state.packId=id;state.view='pack';render()}
function render(){const root=$('#appMain');if(state.view==='home')root.innerHTML=renderHome();else if(state.view==='subjects')root.innerHTML=renderSubjects();else if(state.view==='subject')root.innerHTML=renderSubject();else if(state.view==='pack')root.innerHTML=renderPack();else root.innerHTML=renderSettings();$('#fabWrap').classList.toggle('hidden',!state.showFab);wire();if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise().catch(()=>{})}
function renderHome(){const packs=allPacks();const due=packs.filter(p=>{const d=dueDate(p.id);return d&&d<=new Date()}).length;const reviewed=packs.filter(p=>store.reviews?.[p.id]).length;return `<section class="view"><div class="hero"><div><div class="eyebrow">Không gian học tập của bạn</div><h1>Biến kiến thức thành<br><span style="color:var(--green)">tài sản dài hạn.</span></h1><p>Một vũ trụ nhỏ để lưu study pack, học có hệ thống và ôn đúng thời điểm — không cần chạy theo cảm giác “mình nhớ rồi”.</p></div><div class="hero-stat"><strong>${packs.length.toString().padStart(2,'0')}</strong><span>Study pack khả dụng</span></div></div><div class="grid"><article class="card"><div class="eyebrow">Tổng quan</div><h3>${DATA_STORE.subjects.length} môn học</h3><p>Kiến thức được chia theo môn, rồi đến từng gói học tập.</p><div class="card-foot"><span>Khám phá môn học</span><span class="arrow">↗</span></div></article><article class="card"><div class="eyebrow">Spaced repetition</div><h3>${due} gói đến hạn</h3><p>Ôn tập theo lịch D0 → D90 để tăng khả năng ghi nhớ.</p><div class="card-foot"><span>${reviewed} gói đã bắt đầu</span><span class="arrow">↗</span></div></article><article class="card"><div class="eyebrow">Dữ liệu</div><h3>Local-first</h3><p>Tiến độ và lịch ôn được lưu trực tiếp trong trình duyệt này.</p><div class="card-foot"><span>Kiểm tra bộ nhớ ở Cài đặt</span><span class="arrow">↗</span></div></article></div><div class="section-head"><h2>Khám phá môn học</h2><button class="btn" data-nav="subjects">Tất cả môn học →</button></div><div class="grid">${DATA_STORE.subjects.map(subjectCard).join('')}</div><div class="section-head"><h2>Tiếp tục học</h2><span class="muted">${packs.length} study pack</span></div>${packs.map(packRow).join('')}</section>`}
function subjectCard(s){const count=s.packs.length;return `<article class="card click-card subject-card" tabindex="0" role="button" aria-label="Mở môn ${escapeHtml(s.name)}" data-subject="${s.id}"><div class="subject-icon">${s.icon}</div><h3>${escapeHtml(s.name)}</h3><p>${escapeHtml(s.description)}</p><div class="card-foot"><span>${count} study pack${count>1?'s':''}</span><span class="arrow">↗</span></div><div class="progress"><span style="width:${Math.round(s.packs.filter(p=>store.reviews?.[p.id]).length/Math.max(count,1)*100)}%"></span></div><div class="subject-cta"><span>Vào môn học</span><span aria-hidden="true">→</span></div></article>`}
function packRow(p){const due=dueDate(p.id);return `<article class="card click-card" style="margin-bottom:12px" tabindex="0" role="button" data-pack="${p.id}"><div class="pack-row"><div class="pack-num">${String(p.subject.packs.findIndex(x=>x.id===p.id)+1).padStart(2,'0')}</div><div class="pack-main"><h3>${escapeHtml(p.title)}</h3><p>${escapeHtml(p.subtitle)} · ${p.estimatedMinutes} phút gợi ý</p><div class="tagrow">${p.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}<span class="tag">${escapeHtml(reviewStatus(p.id))}</span></div></div><span class="arrow">↗</span></div></article>`}
function renderSubjects(){return `<section class="view"><div class="crumbs"><button data-nav="home">Trang chủ</button> / Môn học</div><div class="hero"><div><div class="eyebrow">Danh mục tri thức</div><h1>Môn học</h1><p>Chọn một vũ trụ kiến thức để tiếp tục hành trình.</p></div></div><div class="grid">${DATA_STORE.subjects.map(subjectCard).join('')}</div></section>`}
function lessonManageRow(p,index,hidden=false){return `<article class="card ${hidden?'lesson-hidden':''}" style="margin-bottom:12px"><div class="lesson-title-line"><div class="pack-num">${String(index+1).padStart(2,'0')}</div><div class="pack-main"><h3 style="margin:0 0 4px">${escapeHtml(p.title)} ${hidden?'<span class="hidden-label">Đang ẩn</span>':''}</h3><p>${escapeHtml(p.subtitle||'Study pack')} · ${Number(p.estimatedMinutes)||30} phút gợi ý</p><div class="tagrow">${(p.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}<span class="tag">${escapeHtml(reviewStatus(p.id))}</span></div></div></div><div class="lesson-management"><button class="btn primary" data-pack="${p.id}">Mở bài học →</button><button class="btn" data-action="rename" data-pack-id="${p.id}">✎ Đổi tên</button><button class="btn" data-action="visibility" data-pack-id="${p.id}">${hidden?'Hiện bài':'Ẩn bài'}</button><button class="btn danger" data-action="delete" data-pack-id="${p.id}">Xóa</button></div></article>`}
function renderSubject(){const s=getSubject();if(!s){state.view='home';return renderHome()}const visible=s.packs.filter(p=>!p.hidden),hidden=s.packs.filter(p=>p.hidden);return `<section class="view"><div class="crumbs"><button data-nav="home">Trang chủ</button> / <button data-nav="subjects">Môn học</button> / ${escapeHtml(s.name)}</div><div class="hero"><div><div class="eyebrow">Môn học · ${visible.length} bài đang hiển thị</div><h1>${s.icon} ${escapeHtml(s.name)}</h1><p>${escapeHtml(s.description)}. Quản lý bài học tại đây: mở nội dung, đổi tên, ẩn/hiện hoặc xóa bài.</p></div></div><div class="section-head"><h2>Danh sách bài học</h2><button class="btn primary" id="addLesson">＋ Thêm bài học</button></div><p class="management-note">Các thay đổi được lưu trong trình duyệt này. Bài bị ẩn sẽ chuyển xuống mục “Bài đang ẩn” để bạn có thể hiện lại.</p>${visible.length?visible.map((p,i)=>lessonManageRow(p,i,false)).join(''):'<div class="card empty">Chưa có bài học đang hiển thị. Bạn có thể thêm bài mới hoặc hiện lại bài đang ẩn.</div>'}${hidden.length?`<div class="section-head"><h2>Bài đang ẩn</h2><span class="muted">${hidden.length} bài</span></div>${hidden.map((p,i)=>lessonManageRow(p,i,true)).join('')}`:''}</section>`}
function accordionize(html){const parts=html.split(/(?=<h3>)/);let out='';parts.forEach((part,i)=>{const m=part.match(/^<h3>([\s\S]*?)<\/h3>/);if(!m){if(part.trim())out+=`<div class="accordion-body markdown">${part}</div>`;return}const title=m[1];const body=part.slice(m[0].length);out+=`<details class="accordion" ${i===1?'open':''}><summary>${title}</summary><div class="accordion-body markdown">${body}</div></details>`});return out} 
function renderPack(){const p=getPack();if(!p){state.view='home';return renderHome()}const stage=reviewIndex(p.id),next=dueDate(p.id),info=storageInfo();return `<section class="view"><div class="crumbs"><button data-nav="home">Trang chủ</button> / <button data-nav="subjects">Môn học</button> / <button data-subject="${p.subject.id}">${escapeHtml(p.subject.name)}</button> / ${escapeHtml(p.title)}</div><div class="detail-layout"><div><header class="card article-head"><div class="eyebrow">${escapeHtml(p.subject.name)} · ${escapeHtml(p.subtitle)}</div><h1>${escapeHtml(p.title)}</h1><p>Học chủ động, tự kiểm tra và quay lại đúng lịch. Nội dung được lấy từ study pack đã cung cấp.</p><div class="article-tools"><button class="btn green" id="markLearned">✓ ${store.reviews?.[p.id]?'Đã bắt đầu ôn':'Bắt đầu học / ghi nhận D0'}</button><button class="btn" id="toggleAll">Mở / đóng tất cả mục</button><button class="btn" id="copyTitle">Sao chép tên gói</button></div></header><article class="card content"><div class="markdown" id="markdownContent">${accordionize(p.content)}</div></article></div><aside class="sidebar"><section class="card side-card"><h3>TIẾN ĐỘ ÔN TẬP</h3><div class="metric"><span>Trạng thái</span><strong>${escapeHtml(reviewStatus(p.id))}</strong></div><div class="metric"><span>Lần ôn hiện tại</span><strong>D${REVIEW_DAYS[stage]??90}</strong></div><div class="metric"><span>Ngày ôn tiếp theo</span><strong>${fmtDate(next)}</strong></div><div class="srsline">${REVIEW_DAYS.map((d,i)=>`<span class="srs-chip ${i===stage?'active':''}">D${d}</span>`).join('')}</div><button class="btn green" id="reviewDone" style="width:100%">Đã ôn xong → lịch kế tiếp</button><p class="muted" style="font-size:11px;margin:10px 0 0">Mỗi lần bấm sẽ chuyển sang mốc ôn kế tiếp.</p></section><section class="card side-card"><h3>THÔNG TIN GÓI</h3><div class="metric"><span>Thời lượng gợi ý</span><strong>${p.estimatedMinutes} phút</strong></div><div class="metric"><span>Nội dung</span><strong>${(p.content.match(/<p>|<li>|<h3>|<h4>/g)||[]).length} khối nội dung</strong></div><div class="metric"><span>Bộ nhớ sử dụng</span><strong>${(info.used/1024).toFixed(1)} KB</strong></div></section><section class="card side-card"><h3>HỌC HIỆU QUẢ HƠN</h3><p class="muted" style="font-size:12px;margin:0">Đóng đáp án, tự nhớ lại trước, rồi mới mở phần giải thích. Đừng nhầm cảm giác quen mắt với khả năng tự làm.</p></section></aside></div></section>`}
function renderSettings(){const info=storageInfo();return `<section class="view"><div class="crumbs"><button data-nav="home">Trang chủ</button> / Cài đặt</div><div class="hero"><div><div class="eyebrow">Điều khiển hệ thống</div><h1>Cài đặt</h1><p>Tùy chỉnh trải nghiệm và theo dõi dung lượng lưu trữ trên thiết bị.</p></div></div><div class="settings-grid"><section class="card setting"><div><h3>Toggle FAB</h3><p>Hiện hoặc ẩn nút điều hướng nổi.</p></div><input class="switch" id="showFabSwitch" type="checkbox" ${state.showFab?'checked':''} aria-label="Hiện nút điều hướng nổi"></section><section class="card"><div class="eyebrow">Local storage</div><h3 style="margin:8px 0">${(info.used/1024).toFixed(1)} KB <span class="muted" style="font-size:12px;font-weight:400">/ ~5 MB</span></h3><div class="progress"><span style="width:${Math.min(info.pct,100)}%;background:${info.pct>=80?'var(--red)':'var(--green)'}"></span></div><p class="muted" style="font-size:12px">Ước tính ${info.pct.toFixed(2)}% dung lượng localStorage hiện tại.</p></section><section class="card"><div class="eyebrow">Dữ liệu học tập</div><h3>Xuất bản sao lưu</h3><p class="muted">Tải xuống tiến độ ôn tập và cài đặt dưới dạng JSON.</p><button class="btn" id="exportData">Xuất dữ liệu JSON</button></section><section class="card"><div class="eyebrow">Bảo trì</div><h3>Xóa tiến độ ôn tập</h3><p class="muted">Chỉ xóa lịch SRS và cài đặt lưu cục bộ, không xóa nội dung gốc được nhúng trong file HTML.</p><button class="btn danger" id="clearData">Xóa dữ liệu học tập</button></section></div></section>`}
function wire(){ $$('[data-nav]').forEach(b=>b.onclick=()=>setView(b.dataset.nav==='subjects'?'subjects':b.dataset.nav));$$('[data-subject]').forEach(el=>{const fn=()=>goSubject(el.dataset.subject);el.onclick=fn;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}}});$$('[data-pack]').forEach(el=>{const fn=()=>goPack(el.dataset.pack);el.onclick=fn;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}}});$('#topHome').onclick=()=>setView('home');const sw=$('#showFabSwitch');if(sw)sw.onchange=()=>{state.showFab=sw.checked;store.settings={...store.settings,showFab:state.showFab};saveStore();$('#fabWrap').classList.toggle('hidden',!state.showFab)};const learn=$('#markLearned');if(learn)learn.onclick=()=>scheduleReview(getPack().id,0);const review=$('#reviewDone');if(review)review.onclick=()=>scheduleReview(getPack().id,Math.min(reviewIndex(getPack().id)+1,REVIEW_DAYS.length-1));const toggle=$('#toggleAll');if(toggle)toggle.onclick=()=>{const details=$$('#markdownContent details');const open=details.some(d=>!d.open);details.forEach(d=>d.open=open);if(!details.length)toast('Nội dung đang hiển thị theo từng mục tiêu đề; có thể cuộn để học.');};const cp=$('#copyTitle');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(getPack().title);toast('Đã sao chép tên study pack.')}catch(e){toast(getPack().title)}};const ex=$('#exportData');if(ex)ex.onclick=()=>{const blob=new Blob([JSON.stringify({app:'Knowledge Universe',version:1,exportedAt:new Date().toISOString(),store},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='knowledge-universe-backup.json';a.click();URL.revokeObjectURL(a.href)};const clear=$('#clearData');if(clear)clear.onclick=()=>{if(confirm('Xóa toàn bộ lịch ôn tập và cài đặt đã lưu trên trình duyệt này?')){store={reviews:{},settings:{showFab:true},completed:{}};saveStore();state.showFab=true;toast('Đã xóa dữ liệu học tập.');render()}};
const add=$('#addLesson');if(add)add.onclick=()=>{const title=prompt('Tên bài học mới:','Bài học mới');if(!title||!title.trim())return;const subj=getSubject();if(!subj)return;const pack={id:makeId('pack'),title:title.trim(),subtitle:'Bài học tự tạo',estimatedMinutes:30,tags:['Tự tạo'],content:'<h3>Mục tiêu học tập</h3><p>Thêm nội dung của bạn vào phần này.</p><h3>Ghi chú</h3><p></p>',hidden:false};subj.packs.push(pack);if(persistData()){toast('Đã thêm bài học.');render()}else{subj.packs.pop()}};
$$('[data-action]').forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();const id=btn.dataset.packId;const subj=getSubject();const idx=subj?.packs.findIndex(p=>p.id===id)??-1;if(!subj||idx<0)return;const pack=subj.packs[idx];if(btn.dataset.action==='rename'){const title=prompt('Nhập tên mới cho bài học:',pack.title);if(!title||!title.trim())return;const old=pack.title;pack.title=title.trim();if(persistData()){toast('Đã đổi tên bài học.');render()}else pack.title=old}else if(btn.dataset.action==='visibility'){pack.hidden=!pack.hidden;if(persistData()){toast(pack.hidden?'Đã ẩn bài học khỏi danh sách chính.':'Đã hiện lại bài học.');render()}else pack.hidden=!pack.hidden}else if(btn.dataset.action==='delete'){if(!confirm(`Xóa bài học “${pack.title}” khỏi môn học? Thao tác này không thể hoàn tác.`))return;const removed=subj.packs.splice(idx,1)[0];if(persistData()){delete store.reviews?.[id];saveStore();toast('Đã xóa bài học.');render()}else subj.packs.splice(idx,0,removed)}})}
function scheduleReview(packId,stage){const next=new Date();next.setHours(12,0,0,0);next.setDate(next.getDate()+REVIEW_DAYS[stage]);const nextStore={...store,reviews:{...store.reviews,[packId]:{stage,nextReviewDate:next.toISOString(),updatedAt:new Date().toISOString()}}};if(saveStore(nextStore)){toast(stage===0?'Đã ghi nhận D0. Lịch ôn tiếp theo đã được tạo.':`Hoàn thành ôn tập — mốc kế tiếp D${REVIEW_DAYS[stage]}.`);render()}}
// Điều hướng dùng event delegation ở capture phase để vẫn hoạt động trên thẻ và mọi phần tử con, kể cả trình duyệt di động.
document.addEventListener('click',e=>{const subjectEl=e.target.closest('[data-subject]');if(subjectEl){e.preventDefault();e.stopImmediatePropagation();goSubject(subjectEl.dataset.subject);return}const packEl=e.target.closest('[data-pack]');if(packEl){e.preventDefault();e.stopImmediatePropagation();goPack(packEl.dataset.pack);return}const navEl=e.target.closest('[data-nav]');if(navEl){e.preventDefault();e.stopImmediatePropagation();setView(navEl.dataset.nav==='subjects'?'subjects':navEl.dataset.nav);return}},true);
$('#fabToggle').onclick=()=>{const wrap=$('#fabWrap');wrap.classList.toggle('open');$('#fabToggle').setAttribute('aria-expanded',wrap.classList.contains('open')?'true':'false')};render();
</script></body></html>
