const DATA_STORE = {"subjects":[{"id":"hoa-hoc","name":"Hóa học","icon":"⚗️","color":"#dc3545","description":"Ester, lipid và các phản ứng hữu cơ","packs":[{"id":"ester-lipid","title":"Ester – Lipid","subtitle":"Study Pack • Buổi 1","content":"<h3>STUDY PACK — ESTER – LIPID</h3><p><strong>Môn:</strong> Hóa học <strong>Phạm vi nguồn:</strong> <em>Buổi 1 – Ester Lipid Lí thuyết</em>, <em>Buổi 1 – Ester Lipid Bài tập</em>, <em>Buổi 1 – Ester Lipid Đáp án</em> và <em>Buổi 1 – Ester Lipid File viết tay</em>. <strong>Mục tiêu:</strong> Nắm bản chất → nhận dạng nhanh → giải bài theo dạng → tự kiểm tra và ôn tập dài hạn.</p><blockquote><p><strong>Quy ước đọc tài liệu:</strong> Gói học tập này hệ thống hóa nội dung có trong tài liệu đã gửi. Phần phiếu viết tay chủ yếu là trang để trống cho người học tự ghi, nên không được xem như một nguồn đáp án độc lập. Bảng đáp án SPV 01–50 ở cuối phần bài tập được chép theo tệp đáp án nguồn; những câu tính toán hoặc câu có cách diễn đạt chưa rõ nên được kiểm tra lại bằng lập luận và dữ kiện đề.</p></blockquote><hr><h3>1. DASHBOARD &amp; MA TRẬN ƯU TIÊN</h3><h3>1.1. Dashboard học tập</h3><div class=\"table-wrap\"><table><thead><tr><th>Hạng mục</th><th>Nội dung cần làm chủ</th><th>Dấu hiệu đã đạt</th></tr></thead><tbody><tr><td>Ester: cấu tạo và danh pháp</td><td>Nhận diện nhóm –COO–; gọi tên theo hai phần</td><td>Nhìn CTCT xác định được phần acid và phần alcohol</td></tr><tr><td>Ester: tính chất</td><td>Thủy phân acid/base, este hóa, tính chất vật lí</td><td>Viết đúng sản phẩm và xác định phản ứng thuận nghịch/một chiều</td></tr><tr><td>Lipid và chất béo</td><td>Lipid, acid béo, triglyceride</td><td>Phân biệt chất béo với ester đơn giản và các lipid khác</td></tr><tr><td>Chất béo: phản ứng</td><td>Hydrogen hóa, thủy phân/xà phòng hóa, oxi hóa gây ôi</td><td>Dự đoán được sản phẩm và hiện tượng</td></tr><tr><td>Bài tập nhận dạng</td><td>Công thức phân tử, đồng phân, gọi tên</td><td>Nêu được lý do loại từng phương án sai</td></tr><tr><td>Bài tập định lượng</td><td>Đốt cháy, xà phòng hóa, hiệu suất, chỉ số acid</td><td>Chọn đúng quan hệ mol và đơn vị</td></tr><tr><td>Thí nghiệm</td><td>Điều chế, tách lớp, phễu chiết, hồi lưu/chưng cất</td><td>Giải thích được vai trò của từng thao tác</td></tr></tbody></table></div><h3>1.2. Ma trận ưu tiên P1–P4</h3><div class=\"table-wrap\"><table><thead><tr><th>Mức</th><th>Nội dung</th><th>Vì sao ưu tiên</th><th>Chuẩn đầu ra</th></tr></thead><tbody><tr><td><strong>P1 – Bắt buộc</strong></td><td>Nhóm chức ester; công thức ester no, đơn chức, mạch hở; gọi tên</td><td>Là nền tảng của hầu hết câu hỏi</td><td>Nhận diện và gọi tên đúng, không nhầm R/R′</td></tr><tr><td><strong>P1 – Bắt buộc</strong></td><td>Thủy phân trong môi trường acid và base</td><td>Xuất hiện trực tiếp trong lý thuyết và nhiều bài tập</td><td>Viết phương trình, phân biệt thuận nghịch với một chiều</td></tr><tr><td><strong>P1 – Bắt buộc</strong></td><td>Chất béo là triester của glycerol với acid béo</td><td>Nền tảng phần lipid</td><td>Nhận diện triglyceride và viết sản phẩm xà phòng hóa</td></tr><tr><td><strong>P1 – Bắt buộc</strong></td><td>Hydrogen hóa chất béo không no</td><td>Liên hệ dầu lỏng → chất béo rắn</td><td>Biết H₂ cộng vào liên kết đôi C=C</td></tr><tr><td><strong>P2 – Quan trọng</strong></td><td>Tính chất vật lí, nhiệt độ sôi, độ tan, mùi ester</td><td>Dạng câu lý thuyết nhanh</td><td>Giải thích bằng liên kết hydrogen và cấu trúc</td></tr><tr><td><strong>P2 – Quan trọng</strong></td><td>Đếm đồng phân ester và phân tích CTPT</td><td>Dễ mất điểm vì bỏ sót cách chia mạch</td><td>Liệt kê có hệ thống theo phần acid/alcohol</td></tr><tr><td><strong>P2 – Quan trọng</strong></td><td>Bài toán xà phòng hóa, đốt cháy, hiệu suất</td><td>Cần thiết lập đúng tỉ lệ mol</td><td>Trình bày được chuỗi dữ kiện → mol → kết quả</td></tr><tr><td><strong>P3 – Củng cố</strong></td><td>Điều chế ester và tách sản phẩm</td><td>Gắn với thí nghiệm</td><td>Hiểu vai trò acid xúc tác, dung dịch rửa và phễu chiết</td></tr><tr><td><strong>P3 – Củng cố</strong></td><td>Ester có gốc vinyl/phenyl; thủy phân tạo sản phẩm đặc biệt</td><td>Có bẫy về enol chuyển hóa thành aldehyde/ketone và tạo phenol</td><td>Theo dõi cấu trúc từng sản phẩm</td></tr><tr><td><strong>P4 – Mở rộng</strong></td><td>Chỉ số acid, biodiesel, tổng hợp aspirin/DEP</td><td>Cần phối hợp nhiều bước và dữ kiện</td><td>Tự kiểm tra đơn vị, hiệu suất và giới hạn của dữ kiện</td></tr></tbody></table></div><h3>Thứ tự học đề xuất</h3><ol><li>P1: học cấu trúc và phản ứng, tự viết lại không nhìn tài liệu.</li><li>P2: luyện nhận dạng, gọi tên, đếm đồng phân và định lượng cơ bản.</li><li>P3: giải bài thí nghiệm và trường hợp đặc biệt.</li><li>P4: làm các câu tổng hợp, sau đó quay lại giải thích vì sao cách làm đúng.</li></ol><hr><h3>2. BẢN ĐỒ KIẾN THỨC &amp; LIÊN KẾT LIÊN CHƯƠNG</h3><h3>2.1. Bản đồ tổng quan</h3><pre><code>ESTER – LIPID<br>│<br>├── A. ESTER<br>│   ├── Cấu tạo: R–COO–R′<br>│   ├── Danh pháp: tên gốc R′ + tên gốc acid<br>│   ├── Vật lí: thường ít tan trong nước; nhiệt độ sôi tương đối thấp<br>│   ├── Điều chế: carboxylic acid + alcohol ⇌ ester + nước<br>│   ├── Thủy phân acid: ester + nước ⇌ acid + alcohol/phenol<br>│   ├── Thủy phân base: ester + kiềm → muối carboxylate + alcohol/phenol<br>│   └── Ứng dụng: hương liệu, dung môi, dược phẩm, polymer<br>│<br>└── B. LIPID<br>    ├── Lipid: không tan trong nước, tan trong dung môi hữu cơ không phân cực<br>    ├── Chất béo: triester của glycerol với acid béo (triglyceride)<br>    ├── Acid béo: acid carboxylic mạch carbon dài<br>    ├── Nhiều gốc no → thường rắn; nhiều gốc không no → thường lỏng<br>    ├── Hydrogen hóa: C=C + H₂ → C–C<br>    ├── Oxi hóa gốc không no → mùi ôi, thiu<br>    └── Ứng dụng: dự trữ năng lượng, hấp thu vitamin tan trong dầu,<br>        nguyên liệu sản xuất xà phòng và glycerol</code></pre><h3>2.2. Các mối liên kết quan trọng</h3><ul><li><strong>Nhóm ester ↔ phản ứng thủy phân:</strong> Nhóm chức –COO– là vị trí biến đổi trong phản ứng thủy phân. Môi trường phản ứng quyết định sản phẩm acid hay muối.</li><li><strong>Ester hóa ↔ thủy phân acid:</strong> Hai quá trình có quan hệ thuận nghịch trong điều kiện acid phù hợp. Không được tự động kết luận phản ứng đạt hoàn toàn.</li><li><strong>Ester đơn giản ↔ chất béo:</strong> Chất béo cũng là ester, nhưng có <strong>ba</strong> liên kết ester hình thành từ glycerol và các acid béo.</li><li><strong>Liên kết đôi C=C ↔ trạng thái chất béo:</strong> Nhiều gốc acid béo không no thường làm chất béo dễ ở trạng thái lỏng; hydrogen hóa làm giảm số liên kết đôi và có thể làm chất béo rắn hơn.</li><li><strong>Thủy phân chất béo ↔ xà phòng:</strong> Xà phòng hóa triglyceride bằng NaOH/KOH tạo glycerol và muối của acid béo.</li><li><strong>Cấu trúc ↔ tính chất vật lí:</strong> Ester không tạo liên kết hydrogen với nhau như alcohol và acid carboxylic tương ứng, góp phần làm nhiệt độ sôi thấp hơn.</li><li><strong>Tính chất ↔ ứng dụng:</strong> Mùi của một số ester dẫn tới ứng dụng làm hương liệu; khả năng hòa tan và bay hơi phù hợp khiến một số ester được dùng làm dung môi.</li></ul><h3>2.3. Chuỗi phản ứng cần thuộc</h3><p><strong>Ester hóa:</strong></p><p>\\[ \\mathrm{RCOOH + R'OH \\rightleftharpoons RCOOR' + H_2O} \\]</p><p>Điều kiện thường nêu trong tài liệu: xúc tác acid, thường dùng H₂SO₄ đặc.</p><p><strong>Thủy phân ester trong môi trường acid:</strong></p><p>\\[ \\mathrm{RCOOR' + H_2O \\rightleftharpoons RCOOH + R'OH} \\]</p><p>Nếu phần –OR′ có nguồn gốc phenol thì sản phẩm tương ứng có thể là phenol.</p><p><strong>Thủy phân ester trong môi trường base:</strong></p><p>\\[ \\mathrm{RCOOR' + NaOH \\rightarrow RCOONa + R'OH} \\]</p><p>Đây là phản ứng một chiều trong phạm vi bài học, thường gọi là xà phòng hóa.</p><p><strong>Xà phòng hóa chất béo:</strong></p><p>\\[ \\mathrm{(RCOO)<em>3C</em>3H<em>5 + 3NaOH \\rightarrow 3RCOONa + C</em>3H<em>5(OH)</em>3} \\]</p><p><strong>Hydrogen hóa triolein (minh họa):</strong></p><p>\\[ \\mathrm{(C<em>{17}H</em>{33}COO)<em>3C</em>3H<em>5 + 3H</em>2 \\rightarrow (C<em>{17}H</em>{35}COO)<em>3C</em>3H_5} \\]</p><hr><h3>3. LÝ THUYẾT + FEYNMAN (DEEP DIVE)</h3><h3>3.1. Ester là gì?</h3><h3>Câu hỏi khởi động</h3><p>Nhìn một công thức hữu cơ, dấu hiệu nào giúp nhận ra ester?</p><h3>Bản chất</h3><p>Ester được tạo ra khi nhóm –OH trong nhóm carboxyl –COOH của carboxylic acid được thay bằng nhóm –OR′. Ester đơn chức có dạng:</p><p>\\[ \\mathrm{RCOOR'} \\]</p><p>Trong đó:</p><ul><li>\\(R\\) có thể là nguyên tử H hoặc gốc hydrocarbon.</li><li>\\(R′\\) là gốc hydrocarbon theo cách mô tả trong tài liệu.</li><li>Nhóm nhận dạng quan trọng là <strong>–COO– nằm giữa phần acyl và phần alkyl/aryl</strong>.</li></ul><p>Ví dụ:</p><ul><li>HCOOCH₃: methyl formate.</li><li>CH₃COOCH₃: methyl acetate.</li><li>CH₃CH₂COOCH₃: methyl propionate.</li><li>CH₃COOC₂H₅: ethyl acetate.</li></ul><h3>Cách tự suy luận</h3><ol><li>Tìm nhóm –COO–.</li><li>Kiểm tra nhóm này có nối phần carbonyl với một nhóm –OR′ hay không.</li><li>Không nhầm ester với acid carboxylic (–COOH), alcohol (–OH) hoặc ketone (C=O nằm giữa hai gốc carbon).</li></ol><h3>Feynman Check</h3><p>Hãy giải thích bằng lời của bạn: vì sao CH₃CH₂COOCH₃ là ester nhưng CH₃CH₂CH₂COOH không phải ester?</p><p><strong>Đáp án tự kiểm:</strong> Chất đầu có nhóm –COO– liên kết với –CH₃ ở phía oxygen; chất sau có nhóm –COOH, tức nhóm acid carboxylic còn nguyên –OH.</p><h3>3.2. Công thức phân tử của ester no, đơn chức, mạch hở</h3><h3>Câu hỏi</h3><p>Một ester có CTPT \\(C<em>nH</em>{2n}O_2\\) có chắc chắn là ester no, đơn chức, mạch hở không?</p><h3>Bản chất</h3><p>Với <strong>ester no, đơn chức, mạch hở</strong>, công thức phân tử tổng quát là:</p><p>\\[ \\mathrm{C<em>nH</em>{2n}O_2,\\quad n\\geq 2} \\]</p><p>Công thức này là dấu hiệu nhận dạng trong phạm vi nhóm chất đang xét, nhưng khi làm bài vẫn phải đọc đầy đủ điều kiện đề. Ester có liên kết đôi C=C, có vòng hoặc có nhiều nhóm chức sẽ không nhất thiết tuân theo công thức trên.</p><h3>Quy trình kiểm tra</h3><ol><li>Đếm C, H, O trong CTPT.</li><li>So với \\(C<em>nH</em>{2n}O_2\\).</li><li>Xem đề có cho mạch hở, no, đơn chức hay không.</li><li>Nếu CTPT thiếu 2 H so với công thức no tương ứng, có thể có thêm một độ bất bão hòa; cần xét cấu trúc chứ không kết luận vội.</li></ol><h3>Feynman Check</h3><p>Vì sao CH₂=CHCOOCH₃ không thuộc loại ester no, đơn chức, mạch hở dù chỉ có một nhóm ester?</p><p><strong>Đáp án tự kiểm:</strong> Vì phân tử có liên kết đôi C=C nên ester không no.</p><h3>3.3. Danh pháp ester</h3><h3>Câu hỏi</h3><p>Khi gọi tên ester, nên đọc từ phía nào?</p><h3>Bản chất</h3><p>Theo quy tắc trong tài liệu, tên ester đơn chức được ghép:</p><p><strong>Tên gốc R′ (phía oxygen) + tên gốc carboxylic acid (phía C=O).</strong></p><p>Ví dụ:</p><ul><li>HCOOC₂H₅ → ethyl formate.</li><li>CH₃COOCH₃ → methyl acetate.</li><li>CH₃CH₂COOCH₃ → methyl propionate.</li><li>CH₃CH₂COOC₂H₅ → ethyl propionate.</li><li>CH₂=CHCOOCH₃ → methyl acrylate.</li><li>CH₃COOCH=CH₂ → vinyl acetate.</li><li>CH₃COOCH(CH₃)₂ → isopropyl acetate.</li></ul><h3>Mẹo tránh nhầm</h3><ul><li>Phía oxygen cho biết gốc alcohol: methyl, ethyl, propyl, vinyl…</li><li>Phía carbonyl cho biết gốc acid: formate, acetate, propionate, butyrate…</li><li>Đừng đảo thứ tự: HCOOC₂H₅ là <strong>ethyl formate</strong>, không phải methyl acetate.</li></ul><h3>Feynman Check</h3><p>Tự gọi tên CH₃CH₂COOCH₃ mà không nhìn ví dụ.</p><p><strong>Đáp án:</strong> methyl propionate.</p><h3>3.4. Tính chất vật lí của ester</h3><h3>Câu hỏi</h3><p>Vì sao nhiều ester có nhiệt độ sôi thấp hơn alcohol và acid carboxylic có phân tử khối tương đương?</p><h3>Bản chất</h3><p>Theo tài liệu, các phân tử ester không tạo liên kết hydrogen với nhau như alcohol và acid carboxylic có nhóm phù hợp. Vì lực hút giữa các phân tử thường yếu hơn, nhiệt độ sôi của ester thường thấp hơn các chất đối chiếu đó.</p><p>Đặc điểm thường gặp:</p><ul><li>Ester phân tử khối thấp và trung bình thường là chất lỏng ở nhiệt độ phòng.</li><li>Ester phân tử khối lớn thường có thể ở dạng rắn.</li><li>Ester thường nhẹ hơn nước và ít tan trong nước.</li><li>Một số ester có mùi thơm của hoa hoặc quả chín.</li></ul><h3>Feynman Check</h3><p>Nếu một câu nói “ester thường tan tốt trong nước”, nên nghi ngờ điều gì?</p><p><strong>Đáp án:</strong> Đây thường là phát biểu sai theo xu hướng chung trong tài liệu; ester thường ít tan trong nước. Cần tránh biến xu hướng “thường” thành quy luật tuyệt đối cho mọi hợp chất.</p><h3>3.5. Thủy phân ester trong môi trường acid</h3><h3>Câu hỏi</h3><p>Sản phẩm thủy phân ester trong môi trường acid là gì? Phản ứng có thuận nghịch không?</p><h3>Bản chất</h3><p>Ester phản ứng với nước, trong môi trường acid, thường tạo carboxylic acid và alcohol tương ứng; trong một số trường hợp tạo phenol. Phản ứng thủy phân acid thường là <strong>thuận nghịch</strong>.</p><p>Ví dụ:</p><p>\\[ \\mathrm{CH<em>3CH</em>2COOCH<em>3 + H</em>2O \\rightleftharpoons CH<em>3CH</em>2COOH + CH_3OH} \\]</p><p>Cách đọc:</p><ul><li>Phần acid của ester trở lại acid propanoic.</li><li>Phần gắn với oxygen trở thành methanol.</li></ul><h3>Quy trình làm bài</h3><ol><li>Cắt liên kết ester ở vị trí C(=O)–O.</li><li>Phần chứa C=O nhận –OH để thành acid.</li><li>Phần còn lại nhận H để thành alcohol/phenol tương ứng.</li><li>Ghi mũi tên thuận nghịch khi đề nêu môi trường acid và điều kiện thông thường của bài học.</li></ol><h3>Feynman Check</h3><p>Vì sao không nên ghi sản phẩm là muối carboxylate khi thủy phân ester trong môi trường acid?</p><p><strong>Đáp án:</strong> Môi trường acid không cung cấp base để chuyển acid carboxylic thành muối; sản phẩm thường được viết là acid.</p><h3>3.6. Thủy phân ester trong môi trường base (xà phòng hóa)</h3><h3>Câu hỏi</h3><p>Điểm khác biệt quan trọng nhất giữa thủy phân acid và thủy phân base là gì?</p><h3>Bản chất</h3><p>Khi đun nóng ester với NaOH hoặc KOH, thường thu được muối carboxylate và alcohol/phenol tương ứng. Trong chương trình này, phản ứng được xem là <strong>một chiều</strong>, gọi là phản ứng xà phòng hóa.</p><p>Ví dụ:</p><p>\\[ \\mathrm{CH<em>3COOCH</em>3 + NaOH \\rightarrow CH<em>3COONa + CH</em>3OH} \\]</p><h3>Quy trình dự đoán sản phẩm</h3><ol><li>Xác định phần acid → chuyển thành muối sodium/potassium carboxylate.</li><li>Xác định phần –OR′ → tạo alcohol tương ứng.</li><li>Với ester có gốc đặc biệt như vinyl hoặc phenyl, xét tiếp tính chất sản phẩm tạo thành; không áp dụng máy móc “luôn chỉ có một muối và một alcohol”.</li><li>Cân bằng phương trình và kiểm tra tỉ lệ mol.</li></ol><h3>Feynman Check</h3><p>CH₃COOC₂H₅ tác dụng NaOH tạo muối gì?</p><p><strong>Đáp án:</strong> CH₃COONa, vì phần acid là acetate; phần alcohol là ethanol.</p><h3>3.7. Điều chế ester và cân bằng phản ứng</h3><h3>Câu hỏi</h3><p>Muốn điều chế ester từ acid carboxylic và alcohol, cần những chất nào?</p><h3>Bản chất</h3><p>Phản ứng ester hóa giữa carboxylic acid và alcohol tạo ester và nước, thường dùng xúc tác acid, ví dụ H₂SO₄ đặc:</p><p>\\[ \\mathrm{RCOOH + R'OH \\rightleftharpoons RCOOR' + H_2O} \\]</p><p>Vì phản ứng thuận nghịch nên không thể chỉ dựa vào việc tăng nhiệt độ để kết luận hiệu suất luôn tăng. Dữ liệu thí nghiệm trong tài liệu cho thấy thể tích ethyl acetate tăng từ 60°C đến 75°C, rồi giảm ở 80°C và 85°C; trong phạm vi nhiệt độ khảo sát, 75°C cho thể tích lớn nhất.</p><h3>Feynman Check</h3><p>Nếu tăng nhiệt độ từ 75°C lên 85°C mà lượng ester thu được giảm, điều đó có bác bỏ nhận định “nhiệt độ càng cao, hiệu suất càng cao” không?</p><p><strong>Đáp án:</strong> Có. Dữ liệu không ủng hộ quan hệ tăng liên tục; kết luận phải dựa trên kết quả thí nghiệm thực tế.</p><h3>3.8. Lipid, chất béo và acid béo</h3><h3>Câu hỏi</h3><p>Mọi lipid có phải là chất béo không?</p><h3>Bản chất</h3><p>Không. Lipid là nhóm hợp chất hữu cơ có trong tế bào sống, không tan trong nước nhưng tan trong dung môi hữu cơ không phân cực. Theo tài liệu, lipid bao gồm chất béo, sáp, steroid, phospholipid…</p><p><strong>Chất béo</strong> là triester của glycerol với acid béo, còn gọi là triglyceride.</p><p><strong>Acid béo</strong> được mô tả trong tài liệu là acid carboxylic đơn chức, có mạch carbon dài (khoảng 12–24 C), không phân nhánh và thường có số carbon chẵn.</p><p>Ví dụ trong tài liệu:</p><ul><li>Palmitic acid: CH₃(CH₂)₁₄COOH.</li><li>Stearic acid: CH₃(CH₂)₁₆COOH.</li><li>Oleic acid: CH₃(CH₂)₇CH=CH(CH₂)₇COOH (viết gọn theo cấu trúc mạch).</li><li>Linoleic acid: có hai liên kết đôi C=C trong mạch.</li></ul><h3>Feynman Check</h3><p>Hãy giải thích vì sao chất béo được xếp vào ester nhưng không đồng nghĩa mọi ester đều là chất béo.</p><p><strong>Đáp án:</strong> Chất béo có ba nhóm ester trong triglyceride, hình thành từ glycerol và acid béo mạch dài; ester là nhóm hợp chất rộng hơn.</p><h3>3.9. Tính chất vật lí của chất béo</h3><ul><li>Chất béo nhẹ hơn nước và không tan trong nước.</li><li>Chất béo dễ tan trong dung môi hữu cơ ít phân cực hoặc không phân cực.</li><li>Chất béo chứa nhiều gốc acid béo bão hòa thường rắn ở điều kiện thường.</li><li>Chất béo chứa nhiều gốc acid béo không bão hòa thường lỏng ở điều kiện thường.</li><li>Mỡ động vật thường rắn; dầu thực vật thường lỏng trong điều kiện thường theo ví dụ của tài liệu.</li></ul><h3>Feynman Check</h3><p>Dầu thực vật thường lỏng có liên hệ gì với liên kết đôi C=C?</p><p><strong>Đáp án:</strong> Dầu thực vật thường chứa nhiều gốc acid béo không no; các liên kết đôi liên quan đến xu hướng tồn tại ở thể lỏng. Đây là xu hướng chung, không nên xem là khẳng định tuyệt đối cho mọi mẫu dầu/mỡ.</p><h3>3.10. Phản ứng của chất béo</h3><h3>A. Hydrogen hóa</h3><p>Chất béo có gốc acid không no có thể cộng H₂ vào liên kết đôi, tạo gốc acid no hơn. Ví dụ triolein có thể chuyển thành tristearin trong sơ đồ minh họa của tài liệu.</p><p><strong>Nhận dạng:</strong> Có H₂, xúc tác Ni, đun nóng; liên kết C=C giảm đi.</p><p><strong>Ứng dụng liên hệ:</strong> Có thể chuyển chất béo lỏng thành chất béo rắn hơn.</p><h3>B. Oxi hóa bởi oxygen không khí</h3><p>Gốc acid béo không no có thể bị oxi hóa tạo hợp chất có mùi khó chịu, gây hiện tượng dầu mỡ ôi, thiu. Dầu mỡ dùng đi dùng lại cũng có thể gặp hiện tượng này.</p><h3>C. Xà phòng hóa</h3><p>Triglyceride phản ứng với NaOH/KOH khi đun nóng, tạo glycerol và muối của acid béo. Muối sodium/potassium của acid béo là thành phần chính của xà phòng theo ngữ cảnh bài học.</p><h3>Feynman Check</h3><p>Phân biệt bằng một câu: hydrogen hóa khác xà phòng hóa ở điểm nào?</p><p><strong>Đáp án:</strong> Hydrogen hóa cộng H₂ vào liên kết đôi C=C của gốc không no; xà phòng hóa thủy phân liên kết ester bằng kiềm, tạo glycerol và muối acid béo.</p><h3>3.11. Ứng dụng của chất béo và acid béo</h3><p>Theo tài liệu:</p><ul><li>Chất béo cung cấp và dự trữ năng lượng ở người và động vật.</li><li>Cung cấp acid béo thiết yếu.</li><li>Hỗ trợ vận chuyển và hấp thu các vitamin tan trong dầu: A, D, E, K.</li><li>Là nguyên liệu cho công nghiệp thực phẩm, sản xuất xà phòng và glycerol.</li><li>Omega-3 và omega-6 đều có vai trò quan trọng; chế độ dinh dưỡng cần bảo đảm cung cấp đủ.</li></ul><h3>Feynman Check</h3><p>Nêu hai vai trò sinh học và hai ứng dụng công nghiệp của chất béo.</p><p><strong>Đáp án gợi ý:</strong> Dự trữ năng lượng; giúp hấp thu vitamin A, D, E, K; nguyên liệu sản xuất xà phòng; nguồn nguyên liệu tạo glycerol.</p><hr><h3>4. BẢNG SO SÁNH KIẾN THỨC DỄ NHẦM &amp; BẪY</h3><h3>4.1. Ester – acid carboxylic – alcohol</h3><div class=\"table-wrap\"><table><thead><tr><th>Tiêu chí</th><th>Ester</th><th>Acid carboxylic</th><th>Alcohol</th></tr></thead><tbody><tr><td>Nhóm đặc trưng</td><td>–COO–</td><td>–COOH</td><td>–OH gắn với carbon phù hợp</td></tr><tr><td>Ví dụ</td><td>CH₃COOCH₃</td><td>CH₃COOH</td><td>C₂H₅OH</td></tr><tr><td>Thủy phân/biến đổi đang học</td><td>Thủy phân acid/base</td><td>Có thể tạo ester với alcohol</td><td>Có thể tạo ester với acid</td></tr><tr><td>Bẫy</td><td>Nhầm ester với acid vì đều có C=O và O</td><td>Nhìn –COOH thành ester</td><td>Nhầm mọi hợp chất có O là alcohol</td></tr></tbody></table></div><h3>4.2. Thủy phân acid và base</h3><div class=\"table-wrap\"><table><thead><tr><th>Điểm so sánh</th><th>Môi trường acid</th><th>Môi trường base</th></tr></thead><tbody><tr><td>Tác chất chính</td><td>Ester + nước, xúc tác/môi trường acid</td><td>Ester + NaOH/KOH</td></tr><tr><td>Sản phẩm chính</td><td>Acid carboxylic + alcohol/phenol tương ứng</td><td>Muối carboxylate + alcohol/phenol tương ứng</td></tr><tr><td>Chiều phản ứng trong bài học</td><td>Thường thuận nghịch</td><td>Một chiều</td></tr><tr><td>Tên gọi</td><td>Thủy phân ester</td><td>Xà phòng hóa khi dùng kiềm</td></tr><tr><td>Bẫy</td><td>Ghi muối dù môi trường acid</td><td>Ghi acid tự do thay cho muối</td></tr></tbody></table></div><h3>4.3. Ester đơn giản và chất béo</h3><div class=\"table-wrap\"><table><thead><tr><th>Tiêu chí</th><th>Ester đơn giản</th><th>Chất béo</th></tr></thead><tbody><tr><td>Phần alcohol ban đầu</td><td>Thường một alcohol phân tử nhỏ trong ví dụ</td><td>Glycerol</td></tr><tr><td>Số nhóm ester trong phân tử</td><td>Ester đơn chức có một nhóm ester</td><td>Triglyceride có ba nhóm ester</td></tr><tr><td>Phần acid</td><td>Acid carboxylic</td><td>Acid béo</td></tr><tr><td>Thủy phân bằng kiềm</td><td>Muối carboxylate + alcohol/phenol</td><td>Muối acid béo + glycerol</td></tr><tr><td>Bẫy</td><td>Nghĩ ester nào cũng là chất béo</td><td>Nhầm chất béo là acid béo tự do</td></tr></tbody></table></div><h3>4.4. Acid béo no và không no</h3><div class=\"table-wrap\"><table><thead><tr><th>Đặc điểm</th><th>Acid béo no</th><th>Acid béo không no</th></tr></thead><tbody><tr><td>Liên kết C=C trong mạch</td><td>Không có</td><td>Có ít nhất một</td></tr><tr><td>Ví dụ trong tài liệu</td><td>Palmitic, stearic</td><td>Oleic, linoleic</td></tr><tr><td>Chất béo chứa nhiều gốc tương ứng</td><td>Thường rắn</td><td>Thường lỏng</td></tr><tr><td>Phản ứng nổi bật</td><td>Không hydrogen hóa vào C=C nếu không có liên kết đôi</td><td>Có thể cộng H₂ vào C=C</td></tr><tr><td>Bẫy</td><td>Gọi mọi acid béo là no</td><td>Quên đếm liên kết đôi khi tính lượng H₂</td></tr></tbody></table></div><h3>4.5. Hydrogen hóa và oxi hóa gây ôi</h3><div class=\"table-wrap\"><table><thead><tr><th>Tiêu chí</th><th>Hydrogen hóa</th><th>Oxi hóa bởi oxygen không khí</th></tr></thead><tbody><tr><td>Tác nhân</td><td>H₂, thường có xúc tác Ni và đun nóng</td><td>O₂ trong không khí</td></tr><tr><td>Biến đổi chính</td><td>C=C thành C–C</td><td>Tạo các hợp chất gây mùi khó chịu</td></tr><tr><td>Kết quả dễ quan sát/liên hệ</td><td>Chất béo no hơn, có thể rắn hơn</td><td>Dầu mỡ ôi, thiu</td></tr><tr><td>Bẫy</td><td>Gán H₂ vào phản ứng xà phòng hóa</td><td>Cho rằng ôi dầu là do cộng H₂</td></tr></tbody></table></div><h3>4.6. Tính chất vật lí – các bẫy trắc nghiệm</h3><div class=\"table-wrap\"><table><thead><tr><th>Phát biểu</th><th>Đánh giá theo tài liệu</th><th>Lý do</th></tr></thead><tbody><tr><td>Ester thường nhẹ hơn nước</td><td>Đúng theo xu hướng chung</td><td>Tính chất vật lí được nêu trong tài liệu</td></tr><tr><td>Ester thường tan tốt trong nước</td><td>Sai theo xu hướng chung</td><td>Tài liệu nêu ester thường ít tan trong nước</td></tr><tr><td>Ester có nhiệt độ sôi thấp hơn alcohol/acid có phân tử khối tương đương</td><td>Thường đúng</td><td>Không tạo liên kết hydrogen với nhau như các chất đối chiếu</td></tr><tr><td>Chất béo tan tốt trong nước</td><td>Sai</td><td>Chất béo không tan trong nước</td></tr><tr><td>Nhiều gốc acid béo no thường làm chất béo rắn hơn</td><td>Đúng theo xu hướng chung</td><td>Ví dụ mỡ động vật</td></tr><tr><td>Mọi ester đều có mùi thơm và đều an toàn</td><td>Không được kết luận như vậy</td><td>Tài liệu chỉ nói một số ester có mùi thơm và được dùng phù hợp</td></tr></tbody></table></div><h3>4.7. Những bẫy cấu trúc đặc biệt</h3><div class=\"table-wrap\"><table><thead><tr><th>Trường hợp</th><th>Cách xử lý</th></tr></thead><tbody><tr><td>Ester có gốc vinyl, ví dụ CH₃COOCH=CH₂</td><td>Sau thủy phân, phần vinyl alcohol có thể chuyển hóa thành aldehyde tương ứng; cần xét sản phẩm cuối cùng theo bài</td></tr><tr><td>Ester phenyl, ví dụ CH₃COOC₆H₅</td><td>Thủy phân base có thể tạo phenol; phenol phản ứng với base nên bài có thể thu được thêm muối phenoxide</td></tr><tr><td>Ester có nhiều nhóm ester</td><td>Tính số mol kiềm theo số nhóm ester có thể bị thủy phân</td></tr><tr><td>Chất béo có nhiều liên kết đôi</td><td>Số mol H₂ phụ thuộc số liên kết đôi, không chỉ phụ thuộc số mol triglyceride</td></tr><tr><td>Phản ứng ester hóa thuận nghịch</td><td>Không được mặc định hiệu suất 100%</td></tr><tr><td>Tách ester khỏi hỗn hợp</td><td>Dựa vào độ tan, phản ứng acid-base và nhiệt độ sôi; không giả định ester luôn là lớp dưới</td></tr></tbody></table></div><hr><h3>5. CẨM NANG DẠNG BÀI (PATTERN RECOGNITION)</h3><h3>Pattern E1 — Nhận diện ester</h3><ul><li><strong>Dấu hiệu:</strong> Cho nhiều CTCT, hỏi chất nào thuộc loại ester.</li><li><strong>Chiến lược:</strong> Tìm nhóm –COO–; xác định oxygen nối với gốc hữu cơ ở phía bên kia.</li><li><strong>Bẫy:</strong> Nhầm –COOH với –COO–; nhầm hợp chất có cả –OH và C=O với ester.</li><li><strong>Tự kiểm:</strong> Viết tên nhóm chức bên cạnh mỗi phương án trước khi chọn.</li></ul><h3>Pattern E2 — Nhận biết ester no, đơn chức, mạch hở</h3><ul><li><strong>Dấu hiệu:</strong> Cho CTPT hoặc nhiều công thức, hỏi loại no/không no, đơn chức/đa chức.</li><li><strong>Chiến lược:</strong> Với ester no, đơn chức, mạch hở dùng \\(C<em>nH</em>{2n}O_2\\), \\(n\\ge2\\); sau đó kiểm tra cấu trúc nếu được cho CTCT.</li><li><strong>Bẫy:</strong> CTPT phù hợp chưa đủ nếu đề không bảo đảm đúng loại cấu trúc; liên kết C=C làm chất không no.</li><li><strong>Tự kiểm:</strong> Đếm nhóm –COO– và đếm liên kết đôi/vòng.</li></ul><h3>Pattern E3 — Gọi tên ester từ CTCT</h3><ul><li><strong>Dấu hiệu:</strong> HCOOC₂H₅, CH₃COOCH₃, CH₃CH₂COOCH₃…</li><li><strong>Chiến lược:</strong> Tách tại liên kết C(=O)–O; gọi gốc phía oxygen trước, gốc acid sau.</li><li><strong>Bẫy:</strong> Đảo ethyl/methyl; nhầm propionate với acetate.</li><li><strong>Tự kiểm:</strong> Viết tên gốc alcohol và tên acid thành hai cột rồi ghép.</li></ul><h3>Pattern E4 — Viết CTCT từ tên ester</h3><ul><li><strong>Dấu hiệu:</strong> Cho tên như ethyl acetate, methyl propionate, vinyl acetate.</li><li><strong>Chiến lược:</strong> Viết phần acid trước: acetate → CH₃COO–; propionate → CH₃CH₂COO–; formate → HCOO–. Sau đó gắn gốc alcohol ở oxygen.</li><li><strong>Bẫy:</strong> Vinyl là CH₂=CH–, không phải ethyl; methyl là –CH₃.</li><li><strong>Tự kiểm:</strong> Đọc lại công thức từ hai đầu và kiểm tra số carbon.</li></ul><h3>Pattern E5 — Đếm đồng phân ester</h3><ul><li><strong>Dấu hiệu:</strong> “Có bao nhiêu ester có CTPT…?”</li><li><strong>Chiến lược tổng quát:</strong></li></ul><ol><li>Xác định công thức có thuộc ester no, đơn chức, mạch hở hay không.</li><li>Chia số carbon giữa phần acid và phần gốc alcohol.</li><li>Liệt kê từng trường hợp theo số carbon phía acid.</li><li>Với mỗi trường hợp, liệt kê các gốc cấu tạo khác nhau.</li><li>Loại cấu trúc không phải ester hoặc trùng lặp.</li></ol><ul><li><strong>Bẫy:</strong> Bỏ sót formate; đếm cùng một cấu trúc hai lần; quên nhánh ở gốc alkyl.</li><li><strong>Tự kiểm:</strong> Lập bảng “phần acid / phần alcohol / công thức”.</li></ul><h3>Pattern E6 — Thủy phân ester trong acid</h3><ul><li><strong>Dấu hiệu:</strong> Ester + H₂O/H₂SO₄ loãng, đun nóng.</li><li><strong>Chiến lược:</strong> Tách nhóm ester thành acid carboxylic và alcohol/phenol tương ứng; dùng mũi tên thuận nghịch.</li><li><strong>Bẫy:</strong> Ghi muối; cho rằng phản ứng một chiều.</li><li><strong>Tự kiểm:</strong> Kiểm tra tổng số nguyên tử C và O hai vế.</li></ul><h3>Pattern E7 — Thủy phân ester bằng NaOH/KOH</h3><ul><li><strong>Dấu hiệu:</strong> “Đun nóng với dung dịch NaOH/KOH”, “xà phòng hóa”.</li><li><strong>Chiến lược:</strong> Acid part → muối carboxylate; alkoxy part → alcohol/phenol sau khi xét trường hợp đặc biệt.</li><li><strong>Bẫy:</strong> Viết acid tự do; quên hệ số kiềm; bỏ qua phản ứng tiếp theo của phenol.</li><li><strong>Tự kiểm:</strong> Cân bằng nguyên tử và điện tích; tính số mol kiềm theo số nhóm ester.</li></ul><h3>Pattern E8 — Nhận ra phản ứng thuận nghịch</h3><ul><li><strong>Dấu hiệu:</strong> So sánh thủy phân acid với thủy phân kiềm hoặc hydrogen hóa.</li><li><strong>Chiến lược:</strong> Trong phạm vi tài liệu, ester hóa và thủy phân acid thường thuận nghịch; thủy phân kiềm được xem là một chiều.</li><li><strong>Bẫy:</strong> Gọi tất cả phản ứng có ester là thuận nghịch.</li><li><strong>Tự kiểm:</strong> Xem môi trường phản ứng trước khi chọn.</li></ul><h3>Pattern E9 — Tìm sản phẩm đặc biệt của ester vinyl/phenyl</h3><ul><li><strong>Dấu hiệu:</strong> Gốc –OCH=CH₂ hoặc –OC₆H₅.</li><li><strong>Chiến lược:</strong> Viết sản phẩm sơ cấp rồi xét tính chất của sản phẩm đó trong môi trường phản ứng.</li><li><strong>Bẫy:</strong> Coi sản phẩm phía oxygen luôn là alcohol bền; bỏ qua phản ứng của phenol với NaOH.</li><li><strong>Tự kiểm:</strong> Kiểm tra xem sản phẩm có nhóm chức tiếp tục phản ứng hay không.</li></ul><h3>Pattern E10 — Tính lượng chất từ phản ứng đốt cháy</h3><ul><li><strong>Dấu hiệu:</strong> Cho khối lượng ester, CO₂, H₂O hoặc kết tủa CaCO₃.</li><li><strong>Chiến lược:</strong></li></ul><ol><li>Từ CO₂ tính \\(n<em>C=n</em>{CO_2}\\).</li><li>Từ H₂O tính \\(n<em>H=2n</em>{H_2O}\\).</li><li>Nếu ester chỉ chứa C, H, O, suy ra lượng O bằng bảo toàn khối lượng/nguyên tử khi đủ dữ kiện.</li><li>Tìm CTĐG rồi kiểm tra với CTPT có thể có.</li></ol><ul><li><strong>Bẫy:</strong> Quên 1 mol CaCO₃ tương ứng 1 mol CO₂ bị hấp thụ trong điều kiện kết tủa hoàn toàn; nhầm đkc với điều kiện tiêu chuẩn khác nhau.</li><li><strong>Tự kiểm:</strong> Đối chiếu khối lượng nguyên tố với khối lượng mẫu.</li></ul><h3>Pattern E11 — Bài toán thủy phân ester từ mol NaOH</h3><ul><li><strong>Dấu hiệu:</strong> NaOH vừa đủ, cho khối lượng alcohol và muối.</li><li><strong>Chiến lược:</strong></li></ul><ol><li>\\(n_{NaOH}\\) bằng tổng mol ester đơn chức bị xà phòng hóa nếu mỗi phân tử có một nhóm ester phản ứng.</li><li>Dùng khối lượng alcohol để tìm \\(M\\) và số mol alcohol khi biết cấu trúc/độ tinh khiết phù hợp.</li><li>Từ muối xác định gốc acid.</li><li>Ghép hai phần để suy ra tên ester.</li></ol><ul><li><strong>Bẫy:</strong> Dùng sai khối lượng mol; nhầm muối với acid; bỏ qua trường hợp ester đặc biệt.</li><li><strong>Tự kiểm:</strong> Phương trình phản ứng phải giải thích được cả lượng muối và alcohol.</li></ul><h3>Pattern L1 — Nhận diện chất béo</h3><ul><li><strong>Dấu hiệu:</strong> Hỏi chất nào là triester của glycerol với acid béo.</li><li><strong>Chiến lược:</strong> Nhìn khung glycerol C₃H₅ và ba nhóm –OOCR có gốc acid béo dài.</li><li><strong>Bẫy:</strong> Công thức có ba nhóm acetate ngắn không mặc nhiên là chất béo theo định nghĩa của tài liệu.</li><li><strong>Tự kiểm:</strong> Kiểm tra có đủ ba gốc acid béo hay không.</li></ul><h3>Pattern L2 — Xà phòng hóa chất béo</h3><ul><li><strong>Dấu hiệu:</strong> Triglyceride + NaOH/KOH, hỏi glycerol, muối hoặc khối lượng xà phòng.</li><li><strong>Chiến lược:</strong> 1 mol triglyceride tiêu thụ 3 mol NaOH và tạo 1 mol glycerol + 3 mol muối acid béo.</li><li><strong>Bẫy:</strong> Dùng tỉ lệ 1:1; quên muối chiếm một phần khối lượng bánh xà phòng chứ không phải toàn bộ.</li><li><strong>Tự kiểm:</strong> Kiểm tra tỉ lệ mol 1:3:1:3.</li></ul><h3>Pattern L3 — Hydrogen hóa chất béo</h3><ul><li><strong>Dấu hiệu:</strong> Dầu thực vật lỏng chuyển thành bơ/chất béo rắn; H₂/Ni.</li><li><strong>Chiến lược:</strong> Đếm tổng số liên kết đôi C=C có thể phản ứng; mỗi C=C tiêu thụ 1 mol H₂.</li><li><strong>Bẫy:</strong> Mặc định mỗi phân tử triglyceride chỉ cộng 1 mol H₂.</li><li><strong>Tự kiểm:</strong> Đếm số gốc không no và số liên kết đôi trong từng gốc.</li></ul><h3>Pattern L4 — So sánh trạng thái rắn/lỏng</h3><ul><li><strong>Dấu hiệu:</strong> Chọn tristearin, triolein, tripalmitin…</li><li><strong>Chiến lược:</strong> Xác định gốc acid no hay không no; gốc không no có C=C.</li><li><strong>Bẫy:</strong> Nhầm tên gốc: stearic/palmitic là no; oleic là không no.</li><li><strong>Tự kiểm:</strong> Ghi “no/không no” cạnh từng gốc trước khi chọn.</li></ul><h3>Pattern L5 — Tính toán xà phòng và glycerol</h3><ul><li><strong>Dấu hiệu:</strong> Cho khối lượng chất béo và khối lượng glycerol hoặc ngược lại.</li><li><strong>Chiến lược:</strong> Dùng \\(n<em>{glycerol}=n</em>{triglyceride}\\) với triglyceride tinh khiết; từ đó suy ra mol chất béo, NaOH và muối theo phương trình.</li><li><strong>Bẫy:</strong> Chất béo mẫu có thể là hỗn hợp triglyceride và acid béo tự do; không được dùng giả thiết tinh khiết nếu đề cho thành phần khác.</li><li><strong>Tự kiểm:</strong> Tách riêng phản ứng của triglyceride và acid béo tự do nếu đề yêu cầu.</li></ul><h3>Pattern L6 — Chỉ số acid</h3><ul><li><strong>Dấu hiệu:</strong> Định nghĩa số mg KOH cần để trung hòa acid béo tự do trong 1 g mẫu, nhưng dữ kiện chuẩn độ cho NaOH.</li><li><strong>Chiến lược:</strong> Tính mol base từ \\(n=CV\\); dùng tỉ lệ trung hòa acid-base 1:1 cho acid đơn chức; quy đổi sang lượng KOH tương đương rồi chia khối lượng mẫu.</li><li><strong>Bẫy:</strong> Dùng mL thay cho L; nhầm khối lượng mẫu 2,00 g với 1 g; quên quy đổi sang mg.</li><li><strong>Tự kiểm:</strong> Đơn vị cuối cùng bắt buộc là mg KOH/g mẫu.</li></ul><h3>Pattern T1 — Điều chế và tách ester trong phòng thí nghiệm</h3><ul><li><strong>Dấu hiệu:</strong> Có bình cầu, sinh hàn, dung dịch rửa, phễu chiết.</li><li><strong>Chiến lược:</strong> Nhận diện phản ứng ester hóa; sinh hàn hồi lưu hạn chế mất chất bay hơi; phễu chiết tách hai lớp chất lỏng không trộn lẫn; dung dịch NaHCO₃ có thể trung hòa acid còn dư; chất làm khan loại nước còn lại.</li><li><strong>Bẫy:</strong> Không mặc định lớp ester luôn ở trên hoặc dưới; cần dựa vào khối lượng riêng và dữ kiện thí nghiệm.</li><li><strong>Tự kiểm:</strong> Nêu mục đích của từng bước, không chỉ học thuộc tên dụng cụ.</li></ul><h3>Pattern T2 — Bài toán hiệu suất</h3><ul><li><strong>Dấu hiệu:</strong> Cho hiệu suất %, lượng chất ban đầu hoặc sản phẩm thực tế.</li><li><strong>Chiến lược:</strong></li></ul><ol><li>Viết phương trình và xác định chất giới hạn.</li><li>Tính lượng sản phẩm lý thuyết.</li><li>\\(H\\%=\\frac{\\text{lượng thực tế}}{\\text{lượng lý thuyết}}\\times100\\%\\).</li><li>Nếu đề yêu cầu lượng nguyên liệu tối thiểu, chia lượng lý thuyết cần có cho hiệu suất thích hợp.</li></ol><ul><li><strong>Bẫy:</strong> Nhân hiệu suất ở bước sai; nhầm khối lượng với số mol.</li><li><strong>Tự kiểm:</strong> Hiệu suất dưới 100% thì lượng sản phẩm thực tế không vượt lý thuyết.</li></ul><hr><h3>6. BỘ THẺ GHI NHỚ (FLASHCARDS — DẠNG BẢNG)</h3><div class=\"table-wrap\"><table><thead><tr><th>Mặt trước – Câu hỏi</th><th>Mặt sau – Đáp án ngắn</th></tr></thead><tbody><tr><td>Ester đơn chức có dạng chung nào?</td><td>RCOOR′</td></tr><tr><td>Trong RCOOR′, R có thể là gì?</td><td>H hoặc gốc hydrocarbon</td></tr><tr><td>R′ trong công thức ester là gì?</td><td>Gốc hydrocarbon theo phạm vi tài liệu</td></tr><tr><td>Nhóm chức nhận diện ester?</td><td>–COO–</td></tr><tr><td>Quy tắc gọi tên ester?</td><td>Tên gốc R′ + tên gốc carboxylic acid</td></tr><tr><td>HCOOC₂H₅ tên gì?</td><td>Ethyl formate</td></tr><tr><td>CH₃COOCH₃ tên gì?</td><td>Methyl acetate</td></tr><tr><td>CH₃CH₂COOCH₃ tên gì?</td><td>Methyl propionate</td></tr><tr><td>CTPT ester no, đơn chức, mạch hở?</td><td>CₙH₂ₙO₂, n ≥ 2</td></tr><tr><td>Thủy phân ester trong acid cho gì?</td><td>Acid carboxylic + alcohol/phenol tương ứng</td></tr><tr><td>Thủy phân ester trong acid thường thuận nghịch hay một chiều?</td><td>Thường thuận nghịch</td></tr><tr><td>Thủy phân ester trong NaOH cho gì?</td><td>Muối carboxylate + alcohol/phenol tương ứng</td></tr><tr><td>Xà phòng hóa là gì?</td><td>Thủy phân ester trong môi trường base</td></tr><tr><td>Chất xúc tác thường dùng trong ester hóa?</td><td>Acid, thường H₂SO₄ đặc</td></tr><tr><td>Vì sao ester thường có nhiệt độ sôi thấp hơn alcohol/acid tương đương?</td><td>Không tạo liên kết hydrogen với nhau như các chất đối chiếu</td></tr><tr><td>Ester thường tan nhiều hay ít trong nước?</td><td>Thường ít tan</td></tr><tr><td>Lipid tan trong nước không?</td><td>Không tan trong nước; tan trong dung môi hữu cơ không phân cực</td></tr><tr><td>Chất béo là gì?</td><td>Triester của glycerol với acid béo</td></tr><tr><td>Tên khác của chất béo trong tài liệu?</td><td>Triglyceride</td></tr><tr><td>Acid béo thường có đặc điểm mạch nào?</td><td>Mạch carbon dài, không phân nhánh, thường số C chẵn</td></tr><tr><td>Palmitic acid và stearic acid là no hay không no?</td><td>No</td></tr><tr><td>Oleic acid là no hay không no?</td><td>Không no</td></tr><tr><td>Chất béo nhiều gốc no thường ở trạng thái nào?</td><td>Thường rắn</td></tr><tr><td>Chất béo nhiều gốc không no thường ở trạng thái nào?</td><td>Thường lỏng</td></tr><tr><td>Hydrogen hóa chất béo làm gì?</td><td>Cộng H₂ vào C=C, làm gốc no hơn</td></tr><tr><td>Dầu mỡ ôi thiu liên quan phản ứng nào?</td><td>Oxi hóa gốc acid béo không no bởi O₂ không khí</td></tr><tr><td>Xà phòng hóa triglyceride tạo gì?</td><td>Glycerol và muối acid béo</td></tr><tr><td>1 mol triglyceride cần bao nhiêu mol NaOH theo phương trình tổng quát?</td><td>3 mol</td></tr><tr><td>1 mol triglyceride tạo bao nhiêu mol glycerol?</td><td>1 mol</td></tr><tr><td>Chất béo giúp hấp thu vitamin nào?</td><td>A, D, E, K</td></tr><tr><td>Chất béo là nguyên liệu công nghiệp để sản xuất gì?</td><td>Xà phòng và glycerol; còn dùng trong công nghiệp thực phẩm</td></tr><tr><td>Ethyl butyrate có mùi gì theo tài liệu bài tập?</td><td>Dứa</td></tr><tr><td>Isoamyl acetate có mùi gì theo tài liệu bài tập?</td><td>Chuối chín</td></tr><tr><td>Benzyl acetate có mùi gì theo tài liệu bài tập?</td><td>Hoa nhài</td></tr><tr><td>Mỗi liên kết đôi C=C cộng tối đa bao nhiêu mol H₂?</td><td>1 mol H₂</td></tr><tr><td>Đơn vị chỉ số acid?</td><td>mg KOH/g mẫu</td></tr><tr><td>Vì sao không thể kết luận nhiệt độ càng cao thì hiệu suất ester hóa càng cao?</td><td>Phải dựa vào dữ liệu; phản ứng thuận nghịch và thực nghiệm có thể cho cực đại ở nhiệt độ trung gian</td></tr></tbody></table></div><hr><h3>7. NGÂN HÀNG ACTIVE RECALL (KÈM SUY LUẬN NGƯỢC)</h3><p><strong>Cách dùng:</strong> Che cột gợi ý/đáp án. Trả lời thành tiếng hoặc viết ra giấy trước khi mở đáp án. Với câu suy luận ngược, bắt đầu từ sản phẩm hoặc hiện tượng để truy ra chất ban đầu/phản ứng.</p><div class=\"table-wrap\"><table><thead><tr><th>#</th><th>Câu hỏi tự kiểm tra</th><th>Gợi ý/đáp án để tự chấm</th></tr></thead><tbody><tr><td>1</td><td>Viết công thức chung ester đơn chức.</td><td>RCOOR′</td></tr><tr><td>2</td><td>Từ CH₃CH₂COOCH₃, xác định phần acid và phần alcohol ban đầu.</td><td>Acid propanoic; methanol</td></tr><tr><td>3</td><td>Gọi tên HCOOC₂H₅.</td><td>Ethyl formate</td></tr><tr><td>4</td><td>Viết CTCT methyl acetate.</td><td>CH₃COOCH₃</td></tr><tr><td>5</td><td>Một ester có C=C thuộc loại no hay không no?</td><td>Không no</td></tr><tr><td>6</td><td>Viết phương trình thủy phân acid của CH₃COOCH₃.</td><td>CH₃COOCH₃ + H₂O ⇌ CH₃COOH + CH₃OH</td></tr><tr><td>7</td><td>Viết phương trình xà phòng hóa CH₃COOC₂H₅ bằng NaOH.</td><td>CH₃COOC₂H₅ + NaOH → CH₃COONa + C₂H₅OH</td></tr><tr><td>8</td><td>Vì sao thủy phân acid thường thuận nghịch?</td><td>Quá trình có chiều thủy phân và chiều ester hóa ngược lại</td></tr><tr><td>9</td><td>Suy luận ngược: sản phẩm gồm CH₃COONa và CH₃OH. Một ester đơn chức phù hợp là gì?</td><td>CH₃COOCH₃</td></tr><tr><td>10</td><td>Suy luận ngược: xà phòng hóa tạo glycerol. Chất ban đầu có khả năng là loại hợp chất nào?</td><td>Chất béo/triglyceride</td></tr><tr><td>11</td><td>Suy luận ngược: sản phẩm có sodium butanoate. Phần acid của ester ban đầu là gì?</td><td>Acid butanoic; gốc acid là butanoate</td></tr><tr><td>12</td><td>Một triglyceride có ba gốc acid béo; cần bao nhiêu mol NaOH để xà phòng hóa hoàn toàn 1 mol?</td><td>3 mol</td></tr><tr><td>13</td><td>Suy luận ngược: chất béo lỏng chuyển thành chất béo rắn hơn khi xử lý với H₂/Ni. Phản ứng gì xảy ra?</td><td>Hydrogen hóa liên kết đôi</td></tr><tr><td>14</td><td>Vì sao dầu ăn dùng nhiều lần có thể có mùi khó chịu?</td><td>Oxi hóa các gốc acid béo không no</td></tr><tr><td>15</td><td>Nêu hai khác biệt giữa thủy phân ester acid và base.</td><td>Acid cho acid/alcohol, thuận nghịch; base cho muối/alcohol, một chiều</td></tr><tr><td>16</td><td>Có một ester CTPT C₄H₈O₂. Nêu cách bắt đầu đếm đồng phân.</td><td>Chia số C giữa phần acid và phần alcohol, liệt kê có hệ thống</td></tr><tr><td>17</td><td>Một mẫu có 0,10 mol triglyceride tinh khiết. Theo phương trình tổng quát, tạo bao nhiêu mol glycerol và tiêu thụ bao nhiêu mol NaOH?</td><td>0,10 mol glycerol; 0,30 mol NaOH</td></tr><tr><td>18</td><td>Một chất béo có 2 liên kết đôi trên mỗi phân tử triglyceride. 1 mol chất béo cần bao nhiêu mol H₂ để hydrogen hóa hoàn toàn các liên kết đôi đó?</td><td>2 mol H₂, nếu đúng tổng cộng hai liên kết đôi có thể phản ứng</td></tr><tr><td>19</td><td>Suy luận ngược: chỉ số acid cao hơn giới hạn 2 trong tài liệu gợi ý điều gì?</td><td>Dầu có thể đã ôi hoặc bị phân hủy đáng kể, không còn phù hợp dùng làm thực phẩm theo tài liệu</td></tr><tr><td>20</td><td>Tại sao phải dùng phễu chiết trong quy trình tách một số ester?</td><td>Tách các lớp chất lỏng không trộn lẫn</td></tr><tr><td>21</td><td>Vai trò của chất làm khan sau khi rửa sản phẩm ester là gì?</td><td>Loại nước còn sót</td></tr><tr><td>22</td><td>Vì sao thêm NaHCO₃ loãng có thể giúp tách ester khỏi hỗn hợp còn acid?</td><td>Trung hòa acid thành muối tan trong pha nước; ester có thể tách lớp</td></tr><tr><td>23</td><td>Nếu thể tích ester thu được giảm khi nhiệt độ tăng từ 75°C lên 85°C, kết luận nào không hợp lý?</td><td>“Nhiệt độ càng cao thì hiệu suất càng cao”</td></tr><tr><td>24</td><td>Nêu bốn vitamin tan trong dầu được nhắc trong tài liệu.</td><td>A, D, E, K</td></tr><tr><td>25</td><td>Phân biệt “lipid” và “chất béo” trong một câu.</td><td>Lipid là nhóm rộng; chất béo là triglyceride, triester của glycerol với acid béo</td></tr></tbody></table></div><h3>7.1. Bài tự luyện theo cấp độ</h3><h3>Cấp 1 — Nhận dạng</h3><ol><li>Phân loại: CH₃COOCH₃, CH₃COOH, C₂H₅OH, CH₃CH₂COOCH₃.</li><li>Gọi tên: HCOOCH₃, CH₃COOC₂H₅, CH₃CH₂COOCH₃.</li><li>Viết công thức: ethyl acetate, methyl propionate, vinyl acetate.</li></ol><h3>Cấp 2 — Phản ứng</h3><ol><li>Viết phương trình thủy phân acid của ethyl acetate.</li><li>Viết phương trình xà phòng hóa methyl acetate.</li><li>Viết phương trình tổng quát xà phòng hóa chất béo bằng NaOH.</li><li>Giải thích sự khác nhau giữa hydrogen hóa và oxi hóa gây ôi.</li></ol><h3>Cấp 3 — Suy luận</h3><ol><li>Xà phòng hóa ester X thu sodium butanoate và methanol. Suy ra công thức cấu tạo phù hợp của X.</li><li>Một triglyceride chứa ba gốc oleate. Mỗi gốc oleate có một C=C. Tính số mol H₂ cần cho 0,25 mol triglyceride để hydrogen hóa hoàn toàn.</li><li>Một mẫu chất béo tinh khiết xà phòng hóa tạo 0,20 mol glycerol. Tính mol triglyceride ban đầu và mol NaOH đã phản ứng theo phương trình tổng quát.</li></ol><h3>Đáp án kiểm tra nhanh</h3><ol><li>Ester; acid carboxylic; alcohol; ester.</li><li>Methyl formate; ethyl acetate; methyl propionate.</li><li>CH₃CH₂COOC₂H₅; CH₃CH₂COOCH₃; CH₃COOCH=CH₂.</li><li>CH₃COOC₂H₅ + H₂O ⇌ CH₃COOH + C₂H₅OH.</li><li>CH₃COOCH₃ + NaOH → CH₃COONa + CH₃OH.</li><li>(RCOO)₃C₃H₅ + 3NaOH → 3RCOONa + C₃H₅(OH)₃.</li><li>Hydrogen hóa cộng H₂ vào C=C; oxi hóa bởi O₂ tạo các chất gây mùi ôi.</li><li>CH₃CH₂CH₂COOCH₃.</li><li>Mỗi triglyceride có 3 C=C; \\(n<em>{H</em>2}=0,25\\times3=0,75\\) mol.</li><li>\\(n<em>{triglyceride}=0,20\\) mol; \\(n</em>{NaOH}=3\\times0,20=0,60\\) mol.</li></ol><hr><h3>8. NGÂN HÀNG BÀI TẬP NGUỒN &amp; ĐÁP ÁN</h3><h3>8.1. Đáp án nhanh theo tệp đáp án đính kèm</h3><p>Bảng dưới đây giữ nguyên đáp án được cung cấp trong tệp <strong>“Buổi 1 – Ester Lipid Đáp án”</strong>. Với câu cần tính toán, hãy dùng lời giải của chính mình để kiểm tra lại; bảng đáp án ngắn không thay thế lập luận.</p><div class=\"table-wrap\"><table><thead><tr><th>Câu</th><th>Đáp án nguồn</th><th>Câu</th><th>Đáp án nguồn</th><th>Câu</th><th>Đáp án nguồn</th><th>Câu</th><th>Đáp án nguồn</th><th>Câu</th><th>Đáp án nguồn</th></tr></thead><tbody><tr><td>SPV 01</td><td>D</td><td>SPV 11</td><td>B</td><td>SPV 21</td><td>B</td><td>SPV 31</td><td>C</td><td>SPV 41</td><td>C</td></tr><tr><td>SPV 02</td><td>B</td><td>SPV 12</td><td>A</td><td>SPV 22</td><td>B</td><td>SPV 32</td><td>C</td><td>SPV 42</td><td>B</td></tr><tr><td>SPV 03</td><td>B</td><td>SPV 13</td><td>A</td><td>SPV 23</td><td>B</td><td>SPV 33</td><td>B</td><td>SPV 43</td><td>D</td></tr><tr><td>SPV 04</td><td>B</td><td>SPV 14</td><td>D</td><td>SPV 24</td><td>C</td><td>SPV 34</td><td>A</td><td>SPV 44</td><td>D</td></tr><tr><td>SPV 05</td><td>A</td><td>SPV 15</td><td>C</td><td>SPV 25</td><td>B</td><td>SPV 35</td><td>A</td><td>SPV 45</td><td>B</td></tr><tr><td>SPV 06</td><td>B</td><td>SPV 16</td><td>A</td><td>SPV 26</td><td>D</td><td>SPV 36</td><td>A</td><td>SPV 46</td><td>A</td></tr><tr><td>SPV 07</td><td>B</td><td>SPV 17</td><td>C</td><td>SPV 27</td><td>B</td><td>SPV 37</td><td>B</td><td>SPV 47</td><td>A</td></tr><tr><td>SPV 08</td><td>C</td><td>SPV 18</td><td>C</td><td>SPV 28</td><td>B</td><td>SPV 38</td><td>A</td><td>SPV 48</td><td>A</td></tr><tr><td>SPV 09</td><td>A</td><td>SPV 19</td><td>A</td><td>SPV 29</td><td>B</td><td>SPV 39</td><td>B</td><td>SPV 49</td><td>D</td></tr><tr><td>SPV 10</td><td>C</td><td>SPV 20</td><td>B</td><td>SPV 30</td><td>D</td><td>SPV 40</td><td>B</td><td>SPV 50</td><td>A</td></tr></tbody></table></div><h3>8.2. Lời giải mẫu cho các dạng đại diện</h3><h3>Mẫu 1 — Nhận dạng ester (SPV 01)</h3><ul><li>A có –OH và aldehyde, không có nhóm ester.</li><li>B là acid carboxylic –COOH.</li><li>C có –OH và ketone.</li><li>D có nhóm CH₃CH₂COOCH₃ dạng ester.</li><li><strong>Chọn D.</strong></li></ul><h3>Mẫu 2 — Công thức ester no, đơn chức, mạch hở (SPV 02)</h3><p>Dùng công thức \\(C<em>nH</em>{2n}O_2\\), \\(n\\ge2\\). <strong>Chọn D theo các lựa chọn của đề</strong> (công thức hiển thị ở bản trích xuất có thể bị lỗi định dạng; hãy đối chiếu bản PDF nếu ký hiệu bị dính).</p><h3>Mẫu 3 — Chọn ester no, đơn chức, mạch hở (SPV 03)</h3><ul><li>A có liên kết C=C ở gốc vinyl → không no.</li><li>B CH₃COOCH₃ là ester no, đơn chức, mạch hở.</li><li>C có gốc phenyl → không thuộc loại mạch hở đơn giản đang hỏi.</li><li>D có hai nhóm ester → đa chức.</li><li><strong>Chọn B.</strong></li></ul><h3>Mẫu 4 — Xác định tên ester (SPV 06)</h3><p>HCOOC₂H₅: phần gốc alcohol là ethyl; phần acid là formate. <strong>Tên: ethyl formate — chọn B.</strong></p><h3>Mẫu 5 — Xác định sản phẩm xà phòng hóa (SPV 17)</h3><p>\\[ \\mathrm{CH<em>3COOC</em>2H<em>5 + KOH \\rightarrow CH</em>3COOK + C<em>2H</em>5OH} \\] Muối là CH₃COOK. <strong>Chọn C.</strong></p><h3>Mẫu 6 — Suy ngược từ muối (SPV 15)</h3><p>Thủy phân trong NaOH thu sodium butanoate, nên phần acid của ester là butanoate: CH₃CH₂CH₂COO–. Tổng CTPT C₅H₁₀O₂ nên phần gốc còn lại là –CH₃. Ester là CH₃CH₂CH₂COOCH₃. <strong>Chọn C.</strong></p><h3>Mẫu 7 — Nhận diện chất béo (SPV 23–24)</h3><ul><li>Chất béo là triester của glycerol với acid béo.</li><li>Công thức có ba gốc C₁₇H₃₃COO– gắn với C₃H₅ phù hợp với triglyceride của acid béo không no.</li><li><strong>SPV 23: B; SPV 24: C theo đáp án nguồn.</strong></li></ul><h3>Mẫu 8 — Hydrogen hóa dầu thực vật (SPV 32)</h3><p>Dầu thực vật là chất béo lỏng có thể chứa gốc acid béo không no. Hydrogen hóa chất béo lỏng làm giảm liên kết đôi và tạo chất béo no hơn. <strong>Chọn C.</strong></p><h3>Mẫu 9 — Bài xà phòng hóa có glycerol (SPV 41)</h3><p>Khung giải:</p><ol><li>\\(n_{glycerol}=m/M=13,8\\text{ kg}/92\\text{ kg kmol}^{-1}=0,15\\text{ kmol}\\).</li><li>Theo phương trình, \\(n<em>{triglyceride}=n</em>{glycerol}=0,15\\text{ kmol}\\); NaOH tiêu thụ là \\(0,45\\text{ kmol}\\).</li><li>Tính khối lượng muối từ bảo toàn khối lượng hoặc từ \\(m<em>{\\text{muối}}=m</em>{\\text{chất béo}}+m<em>{\\text{NaOH}}-m</em>{\\text{glycerol}}\\), với điều kiện dữ kiện phản ứng phù hợp.</li><li>Khối lượng xà phòng mỗi bánh: 100 g, trong đó muối chiếm 72%; số bánh \\(=m_{\\text{muối}}/72\\text{ g}\\).</li><li>Đối chiếu lựa chọn với phép tính và làm tròn theo yêu cầu.</li></ol><p><strong>Đáp án nguồn: C.</strong> (Nên thực hiện phép tính đầy đủ trên giấy để tránh sai đơn vị kg/g.)</p><h3>Mẫu 10 — Dữ liệu thí nghiệm ester hóa (SPV 45)</h3><p>Thể tích ethyl acetate thu được lần lượt là 25,8; 30,5; 35,1; 39,8; 36,6; 32,9 mL tại 60; 65; 70; 75; 80; 85°C.</p><ul><li>Giá trị lớn nhất trong bảng là 39,8 mL ở 75°C, không phải 70°C.</li><li>Ở 80°C thu được nhiều ester hơn 60°C.</li><li>Dữ liệu không chứng minh nhiệt độ càng tăng thì hiệu suất càng tăng, vì sau 75°C lượng thu được giảm.</li><li><strong>Đáp án nguồn: B.</strong></li></ul><h3>Mẫu 11 — Chỉ số acid (SPV 49)</h3><p>Định nghĩa: mg KOH cần để trung hòa acid tự do trong 1 g mẫu. Dữ kiện chuẩn độ: 2,00 g dầu, NaOH 0,05 M, thể tích trung bình 4,50 mL.</p><ol><li>\\(n_{NaOH}=0,05\\times0,00450=2,25\\times10^{-4}\\) mol.</li><li>Với acid đơn chức, số mol acid trung hòa tương đương số mol NaOH.</li><li>Lượng KOH tương đương \\(m=n\\times M_{KOH}\\), đổi sang mg.</li><li>Chia cho 2,00 g mẫu để ra mg KOH/g.</li></ol><p><strong>Đáp án nguồn: D.</strong> Hãy tự tính lại để luyện kỹ năng quy đổi đơn vị.</p><h3>8.3. Ghi chú về cách dùng đáp án</h3><ul><li>Dùng bảng đáp án để chấm nhanh, không học thuộc chữ cái.</li><li>Nếu kết quả tự giải khác đáp án nguồn, kiểm tra theo thứ tự: phương trình → tỉ lệ mol → khối lượng mol → đơn vị → điều kiện phản ứng.</li><li>Một số câu trong bản trích xuất có ký hiệu hóa học hoặc hình vẽ không hiển thị đầy đủ. Khi phần cấu trúc/đồ thị là yếu tố quyết định, đối chiếu trực tiếp trang PDF gốc trước khi chốt.</li></ul><hr><h3>9. LỊCH ÔN TẬP D0 → D90</h3><h3>9.1. Lịch lặp lại ngắt quãng</h3><div class=\"table-wrap\"><table><thead><tr><th>Mốc</th><th>Nhiệm vụ</th><th>Thời lượng gợi ý</th><th>Điều kiện hoàn thành</th></tr></thead><tbody><tr><td><strong>D0 – Học lần đầu</strong></td><td>Đọc bản đồ; học khái niệm, công thức, 2 loại thủy phân; làm flashcard nhóm ester</td><td>45–60 phút</td><td>Tự viết được 3 phương trình cốt lõi</td></tr><tr><td><strong>D1</strong></td><td>Ôn không nhìn tài liệu: nhóm chức, danh pháp, tính chất vật lí</td><td>15 phút</td><td>Đúng ≥80% flashcard</td></tr><tr><td><strong>D3</strong></td><td>Luyện E1–E4: nhận dạng, công thức, gọi tên</td><td>20–30 phút</td><td>Giải thích được vì sao phương án sai</td></tr><tr><td><strong>D7</strong></td><td>Luyện E6–E9 và L1–L3: phản ứng ester/chất béo</td><td>30 phút</td><td>Viết đúng sản phẩm và tỉ lệ mol</td></tr><tr><td><strong>D14</strong></td><td>Làm câu trắc nghiệm trộn lẫn + 2 bài tính toán</td><td>30–45 phút</td><td>Ghi lại lỗi sai theo nhóm</td></tr><tr><td><strong>D21</strong></td><td>Active Recall toàn chương, ưu tiên câu suy luận ngược</td><td>20–30 phút</td><td>Trả lời được ≥80% không xem đáp án</td></tr><tr><td><strong>D30</strong></td><td>Làm lại câu từng sai; giải bài định lượng xà phòng hóa/đốt cháy</td><td>30–45 phút</td><td>Không lặp lại lỗi cũ</td></tr><tr><td><strong>D45</strong></td><td>Ôn sơ đồ phản ứng và bảng so sánh; luyện câu thí nghiệm</td><td>25 phút</td><td>Giải thích được vai trò từng thao tác</td></tr><tr><td><strong>D60</strong></td><td>Kiểm tra tổng hợp theo thời gian; không dùng ghi chú</td><td>40–60 phút</td><td>Đạt mục tiêu điểm cá nhân</td></tr><tr><td><strong>D75</strong></td><td>Ôn các thẻ yếu và 5 câu khó nhất đã đánh dấu</td><td>20 phút</td><td>Nêu được cách giải từ đầu</td></tr><tr><td><strong>D90</strong></td><td>Kiểm tra cuối: viết lại bản đồ kiến thức, làm bộ câu hỗn hợp</td><td>30–45 phút</td><td>Tóm tắt được chương trong 1 trang</td></tr></tbody></table></div><h3>9.2. Quy tắc vận hành mỗi buổi</h3><ol><li><strong>Nhớ trước – đọc sau:</strong> dành 3–5 phút viết lại những gì còn nhớ.</li><li><strong>Học chủ động:</strong> che đáp án, trả lời bằng lời hoặc viết phương trình.</li><li><strong>Sửa lỗi có phân loại:</strong> ghi lỗi là “khái niệm”, “nhận dạng”, “phương trình”, “tỉ lệ mol”, “đơn vị” hay “đọc đề”.</li><li><strong>Ôn lại câu sai:</strong> sau 1 ngày, 3 ngày, 7 ngày; không chỉ đọc lời giải mà phải tự làm lại.</li><li><strong>Tăng độ khó dần:</strong> từ nhận dạng → phương trình → suy luận ngược → tính toán tích hợp.</li><li><strong>Không xem cảm giác quen thuộc là đã thuộc:</strong> chỉ đánh dấu “đã nắm” khi có thể giải thích hoặc giải bài mà không nhìn ghi chú.</li></ol><h3>9.3. Bảng theo dõi cá nhân</h3><div class=\"table-wrap\"><table><thead><tr><th>Ngày</th><th>Chủ đề</th><th>Điểm/độ chính xác</th><th>Lỗi chính</th><th>Việc sửa ở lần tới</th></tr></thead><tbody><tr><td>D0</td><td>Khái niệm + danh pháp</td><td></td><td></td><td></td></tr><tr><td>D1</td><td>Flashcard</td><td></td><td></td><td></td></tr><tr><td>D3</td><td>Nhận dạng + đồng phân</td><td></td><td></td><td></td></tr><tr><td>D7</td><td>Thủy phân + chất béo</td><td></td><td></td><td></td></tr><tr><td>D14</td><td>Bài tổng hợp</td><td></td><td></td><td></td></tr><tr><td>D30</td><td>Định lượng</td><td></td><td></td><td></td></tr><tr><td>D60</td><td>Kiểm tra tổng hợp</td><td></td><td></td><td></td></tr><tr><td>D90</td><td>Kiểm tra cuối</td><td></td><td></td><td></td></tr></tbody></table></div><hr><h3>10. TỜ TÓM TẮT 1 TRANG</h3><h3>Ester</h3><ul><li>Nhóm chức: <strong>–COO–</strong>; ester đơn chức: <strong>RCOOR′</strong>.</li><li>Ester no, đơn chức, mạch hở: <strong>CₙH₂ₙO₂ (n ≥ 2)</strong>.</li><li>Tên gọi: <strong>gốc R′ + gốc acid</strong>.</li><li>Ester hóa: acid + alcohol ⇌ ester + nước (xúc tác acid, thường H₂SO₄ đặc).</li><li>Thủy phân acid: ester + nước ⇌ acid + alcohol/phenol.</li><li>Thủy phân base: ester + NaOH/KOH → muối carboxylate + alcohol/phenol; thường gọi là xà phòng hóa.</li><li>Vật lí: thường nhẹ hơn nước, ít tan trong nước; nhiều ester có mùi thơm; nhiệt độ sôi thường thấp hơn alcohol/acid tương đương.</li></ul><h3>Lipid và chất béo</h3><ul><li>Lipid: không tan trong nước, tan trong dung môi hữu cơ không phân cực.</li><li>Chất béo: <strong>triester của glycerol với acid béo</strong>.</li><li>Nhiều gốc acid béo no → thường rắn; nhiều gốc không no → thường lỏng.</li><li>Hydrogen hóa: H₂ cộng vào C=C.</li><li>Oxi hóa bởi O₂ không khí có thể gây ôi, thiu.</li><li>Xà phòng hóa triglyceride: 1 mol triglyceride + 3 mol NaOH → 3 mol muối acid béo + 1 mol glycerol.</li><li>Vai trò: dự trữ năng lượng, acid béo thiết yếu, hấp thu vitamin A/D/E/K; nguyên liệu thực phẩm, xà phòng và glycerol.</li></ul><h3>5 câu hỏi tự kiểm cuối buổi</h3><ol><li>Tôi có phân biệt được –COOH và –COO– không?</li><li>Tôi có thể viết hai phương trình thủy phân mà không nhầm sản phẩm không?</li><li>Tôi có thể gọi tên ester từ CTCT và viết CTCT từ tên không?</li><li>Tôi có nhớ tỉ lệ 1 triglyceride : 3 NaOH : 1 glycerol : 3 muối không?</li><li>Tôi có giải thích được vì sao hydrogen hóa khác xà phòng hóa không?</li></ol><hr><p><strong>Kết thúc Study Pack.</strong> Bước tiếp theo tốt nhất: bắt đầu ở D0, che phần đáp án và làm Active Recall trước khi xem lại lý thuyết.</p>","tags":["P1–P4","Flashcards","Active Recall"],"estimatedMinutes":90}]},{"id":"toan-giai-tich","name":"Toán — Giải tích","icon":"📐","color":"#bde0fe","description":"Tính đơn điệu của hàm số · đạo hàm · bảng xét dấu · bài toán tham số","packs":[{"id":"tinh-don-dieu-ham-so","title":"Tính đơn điệu của hàm số","subtitle":"Study Pack • Buổi 01","content":"<h3>STUDY PACK — TÍNH ĐƠN ĐIỆU CỦA HÀM SỐ</h3><p><strong>Môn:</strong> Toán — Giải tích <strong>Chủ đề:</strong> Tính đơn điệu của hàm số (Buổi 01) <strong>Nguồn chính:</strong> <em>Lý thuyết – Buổi 01 – Đơn điệu hàm số</em> và <em>Đáp án lý thuyết – Buổi 01 – Đơn điệu hàm số</em> do người học cung cấp. <strong>Phạm vi:</strong> Hệ thống hóa khái niệm, định lí đạo hàm, quy trình xét dấu, dạng bài tham số và hai bài toán ứng dụng. Các ví dụ mở rộng được ghi rõ là ví dụ minh họa tự xây dựng; lời giải trong tài liệu nguồn được giữ làm trục chính. Tệp viết tay không trích xuất được chữ, vì vậy không dùng làm căn cứ cho nội dung.</p><hr><h3>1. DASHBOARD</h3><h3>1.1. Mục tiêu sau khi học</h3><p>Sau khi học xong, người học cần làm được các việc sau:</p><ol><li>Phát biểu đúng định nghĩa đồng biến, nghịch biến trên một khoảng, nửa khoảng hoặc đoạn.</li><li>Đọc chiều biến thiên trên đồ thị và phân biệt “đồng biến trên một khoảng” với “có một đoạn đồ thị đi lên”.</li><li>Dùng dấu của \\(f'(x)\\) để kết luận tính đơn điệu.</li><li>Tìm nghiệm \\(f'(x)=0\\), chia trục số thành các khoảng xét dấu và lập bảng dấu.</li><li>Phân biệt nghiệm bội chẵn, bội lẻ khi xét dấu của biểu thức đạo hàm đã phân tích nhân tử.</li><li>Xét hàm phân thức, đặc biệt không gộp hai khoảng bị ngắt bởi điểm không thuộc tập xác định.</li><li>Giải bài toán tham số bằng điều kiện đạo hàm không âm/không dương trên miền yêu cầu.</li><li>Xử lí trường hợp hệ số bậc cao nhất bằng 0 trước khi áp dụng điều kiện tam thức bậc hai.</li><li>Chuyển bài toán chuyển động hoặc tối ưu năng lượng thành bài toán xét tính đơn điệu.</li></ol><h3>1.2. Bản đồ quyết định nhanh</h3><ul><li>Đề cho <strong>đồ thị \\(f(x)\\)</strong> → quan sát đồ thị đi lên/đi xuống từ trái sang phải.</li><li>Đề cho <strong>đồ thị \\(f'(x)\\)</strong> → tìm nơi đồ thị \\(f'\\) nằm trên/dưới trục hoành.</li><li>Đề cho <strong>công thức \\(f(x)\\)</strong> → tính \\(f'(x)\\), giải \\(f'(x)=0\\), xét dấu.</li><li>Đề cho <strong>tham số \\(m\\)</strong> → viết điều kiện dấu của đạo hàm trên đúng miền, xét riêng trường hợp suy giảm bậc.</li><li>Đề cho <strong>một khoảng cụ thể</strong> → kiểm tra cả điều kiện xác định trên toàn khoảng đó lẫn dấu đạo hàm.</li><li>Đề hỏi <strong>số giá trị nguyên</strong> → tìm miền tham số trước, rồi mới đếm số nguyên.</li></ul><h3>1.3. Công thức lõi</h3><p>Nếu \\(f\\) có đạo hàm trên khoảng \\(K\\):</p><ul><li>\\(f'(x)\\ge 0\\) trên \\(K\\), và \\(f'(x)=0\\) chỉ tại hữu hạn điểm của \\(K\\) → \\(f\\) đồng biến trên \\(K\\).</li><li>\\(f'(x)\\le 0\\) trên \\(K\\), và \\(f'(x)=0\\) chỉ tại hữu hạn điểm của \\(K\\) → \\(f\\) nghịch biến trên \\(K\\).</li><li>\\(f'(x)=0\\) với mọi \\(x\\in K\\) → \\(f\\) không đổi trên \\(K\\).</li></ul><p><strong>Cảnh báo:</strong> Không kết luận một hàm đồng biến trên một khoảng nếu trong khoảng ấy có điểm làm hàm không xác định, hoặc đạo hàm đổi dấu khiến hàm đổi chiều.</p><h3>1.4. Kiểm tra đầu vào</h3><p>Trước khi giải, hãy tự hỏi:</p><ul><li>Tập xác định là gì?</li><li>Miền cần xét có bị chia bởi điểm loại khỏi tập xác định không?</li><li>Đạo hàm đã được rút gọn/phân tích nhân tử chưa?</li><li>Các nghiệm đạo hàm là nghiệm bội chẵn hay bội lẻ?</li><li>Đề hỏi khoảng đơn điệu, điều kiện tham số hay số lượng tham số?</li></ul><hr><h3>2. KNOWLEDGE GRAPH — ĐỒ THỊ TRI THỨC</h3><h3>2.1. Cấu trúc phân cấp</h3><p><strong>A. Hàm số và miền xét</strong></p><ul><li>[Prerequisite] Tập xác định \\(D\\): xác định nơi biểu thức có nghĩa.</li><li>[Prerequisite] Khoảng \\(K\\): miền trên đó cần kiểm tra tính đơn điệu.</li><li>[Consequence] Nếu có điểm không thuộc \\(D\\) nằm trong miền đề yêu cầu, không thể xem cả miền đó là một khoảng xác định liên tục của hàm.</li></ul><p><strong>B. Khái niệm đơn điệu</strong></p><ul><li>Đồng biến: \\(x<em>1&lt;x</em>2\\Rightarrow f(x<em>1)&lt;f(x</em>2)\\).</li><li>Nghịch biến: \\(x<em>1&lt;x</em>2\\Rightarrow f(x<em>1)&gt;f(x</em>2)\\).</li><li>[Application] Đọc đồ thị: đi lên từ trái sang phải là đồng biến; đi xuống là nghịch biến.</li><li>[Contrast] “Đồ thị có đoạn đi lên” không đồng nghĩa “hàm đồng biến trên toàn khoảng lớn chứa cả đoạn đi lên và đoạn đi xuống”.</li></ul><p><strong>C. Đạo hàm</strong></p><ul><li>[Prerequisite] Quy tắc đạo hàm và biến đổi đại số.</li><li>[Consequence] Dấu của \\(f'\\) cho biết chiều biến thiên của \\(f\\).</li><li>[Application] \\(f'&gt;0\\): tăng; \\(f'&lt;0\\): giảm; trường hợp định lí cho phép \\(f'\\ge0\\) hoặc \\(f'\\le0\\) có hữu hạn điểm bằng 0 vẫn kết luận đơn điệu.</li><li>[Contrast] \\(f'(x)=0\\) tại một điểm không tự động có nghĩa hàm hằng; chỉ \\(f'(x)=0\\) trên toàn khoảng mới cho hàm không đổi theo định lí trong tài liệu.</li></ul><p><strong>D. Nghiệm đạo hàm và bảng dấu</strong></p><ul><li>[Prerequisite] Giải phương trình \\(f'(x)=0\\).</li><li>[Consequence] Các nghiệm chia trục số thành những khoảng mà dấu đạo hàm thường cố định.</li><li>[Application] Lập bảng xét dấu rồi suy ra khoảng đồng biến/nghịch biến.</li><li>[Contrast] Nghiệm bội chẵn thường không làm đổi dấu; nghiệm bội lẻ thường làm đổi dấu, nếu các nhân tử còn lại không bằng 0 tại điểm đó.</li></ul><p><strong>E. Bài toán tham số</strong></p><ul><li>[Prerequisite] Điều kiện \\(f'(x)\\ge0\\) hoặc \\(f'(x)\\le0\\) với mọi \\(x\\) thuộc miền.</li><li>[Consequence] Có thể đưa về bất đẳng thức theo \\(m\\), điều kiện tam thức bậc hai hoặc cực trị của một biểu thức.</li><li>[Application] Đếm các giá trị nguyên sau khi tìm miền \\(m\\).</li><li>[Contrast] Trường hợp hệ số bậc hai bằng 0 phải xử lí riêng, không áp dụng máy móc điều kiện \\(\\Delta\\).</li></ul><p><strong>F. Ứng dụng</strong></p><ul><li>[Application] Vận tốc là đạo hàm của quãng đường theo thời gian; xét dấu đạo hàm vận tốc để biết vận tốc tăng hay giảm.</li><li>[Application] Năng lượng phụ thuộc vận tốc có thể được rút gọn thành hàm một biến; xét đạo hàm để tìm miền năng lượng giảm.</li></ul><h3>2.2. Chuỗi suy luận cốt lõi</h3><p>\\[ \\text{Tập xác định}\\to f'(x)\\to f'(x)=0\\to \\text{bảng dấu}\\to\\text{khoảng đơn điệu}\\to\\text{đáp án} \\]</p><p>Với tham số: \\[ \\text{Miền cần xét}\\to \\text{điều kiện dấu của }f'\\to \\text{điều kiện tham số}\\to\\text{xử lí biên/ngoại lệ}\\to\\text{đếm nếu cần} \\]</p><hr><h3>3. DEEP DIVE — GIẢI THÍCH TỪ GỐC</h3><h3>3.1. Khái niệm đồng biến</h3><h3>What — Là gì?</h3><p>Hàm số \\(y=f(x)\\) đồng biến trên \\(K\\) khi với mọi \\(x<em>1,x</em>2\\in K\\), nếu \\(x<em>1&lt;x</em>2\\) thì \\(f(x<em>1)&lt;f(x</em>2)\\). Khi đầu vào tăng, đầu ra cũng tăng.</p><h3>Why — Vì sao cần hiểu định nghĩa?</h3><p>Định nghĩa giúp tránh suy luận chỉ từ một vài điểm hoặc một đoạn nhỏ của đồ thị. Muốn khẳng định đồng biến trên cả khoảng, quan hệ phải đúng với mọi cặp điểm trong khoảng.</p><h3>How — Cách nhận diện</h3><ul><li>Từ đồ thị: đi từ trái sang phải, đường cong đi lên trong toàn khoảng.</li><li>Từ đạo hàm: áp dụng định lí dấu đạo hàm.</li><li>Từ định nghĩa: so sánh \\(f(x<em>1)\\) và \\(f(x</em>2)\\), thường dùng khi đề không thuận tiện cho đạo hàm.</li></ul><h3>Ví dụ thực tế/minh họa (3)</h3><ol><li><strong>Ví dụ đại số:</strong> \\(f(x)=2x+1\\). Nếu \\(x<em>1&lt;x</em>2\\), thì \\(2x<em>1+1&lt;2x</em>2+1\\); hàm đồng biến trên \\(\\mathbb R\\).</li><li><strong>Ví dụ đồ thị:</strong> một đường cong đi lên liên tục khi đọc từ trái sang phải trên \\((0,2)\\) là đồng biến trên khoảng đó, nhưng chưa thể kết luận trên \\((0,+\\infty)\\) nếu sau \\(x=2\\) đường cong đi xuống.</li><li><strong>Ví dụ ứng dụng:</strong> nếu một đại lượng \\(A(t)\\) tăng theo thời gian trong suốt giai đoạn đang xét, thì \\(A\\) đồng biến trên khoảng thời gian ấy. Đây là cách diễn giải ngôn ngữ, không thay cho chứng minh toán học.</li></ol><h3>Feynman Check</h3><p>Nếu đồ thị đi lên trên \\((0,2)\\) nhưng đi xuống trên \\((2,4)\\), có thể kết luận hàm đồng biến trên \\((0,4)\\) không? Vì sao?</p><h3>3.2. Khái niệm nghịch biến</h3><h3>What</h3><p>Hàm \\(f\\) nghịch biến trên \\(K\\) nếu \\(x<em>1&lt;x</em>2\\) luôn kéo theo \\(f(x<em>1)&gt;f(x</em>2)\\). Đầu vào tăng thì đầu ra giảm.</p><h3>Why</h3><p>Khái niệm này mô tả sự giảm ổn định trên một miền, không chỉ một lần giảm. Nó đặc biệt hữu ích khi đọc bảng biến thiên hoặc diễn giải vận tốc, năng lượng.</p><h3>How</h3><ul><li>Đọc đồ thị từ trái sang phải: đường cong đi xuống.</li><li>Dùng \\(f'(x)\\le0\\) trên miền, với điều kiện định lí trong tài liệu.</li><li>Nếu biểu thức đạo hàm đã phân tích nhân tử, xét dấu từng nhân tử và các nghiệm.</li></ul><h3>Ví dụ (3)</h3><ol><li>\\(f(x)=-3x+4\\) nghịch biến trên \\(\\mathbb R\\), vì \\(f'(x)=-3&lt;0\\).</li><li>\\(f(x)=1/x\\) có \\(f'(x)=-1/x^2&lt;0\\) với \\(x\\ne0\\); hàm nghịch biến riêng trên \\((-\\infty,0)\\) và \\((0,+\\infty)\\), không gộp qua \\(0\\).</li><li>Nếu vận tốc \\(v(t)\\) giảm trong một giai đoạn thì hàm \\(v\\) nghịch biến theo thời gian trong giai đoạn đó; điều này chưa nhất thiết có nghĩa vật đang chuyển động chậm lại theo độ lớn nếu vận tốc âm, nên cần hiểu bối cảnh.</li></ol><h3>Feynman Check</h3><p>Vì sao \\(1/x\\) không được gọi là nghịch biến trên toàn \\(\\mathbb R\\), dù đạo hàm âm tại mọi điểm thuộc tập xác định?</p><h3>3.3. Định lí dấu đạo hàm</h3><h3>What</h3><p>Tài liệu nêu: nếu \\(f\\) có đạo hàm trên \\(K\\), \\(f'(x)\\ge0\\) với mọi \\(x\\in K\\) và đạo hàm bằng 0 tại hữu hạn điểm, thì \\(f\\) đồng biến. Tương tự, \\(f'\\le0\\) và chỉ bằng 0 tại hữu hạn điểm thì \\(f\\) nghịch biến. Nếu \\(f'=0\\) trên toàn \\(K\\), hàm không đổi.</p><h3>Why</h3><p>Định nghĩa yêu cầu so sánh mọi cặp giá trị đầu vào, việc đó có thể dài. Đạo hàm cho một công cụ kiểm tra chiều biến thiên hiệu quả hơn.</p><h3>How</h3><ol><li>Tính đạo hàm.</li><li>Xác định miền cần xét.</li><li>Tìm điểm \\(f'=0\\) và điểm đạo hàm không xác định (nếu có).</li><li>Xét dấu đạo hàm trên các khoảng con.</li><li>Kết luận từng khoảng, không bỏ qua điểm gián đoạn.</li></ol><h3>Ví dụ (3)</h3><ol><li>\\(f(x)=x^3\\), \\(f'(x)=3x^2\\ge0\\), đạo hàm bằng 0 tại duy nhất \\(x=0\\); theo định lí, \\(f\\) đồng biến trên \\(\\mathbb R\\).</li><li>\\(f(x)=-x^3\\), \\(f'(x)=-3x^2\\le0\\), bằng 0 tại \\(x=0\\); hàm nghịch biến trên \\(\\mathbb R\\).</li><li>\\(f(x)=5\\), \\(f'(x)=0\\) trên toàn miền; hàm không đổi.</li></ol><h3>Feynman Check</h3><p>Sự khác nhau giữa “đạo hàm bằng 0 tại một điểm” và “đạo hàm bằng 0 trên cả khoảng” là gì?</p><h3>3.4. Bảng xét dấu và nghiệm bội</h3><h3>What</h3><p>Bảng xét dấu chia trục số tại các nghiệm của \\(f'(x)\\) và những điểm biểu thức không xác định. Mỗi khoảng được gán dấu \\(+\\), \\(-\\) hoặc \\(0\\) thích hợp.</p><h3>Why</h3><p>Đạo hàm có thể đổi dấu tại nghiệm; chỉ biết nghiệm mà không xét dấu sẽ không đủ để kết luận tăng/giảm.</p><h3>How</h3><ol><li>Phân tích \\(f'(x)\\) thành nhân tử.</li><li>Sắp xếp nghiệm theo thứ tự tăng dần.</li><li>Xác định bội nghiệm.</li><li>Xét dấu trên một khoảng mẫu, sau đó xác định dấu các khoảng còn lại; kiểm tra lại bằng cách thử giá trị nếu cần.</li></ol><h3>Quy tắc bội</h3><ul><li>Nhân tử \\((x-a)^{2k}\\): không đổi dấu khi qua \\(a\\) nếu các nhân tử khác không đổi dấu tại đó.</li><li>Nhân tử \\((x-a)^{2k+1}\\): đổi dấu khi qua \\(a\\) nếu các nhân tử khác không bằng 0 tại đó.</li><li>Nếu có điểm không thuộc tập xác định, phải tách khoảng dù đạo hàm cùng dấu hai bên.</li></ul><h3>Ví dụ (3)</h3><ol><li>\\(f'(x)=(x-1)^2(x+2)\\): nghiệm \\(x=1\\) bội chẵn nên dấu không đổi khi qua 1; nghiệm \\(x=-2\\) bội lẻ nên dấu đổi khi qua -2.</li><li>\\(f'(x)=x(x-1)(x-2)\\): cả ba nghiệm đơn, dấu đổi tại từng nghiệm; lập bảng trên bốn khoảng.</li><li>\\(f'(x)=1/(x+1)^2&gt;0\\) với \\(x\\ne-1\\): dấu dương trên hai miền, nhưng phải kết luận riêng trên \\((-\\infty,-1)\\) và \\((-1,+\\infty)\\).</li></ol><h3>Feynman Check</h3><p>Tại sao nghiệm bội chẵn thường không làm đạo hàm đổi dấu, còn nghiệm bội lẻ thường làm đổi dấu?</p><h3>3.5. Hàm phân thức và khoảng xác định</h3><h3>What</h3><p>Hàm phân thức có miền xác định loại bỏ những điểm làm mẫu số bằng 0. Những điểm này chia trục số thành các khoảng độc lập.</p><h3>Why</h3><p>Đạo hàm có thể dương ở cả hai phía của một điểm bị loại, nhưng hàm không vì thế mà đồng biến trên một khoảng lớn chứa điểm đó: hàm không xác định tại điểm ấy.</p><h3>How</h3><ol><li>Giải mẫu số bằng 0 để tìm điểm loại.</li><li>Viết tập xác định.</li><li>Tính đạo hàm, rút gọn.</li><li>Xét dấu đạo hàm trên từng khoảng xác định.</li><li>Liệt kê từng khoảng đơn điệu.</li></ol><h3>Ví dụ (3)</h3><ol><li>\\(f(x)=\\frac{x-1}{x+1}\\), \\(D=\\mathbb R\\setminus\\{-1\\}\\), \\(f'(x)=\\frac{2}{(x+1)^2}&gt;0\\). Hàm đồng biến trên \\((-\\infty,-1)\\) và \\((-1,+\\infty)\\).</li><li>\\(f(x)=\\frac{2}{x^2+1}\\), \\(D=\\mathbb R\\), \\(f'(x)=\\frac{-4x}{(x^2+1)^2}\\); tăng khi \\(x&lt;0\\), giảm khi \\(x&gt;0\\).</li><li>Với \\(f(x)=1/x\\), đạo hàm âm ở cả hai miền xác định nhưng cần nêu hai khoảng \\((-\\infty,0)\\), \\((0,+\\infty)\\), không gộp.</li></ol><h3>Feynman Check</h3><p>Nếu \\(f'(x)&gt;0\\) ở mọi điểm thuộc tập xác định, vì sao vẫn có thể phải nêu hai khoảng đồng biến thay vì một khoảng duy nhất?</p><h3>3.6. Hàm số có tham số</h3><h3>What</h3><p>Tham số \\(m\\) xuất hiện trong hàm hoặc đạo hàm. Đề yêu cầu chọn \\(m\\) sao cho hàm đồng biến/nghịch biến trên một miền cụ thể.</p><h3>Why</h3><p>Điều kiện đơn điệu phải đúng với mọi \\(x\\) thuộc miền đề cho. Vì vậy không thể chỉ kiểm tra một điểm \\(x\\), và miền xác định cũng là một phần của điều kiện.</p><h3>How</h3><ol><li>Tính \\(f'(x)\\).</li><li>Dịch yêu cầu thành \\(f'(x)\\ge0\\) hoặc \\(f'(x)\\le0\\) trên miền.</li><li>Nếu là phân thức, kiểm tra điểm làm mẫu bằng 0 có nằm trong khoảng yêu cầu không.</li><li>Nếu đạo hàm là tam thức \\(ax^2+bx+c\\), xét riêng \\(a=0\\). Khi \\(a\\ne0\\), dùng hệ số và biệt thức/đỉnh để kiểm tra dấu toàn miền.</li><li>Lấy giao các điều kiện, sau đó đếm giá trị nguyên nếu đề yêu cầu.</li></ol><h3>Ví dụ (3)</h3><ol><li>Với \\(y=\\frac{mx-2m-3}{x-m}\\), đạo hàm theo tài liệu là \\(\\frac{-m^2+2m+3}{(x-m)^2}\\). Muốn đồng biến trên các khoảng xác định, cần tử số dương: \\(-m^2+2m+3&gt;0\\), tương đương \\(-1&lt;m&lt;3\\). Giá trị nguyên: \\(m=0,1,2\\).</li><li>Với \\(y=\\frac{x+2}{x+5m}\\), yêu cầu đồng biến trên \\((-\\infty,-10)\\) đòi hỏi điểm \\(x=-5m\\) không nằm trong khoảng và đạo hàm dương trên khoảng. Tài liệu đưa đến \\(2/5&lt;m\\le2\\), nên \\(m\\) nguyên là 1, 2.</li><li>Với một đạo hàm bậc hai có hệ số đầu phụ thuộc \\(m\\), nếu hệ số đầu bằng 0 thì đạo hàm giảm bậc. Phải giải trường hợp này riêng rồi mới xét trường hợp tam thức bậc hai.</li></ol><h3>Feynman Check</h3><p>Tại sao trong bài toán tham số không nên áp dụng điều kiện tam thức bậc hai trước khi kiểm tra hệ số \\(a\\) có bằng 0 hay không?</p><hr><h3>4. COMPARISON &amp; TRAPS — SO SÁNH VÀ BẪY THƯỜNG GẶP</h3><div class=\"table-wrap\"><table><thead><tr><th>Tình huống</th><th>Cách đúng</th><th>Bẫy thường gặp</th></tr></thead><tbody><tr><td>Đồ thị đi lên ở một đoạn</td><td>Chỉ kết luận đồng biến trên khoảng mà toàn bộ đồ thị đi lên</td><td>Chọn khoảng lớn có cả đoạn lên và xuống</td></tr><tr><td>Đồ thị \\(f'(x)\\) nằm trên trục hoành</td><td>\\(f\\) đồng biến trên khoảng tương ứng</td><td>Nhầm đồ thị \\(f'\\) với đồ thị \\(f\\)</td></tr><tr><td>\\(f'(x)=0\\) tại một điểm</td><td>Xem đó là điểm chia khoảng, xét dấu hai phía</td><td>Kết luận ngay hàm hằng</td></tr><tr><td>Nghiệm bội chẵn</td><td>Dấu thường không đổi khi qua nghiệm</td><td>Tự động đổi dấu tại mọi nghiệm</td></tr><tr><td>Nghiệm bội lẻ</td><td>Dấu thường đổi khi qua nghiệm</td><td>Quên xét các nhân tử khác</td></tr><tr><td>Phân thức có mẫu bằng 0</td><td>Tách miền xác định</td><td>Gộp hai khoảng qua tiệm cận đứng</td></tr><tr><td>Yêu cầu trên \\((a,b)\\)</td><td>Kiểm tra toàn bộ khoảng, kể cả điểm bị loại</td><td>Chỉ xét dấu đạo hàm mà bỏ điều kiện xác định</td></tr><tr><td>Tham số trong tam thức</td><td>Xét hệ số bậc cao nhất trước</td><td>Dùng điều kiện \\(\\Delta\\) khi tam thức đã giảm bậc</td></tr><tr><td>Đếm số nguyên \\(m\\)</td><td>Giải bất đẳng thức rồi đếm</td><td>Đếm cả biên không thỏa</td></tr><tr><td>Bài toán vận tốc</td><td>Phân biệt quãng đường, vận tốc, gia tốc</td><td>Gọi \\(S'(t)\\) là gia tốc; thực ra là vận tốc</td></tr><tr><td>Bài toán tối ưu</td><td>Rút gọn hàm mục tiêu trước khi đạo hàm</td><td>Bỏ quên điều kiện vật lí như \\(v&gt;6\\)</td></tr></tbody></table></div><h3>4.1. Quy tắc kiểm tra đáp án</h3><ul><li>Chọn một điểm thử trong mỗi khoảng xét dấu.</li><li>Thay lại vào đạo hàm để xác nhận dấu.</li><li>Đối chiếu dấu với chiều biến thiên.</li><li>Kiểm tra biên mở/đóng và điểm loại khỏi tập xác định.</li><li>Nếu kết quả là tập tham số, thay một giá trị đại diện để kiểm tra tính hợp lí.</li></ul><hr><h3>5. PATTERN MANUAL — SỔ TAY DẠNG BÀI</h3><h3>Dạng 1. Đọc tính đơn điệu từ đồ thị \\(f(x)\\)</h3><p><strong>[Pattern Name]</strong> Đọc chiều biến thiên trực tiếp. <strong>[Recognition Sign]</strong> Đề cho đồ thị hàm số và hỏi khoảng đồng biến/nghịch biến. <strong>[4-Step Strategy]</strong></p><ol><li>Đánh dấu các điểm mà đồ thị đổi chiều hoặc bị ngắt.</li><li>Chia trục \\(x\\) thành các khoảng tương ứng.</li><li>Trên từng khoảng, đọc từ trái sang phải: đi lên hay đi xuống.</li><li>Đối chiếu các phương án; khoảng phải nằm hoàn toàn trong một miền đơn điệu.</li></ol><p><strong>[Common Traps]</strong> Nhìn một phần đồ thị rồi chọn khoảng bao trùm cả phần đi lên và đi xuống.</p><p><strong>Ví dụ chi tiết A:</strong> Đồ thị đi xuống trên \\((-\\infty,0)\\), đi lên trên \\((0,2)\\), rồi đi xuống sau \\(2\\). Khi hỏi khoảng đồng biến, chọn \\((0,2)\\), không chọn \\((0,+\\infty)\\). <strong>Ví dụ chi tiết B:</strong> Đồ thị đi lên trên \\((-3,1)\\) và đi xuống trên \\((1,5)\\). Hàm đồng biến trên \\((-3,1)\\); nếu phương án là \\((-2,0)\\), khoảng này cũng nằm trọn trong miền đồng biến và có thể đúng nếu đề hỏi một khoảng con.</p><h3>Dạng 2. Đọc tính đơn điệu từ đồ thị \\(f'(x)\\)</h3><p><strong>[Pattern Name]</strong> Dùng dấu đạo hàm được vẽ. <strong>[Recognition Sign]</strong> Đề nói rõ hình là đồ thị \\(y=f'(x)\\). <strong>[4-Step Strategy]</strong></p><ol><li>Tìm giao điểm của đồ thị \\(f'\\) với trục hoành.</li><li>Chia trục số tại các nghiệm.</li><li>Xác định nơi \\(f'&gt;0\\) (đồ thị ở trên trục) và \\(f'&lt;0\\) (ở dưới trục).</li><li>Kết luận \\(f\\) tăng ở miền dấu dương, giảm ở miền dấu âm.</li></ol><p><strong>[Common Traps]</strong> Đọc trực tiếp chiều đi lên/đi xuống của đồ thị \\(f'\\) thay vì vị trí trên/dưới trục hoành.</p><p><strong>Ví dụ A:</strong> Nếu đồ thị \\(f'\\) nằm dưới trục hoành khi \\(x&lt;2\\), nằm trên khi \\(x&gt;2\\), thì \\(f\\) giảm trên \\((-\\infty,2)\\), tăng trên \\((2,+\\infty)\\). <strong>Ví dụ B:</strong> Nếu \\(f'\\) dương trên \\((0,1)\\) và \\((3,+\\infty)\\), âm trên \\((1,3)\\), thì \\(f\\) tăng trên hai khoảng đầu và giảm trên khoảng giữa.</p><h3>Dạng 3. Đạo hàm đã phân tích nhân tử</h3><p><strong>[Pattern Name]</strong> Lập bảng xét dấu theo nghiệm. <strong>[Recognition Sign]</strong> \\(f'(x)\\) là tích của các nhân tử tuyến tính hoặc có thể phân tích thành tích. <strong>[4-Step Strategy]</strong></p><ol><li>Giải \\(f'(x)=0\\), ghi nghiệm theo thứ tự.</li><li>Xác định bội của từng nghiệm.</li><li>Lập bảng dấu cho từng nhân tử hoặc dùng quy tắc đổi dấu theo bội.</li><li>Ghép dấu và suy ra khoảng đơn điệu.</li></ol><p><strong>[Common Traps]</strong> Sai dấu nhân tử \\(2-x\\); nhầm bội chẵn/lẻ; bỏ sót nghiệm.</p><p><strong>Ví dụ A:</strong> \\(f'(x)=(x+1)(x-1)(2-x)\\). Nghiệm là \\(-1,1,2\\), đều bội lẻ. Xét dấu lần lượt trên bốn khoảng, chú ý nhân tử \\(2-x\\) mang dấu dương khi \\(x&lt;2\\) và âm khi \\(x&gt;2\\). <strong>Ví dụ B:</strong> \\(f'(x)=x(x-1)(x-2)\\). Nghiệm \\(0,1,2\\), mỗi nghiệm đơn. Có thể thử dấu trên \\((-\\infty,0)\\), rồi đổi dấu khi qua mỗi nghiệm.</p><h3>Dạng 4. Hàm phân thức đơn giản</h3><p><strong>[Pattern Name]</strong> Xét miền xác định rồi xét dấu đạo hàm. <strong>[Recognition Sign]</strong> Hàm dạng \\(\\frac{ax+b}{cx+d}\\) hoặc phân thức có mẫu bình phương trong đạo hàm. <strong>[4-Step Strategy]</strong></p><ol><li>Giải mẫu số bằng 0 và ghi \\(D\\).</li><li>Tính đạo hàm bằng quy tắc thương.</li><li>Rút gọn đạo hàm; xét dấu tử và mẫu.</li><li>Kết luận trên từng khoảng liên thông của \\(D\\).</li></ol><p><strong>[Common Traps]</strong> Mẫu bình phương dương nhưng mẫu ban đầu vẫn có điểm bị loại; quên tách khoảng.</p><p><strong>Ví dụ A:</strong> \\(f(x)=\\frac{x-1}{x+1}\\). \\(D=\\mathbb R\\setminus\\{-1\\}\\), \\(f'=2/(x+1)^2&gt;0\\), nên tăng trên hai khoảng xác định. <strong>Ví dụ B:</strong> \\(g(x)=2/(x^2+1)\\). \\(g'=-4x/(x^2+1)^2\\); dấu dương khi \\(x&lt;0\\), âm khi \\(x&gt;0\\), do đó tăng trên \\((-\\infty,0)\\), giảm trên \\((0,+\\infty)\\).</p><h3>Dạng 5. Đạo hàm có dạng tích với nghiệm bội</h3><p><strong>[Pattern Name]</strong> Nhận diện điểm có thể không đổi dấu. <strong>[Recognition Sign]</strong> Có nhân tử bình phương như \\((x-a)^2\\). <strong>[4-Step Strategy]</strong></p><ol><li>Phân tích toàn bộ đạo hàm.</li><li>Ghi nghiệm và bội.</li><li>Khi đi qua nghiệm bội chẵn, giữ dấu nếu không có nhân tử khác đổi dấu tại đó; qua nghiệm bội lẻ, đổi dấu.</li><li>Kiểm tra lại bằng giá trị thử trong từng khoảng.</li></ol><p><strong>[Common Traps]</strong> Coi mọi nghiệm đều là điểm đổi dấu.</p><p><strong>Ví dụ A:</strong> \\(f'(x)=(x+2)(x-1)^2\\). Dấu đổi tại \\(-2\\), không đổi tại \\(1\\); vì vậy \\(x=1\\) không nhất thiết là cực trị. <strong>Ví dụ B:</strong> \\(g'(x)=-(x-3)^3(x+1)^2\\). Dấu bị chi phối bởi \\(-(x-3)^3\\); dấu đổi tại \\(3\\), không đổi tại \\(-1\\).</p><h3>Dạng 6. Tổng hàm số và đa thức phụ</h3><p><strong>[Pattern Name]</strong> Đạo hàm rồi gom nhân tử chung. <strong>[Recognition Sign]</strong> \\(g(x)=f(x)+P(x)\\), trong đó đã biết \\(f'(x)\\). <strong>[4-Step Strategy]</strong></p><ol><li>Viết \\(g'=f'+P'\\).</li><li>Thay biểu thức \\(f'\\) đã cho.</li><li>Khai triển vừa đủ rồi phân tích nhân tử chung.</li><li>Xét dấu biểu thức cuối cùng, tránh xét từng hạng tử riêng lẻ nếu chúng có thể gom được.</li></ol><p><strong>[Common Traps]</strong> Sai đạo hàm đa thức; bỏ dấu âm; không nhận ra nhân tử chung.</p><p><strong>Ví dụ A (theo tài liệu):</strong> \\(g(x)=f(x)+x^4/4-5x^3/3+4x^2-4x\\), với \\(f'=(x-3)(x-4)(x-2)(x-1)\\). Tài liệu gom được \\(g'=(x-2)^2(x-1)^2(x^2-7x+13)\\); tam thức cuối vô nghiệm thực nên dương, còn dấu đạo hàm không âm và chỉ bằng 0 tại hai nghiệm hữu hạn. <strong>Ví dụ B:</strong> Nếu \\(g'=f'+(x-1)(x-2)\\), hãy thay \\(f'\\), khai triển, tìm nhân tử chung trước khi lập bảng; không kết luận chỉ từ dấu của \\(f'\\) vì \\(P'\\) có thể thay đổi dấu tổng.</p><h3>Dạng 7. Tham số trong hàm phân thức</h3><p><strong>[Pattern Name]</strong> Điều kiện dấu tử số và điều kiện miền. <strong>[Recognition Sign]</strong> Hàm phân thức chứa \\(m\\), đề hỏi đồng biến/nghịch biến trên các khoảng xác định hoặc trên khoảng cụ thể. <strong>[4-Step Strategy]</strong></p><ol><li>Tìm điểm mẫu bằng 0.</li><li>Tính đạo hàm và rút gọn; thường mẫu bình phương dương trên miền xác định.</li><li>Đưa yêu cầu đơn điệu về dấu tử số.</li><li>Nếu có khoảng cụ thể, kiểm tra điểm loại có thuộc khoảng đó không; giao điều kiện rồi đếm nguyên.</li></ol><p><strong>[Common Traps]</strong> Bỏ điều kiện miền; dùng \\(\\ge0\\) khi đề và định lí yêu cầu dấu nghiêm ngặt trong biểu thức hằng tử.</p><p><strong>Ví dụ A (theo tài liệu):</strong> \\(y=(mx-2m-3)/(x-m)\\), \\(y'=(-m^2+2m+3)/(x-m)^2\\). Để đồng biến trên các khoảng xác định, yêu cầu tử dương, suy ra \\(-1&lt;m&lt;3\\), các số nguyên là \\(0,1,2\\). <strong>Ví dụ B (theo tài liệu):</strong> \\(y=(x+2)/(x+5m)\\), muốn tăng trên \\((-\\infty,-10)\\): điều kiện điểm \\(x=-5m\\) không nằm trong khoảng cho \\(m\\le2\\); đạo hàm dương cho \\(m&gt;2/5\\). Kết hợp và lấy nguyên được \\(m=1,2\\).</p><h3>Dạng 8. Tham số để hàm đa thức đơn điệu trên toàn trục</h3><p><strong>[Pattern Name]</strong> Ép đạo hàm bậc hai không đổi dấu. <strong>[Recognition Sign]</strong> Hàm bậc ba và yêu cầu đơn điệu trên \\(\\mathbb R\\). <strong>[4-Step Strategy]</strong></p><ol><li>Tính \\(f'\\), thường là tam thức bậc hai.</li><li>Xác định điều kiện hệ số đầu để tam thức có thể luôn không dương/không âm.</li><li>Dùng biệt thức hoặc giá trị cực trị để đảm bảo dấu trên toàn \\(\\mathbb R\\).</li><li>Xử lí trường hợp hệ số đầu bằng 0 riêng, rồi hợp các miền tham số.</li></ol><p><strong>[Common Traps]</strong> Quên trường hợp suy giảm bậc; nhầm điều kiện \\(\\Delta\\le0\\) với \\(\\Delta\\ge0\\); đếm sai hai đầu mút.</p><p><strong>Ví dụ A (theo tài liệu):</strong> \\(y=-x^3-mx^2+(4m+9)x+5\\). Muốn nghịch biến trên \\(\\mathbb R\\), cần \\(y'=-3x^2-2mx+(4m+9)\\le0\\) với mọi \\(x\\). Tài liệu đưa đến \\(-9\\le m\\le-3\\), có 7 giá trị nguyên. <strong>Ví dụ B (theo tài liệu):</strong> \\(y=(m^2-1)x^3+(m-1)x^2-x+4\\). Xét \\(m=\\pm1\\) trước. \\(m=1\\) cho \\(y'=-1\\), thỏa; \\(m=-1\\) cho
