d>Không; chúng ở trạng thái cân bằng nhiệt.</td>\n  <td>Có thể có trao đổi vi mô nhưng không có truyền nhiệt ròng theo bài học.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt độ và truyền nhiệt</td>\n</tr>\n<tr>\n  <td>Công thức đổi °C sang K theo tài liệu là gì?</td>\n  <td>T(K) = t(°C) + 273.</td>\n  <td>Tài liệu dùng làm tròn 273.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>20°C xấp xỉ bao nhiêu K?</td>\n  <td>293 K.</td>\n  <td>20 + 273.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>293 K xấp xỉ bao nhiêu °C?</td>\n  <td>20°C.</td>\n  <td>293 − 273.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>Công thức đổi °C sang °F là gì?</td>\n  <td>F = 9C/5 + 32.</td>\n  <td>Đừng quên cộng 32.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>35°C bằng bao nhiêu °F?</td>\n  <td>95°F.</td>\n  <td>35×9/5 + 32 = 95.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>104°F bằng bao nhiêu °C?</td>\n  <td>40°C.</td>\n  <td>(104−32)×5/9 = 40.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>Độ tăng 6 K bằng độ tăng bao nhiêu °C?</td>\n  <td>6°C.</td>\n  <td>Độ chênh không cần cộng 273.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>Độ không tuyệt đối ứng với bao nhiêu K?</td>\n  <td>0 K.</td>\n  <td>Không phải 0°C.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>Nhiệt kế chất lỏng dựa trên nguyên lí nào?</td>\n  <td>Sự giãn nở vì nhiệt của chất lỏng.</td>\n  <td>Thủy ngân/rượu là ví dụ.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt kế</td>\n</tr>\n<tr>\n  <td>Nhiệt kế điện tử dựa trên thay đổi nào?</td>\n  <td>Sự thay đổi điện trở của vật dẫn.</td>\n  <td>Không phải sự giãn nở chất lỏng.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt kế</td>\n</tr>\n<tr>\n  <td>Nhiệt kế hồng ngoại đo bằng cách nào?</td>\n  <td>Đo bức xạ nhiệt phát ra từ bề mặt vật, không cần tiếp xúc.</td>\n  <td>Kết quả phụ thuộc bề mặt và cách sử dụng.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt kế</td>\n</tr>\n<tr>\n  <td>GHĐ của dụng cụ là gì?</td>\n  <td>Giá trị lớn nhất dụng cụ đo được.</td>\n  <td>Đừng nhầm với ĐCNN.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt kế</td>\n</tr>\n<tr>\n  <td>ĐCNN của dụng cụ là gì?</td>\n  <td>Giá trị ứng với một vạch chia nhỏ nhất.</td>\n  <td>Không phải giá trị lớn nhất.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt kế</td>\n</tr>\n<tr>\n  <td>Vì sao nhiệt kế y tế 34–42°C không đo được nước sôi?</td>\n  <td>Vì 100°C nằm ngoài dải đo của nó.</td>\n  <td>GHĐ và dải đo phải bao phủ giá trị cần đo.</td>\n  <td>Vật lý</td>\n  <td>Nhiệt kế</td>\n</tr>\n<tr>\n  <td>Thang X có điểm đóng băng −10X và sôi 90X. Quan hệ X với C là gì?</td>\n  <td>X = C − 10.</td>\n  <td>Hai khoảng 100 đơn vị tương ứng 100°C.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ mới</td>\n</tr>\n<tr>\n  <td>Thang Z có mốc 0°C ↔ −5Z và 100°C ↔ 105Z. Quan hệ tuyến tính?</td>\n  <td>Z = 1,1C − 5.</td>\n  <td>Tính cả hệ số góc và độ lệch.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ mới</td>\n</tr>\n<tr>\n  <td>Khi đọc đồ thị, bước đầu tiên là gì?</td>\n  <td>Đọc tên và đơn vị hai trục.</td>\n  <td>Đừng đoán chỉ từ hình dạng.</td>\n  <td>Vật lý</td>\n  <td>Đồ thị chuyển thể</td>\n</tr>\n<tr>\n  <td>Khi chất lỏng bay hơi, các phân tử thoát ra từ đâu?</td>\n  <td>Mặt thoáng chất lỏng.</td>\n  <td>Một số phân tử có động năng đủ lớn để thắng lực hút.</td>\n  <td>Vật lý</td>\n  <td>Bay hơi và sôi</td>\n</tr>\n<tr>\n  <td>Trong mô hình tài liệu, khoảng cách phân tử lớn liên hệ thế nào với lực liên kết?</td>\n  <td>Khoảng cách lớn thì lực liên kết yếu.</td>\n  <td>Không đảo ngược quan hệ.</td>\n  <td>Vật lý</td>\n  <td>Mô hình phân tử</td>\n</tr>\n<tr>\n  <td>Các phân tử chất rắn dao động quanh vị trí nào?</td>\n  <td>Vị trí cân bằng cố định.</td>\n  <td>Đặc trưng của mô hình chất rắn.</td>\n  <td>Vật lý</td>\n  <td>Ba thể của chất</td>\n</tr>\n<tr>\n  <td>Các phân tử chất lỏng dao động quanh vị trí cân bằng như thế nào?</td>\n  <td>Vị trí cân bằng luôn luôn thay đổi.</td>\n  <td>Chất lỏng vẫn giữ thể tích xác định.</td>\n  <td>Vật lý</td>\n  <td>Ba thể của chất</td>\n</tr>\n<tr>\n  <td>Chất khí có thể tích riêng không?</td>\n  <td>Không; thể tích phụ thuộc bình chứa.</td>\n  <td>Khí chiếm toàn bộ thể tích bình.</td>\n  <td>Vật lý</td>\n  <td>Ba thể của chất</td>\n</tr>\n<tr>\n  <td>Sự ngưng tụ luôn là chuyển thể nào?</td>\n  <td>Hơi/khí → lỏng.</td>\n  <td>Không phải lỏng → rắn.</td>\n  <td>Vật lý</td>\n  <td>Chuyển thể</td>\n</tr>\n<tr>\n  <td>Vì sao không được đổi hai yếu tố trong thí nghiệm bay hơi?</td>\n  <td>Vì không xác định được yếu tố nào gây ra khác biệt.</td>\n  <td>Nguyên tắc kiểm soát biến.</td>\n  <td>Vật lý</td>\n  <td>Thí nghiệm bay hơi</td>\n</tr>\n<tr>\n  <td>0°C và 100°C là các mốc gì của nước tinh khiết ở áp suất tiêu chuẩn?</td>\n  <td>Đóng băng/tan và sôi tương ứng.</td>\n  <td>Mốc phụ thuộc điều kiện áp suất được nêu.</td>\n  <td>Vật lý</td>\n  <td>Thang nhiệt độ</td>\n</tr>\n<tr>\n  <td>Khi chất rắn kết tinh nóng chảy, điều gì xảy ra với trật tự tinh thể?</td>\n  <td>Trật tự tinh thể bị phá vỡ dần cho đến khi chất rắn nóng chảy hoàn toàn.</td>\n  <td>Nhiệt lượng có thể dùng cho chuyển thể.</td>\n  <td>Vật lý</td>\n  <td>Chất rắn</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3>7. Active Recall — Tự kiểm tra không nhìn tài liệu</h3>\n<p><strong>Cách làm:</strong> Trả lời bằng lời của mình trước khi mở đáp án. Nếu sai, đánh dấu thẻ tương ứng và ôn lại sau một khoảng nghỉ.</p>\n<h4>Câu hỏi</h4>\n<ol>\n<li>Nêu đủ ba nội dung của mô hình động học phân tử.</li>\n<li>So sánh chất rắn, chất lỏng và chất khí theo khoảng cách, trật tự, chuyển động, hình dạng và thể tích.</li>\n<li>Vì sao khí lan tỏa khắp phòng và dễ nén?</li>\n<li>Phân biệt nóng chảy, đông đặc, hóa hơi, ngưng tụ, thăng hoa và ngưng kết bằng mũi tên trạng thái.</li>\n<li>Nêu hai điểm khác nhau quan trọng giữa bay hơi và sôi.</li>\n<li>Vì sao khăn ướt có thể khô dù nhiệt độ môi trường thấp hơn nhiệt độ sôi của nước?</li>\n<li>Trong thí nghiệm kiểm tra nhiệt độ ảnh hưởng đến tốc độ bay hơi, cần giữ những điều kiện nào giống nhau?</li>\n<li>Trên đồ thị nhiệt độ–thời gian, đoạn nằm ngang trong giai đoạn chuyển thể biểu thị điều gì?</li>\n<li>Nêu một điểm khác nhau giữa chất rắn kết tinh và chất rắn vô định hình.</li>\n<li>Xác định chiều truyền nhiệt khi hai vật ở 80°C và 25°C tiếp xúc nhau.</li>\n<li>Đổi 35°C sang °F.</li>\n<li>Đổi 104°F sang °C rồi sang K.</li>\n<li>Vì sao độ tăng 6 K cũng là độ tăng 6°C?</li>\n<li>Nêu nguyên lí của nhiệt kế chất lỏng, điện tử và hồng ngoại.</li>\n<li>Vì sao phải kiểm tra giới hạn đo trước khi chọn nhiệt kế?</li>\n</ol>\n<h4>Đáp án tự đối chiếu</h4>\n<ol>\n<li>Hạt riêng biệt; chuyển động hỗn loạn không ngừng; lực tương tác hút và đẩy.</li>\n<li>Rắn: hạt gần, có trật tự, dao động quanh vị trí cố định, hình dạng/thể tích xác định. Lỏng: hạt xa hơn, kém trật tự, vị trí cân bằng thay đổi, hình dạng theo bình, thể tích xác định. Khí: hạt rất xa, không trật tự, chuyển động hỗn loạn, hình dạng/thể tích theo bình.</li>\n<li>Các hạt khí cách xa nhau, lực liên kết yếu và chuyển động hỗn loạn.</li>\n<li>Rắn→lỏng nóng chảy; lỏng→rắn đông đặc; lỏng→khí hóa hơi; khí→lỏng ngưng tụ; rắn→hơi thăng hoa; hơi→rắn ngưng kết.</li>\n<li>Bay hơi ở mặt thoáng, có thể xảy ra ở nhiều nhiệt độ; sôi xảy ra trong lòng và mặt thoáng, tại nhiệt độ sôi xác định trong điều kiện xét.</li>\n<li>Bay hơi xảy ra ở mặt thoáng tại nhiều nhiệt độ, không cần đạt nhiệt độ sôi.</li>\n<li>Loại chất lỏng, lượng ban đầu, diện tích mặt thoáng/dụng cụ, thời gian và các điều kiện khác phải giống nhau; chỉ đổi nhiệt độ.</li>\n<li>Chất đang chuyển thể; nhiệt độ không đổi trong đoạn đó theo mô hình bài học.</li>\n<li>Chất kết tinh có cấu trúc tinh thể và nhiệt độ nóng chảy xác định; vô định hình không có cấu trúc tinh thể và không có nhiệt độ nóng chảy xác định.</li>\n<li>Từ vật 80°C sang vật 25°C.</li>\n<li>(35×9/5+32=95°F).</li>\n<li>(C=(104-32)×5/9=40°C), (K≈40+273=313K).</li>\n<li>Hai thang có cùng độ lớn của một đơn vị nhiệt độ; khác nhau ở mốc gốc, không phải độ chia.</li>\n<li>Chất lỏng: giãn nở vì nhiệt; điện tử: thay đổi điện trở; hồng ngoại: đo bức xạ nhiệt bề mặt.</li>\n<li>Nếu nhiệt độ cần đo nằm ngoài dải đo, nhiệt kế không thể đo đúng hoặc không dùng an toàn.</li>\n</ol>\n<h4>Bài tự luận tổng hợp</h4>\n<p>Một bạn nói: “Cốc nước lạnh đặt trong phòng nóng có nước bám bên ngoài vì nước trong cốc thấm qua thành. Khi đun nước, nhiệt độ càng tăng mãi cho đến khi nước bay hơi hết.” Hãy chỉ ra từng ý sai và sửa lại bằng mô hình phân tử, khái niệm ngưng tụ và sự khác nhau giữa bay hơi với sôi.</p>\n<p><strong>Gợi ý chấm:</strong> Nêu được hơi nước trong không khí ngưng tụ trên thành cốc lạnh; bay hơi xảy ra ở mặt thoáng ở nhiều nhiệt độ; khi nước sôi, nhiệt độ không đổi trong suốt giai đoạn sôi theo mô hình bài học.</p>\n<hr />\n<h3>8. Schedule — Lịch ôn tập đề xuất</h3>\n<p>Lịch dưới đây là kế hoạch học tập gợi ý, không phải dữ kiện bắt buộc trong tài liệu. Điều chỉnh thời lượng theo lịch học và kết quả tự kiểm tra.</p>\n<table>\n<thead>\n<tr>\n  <th>Ngày</th>\n  <th>Nội dung</th>\n  <th>Nhiệm vụ cụ thể</th>\n  <th>Tiêu chí hoàn thành</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>D0 — Hôm nay</td>\n  <td>K1–K3: mô hình phân tử, ba thể, chuyển thể</td>\n  <td>Đọc Deep Dive 3.1–3.3; tạo sơ đồ 6 mũi tên chuyển thể; ôn thẻ định nghĩa</td>\n  <td>Gọi đúng 6 quá trình và giải thích 3 ví dụ không nhìn tài liệu</td>\n</tr>\n<tr>\n  <td>D1</td>\n  <td>Bay hơi, sôi, thí nghiệm</td>\n  <td>So sánh hai quá trình; viết quy trình thí nghiệm một biến; làm thẻ đến hạn</td>\n  <td>Phân biệt đúng ít nhất 8/10 tình huống</td>\n</tr>\n<tr>\n  <td>D3</td>\n  <td>Đồ thị và chất rắn</td>\n  <td>Vẽ lại đồ thị nóng chảy/sôi bằng lời; phân biệt kết tinh/vô định hình</td>\n  <td>Giải thích được đoạn nghiêng và đoạn ngang</td>\n</tr>\n<tr>\n  <td>D7</td>\n  <td>Nhiệt độ và truyền nhiệt</td>\n  <td>Tự đặt 5 tình huống truyền nhiệt; làm câu hỏi Active Recall 10–15</td>\n  <td>Không dùng khối lượng để suy ra chiều truyền nhiệt</td>\n</tr>\n<tr>\n  <td>D14</td>\n  <td>Chuyển đổi thang nhiệt độ</td>\n  <td>Làm 10 bài °C–K–°F và 3 bài thang mới</td>\n  <td>Tính đúng công thức, đơn vị và dấu âm</td>\n</tr>\n<tr>\n  <td>D30</td>\n  <td>Nhiệt kế và tổng ôn</td>\n  <td>Chọn nhiệt kế cho 5 mục đích; làm lại các câu từng sai</td>\n  <td>Đạt ít nhất 85% câu tự kiểm tra</td>\n</tr>\n<tr>\n  <td>D60</td>\n  <td>Ôn duy trì</td>\n  <td>Chỉ ôn thẻ còn yếu, tự giải thích bằng lời</td>\n  <td>Nói rõ What–Why–How cho mỗi cụm</td>\n</tr>\n<tr>\n  <td>D90</td>\n  <td>Kiểm tra tổng hợp</td>\n  <td>Làm đề trộn khái niệm, đồ thị và tính toán</td>\n  <td>Không xem ghi chú trong lần làm đầu</td>\n</tr>\n</tbody>\n</table>\n<h4>Quy trình mỗi phiên 25–35 phút</h4>\n<ol>\n<li><strong>5 phút:</strong> ghi lại điều còn nhớ trước khi đọc.</li>\n<li><strong>10–15 phút:</strong> đọc đúng phần kiến thức còn yếu.</li>\n<li><strong>5–10 phút:</strong> luyện flashcard theo cơ chế chủ động nhớ (Active Recall).</li>\n<li><strong>3–5 phút:</strong> ghi lỗi sai và hẹn ngày xem lại.</li>\n</ol>\n<h4>Quy tắc cập nhật lịch</h4>\n<ul>\n<li>Trả lời đúng và giải thích được “vì sao”: tăng khoảng cách ôn.</li>\n<li>Nhớ đáp án nhưng không giải thích được: giữ ở nhóm cần ôn sớm.</li>\n<li>Sai khái niệm hoặc nhầm chiều chuyển thể: quay lại sơ đồ kiến thức, sau đó làm lại ví dụ.</li>\n<li>Với bài tính toán, không chỉ đánh dấu đúng/sai; ghi lại công thức, phép thay số và đơn vị.</li>\n</ul>\n","tags":["Chất khí","Chuyển thể","Nhiệt độ","Nhiệt kế","Study Pack"],"estimatedMinutes":90}]},{"id":"ngu-van","name":"Ngữ văn","icon":"📚","color":"#a855f7","description":"Đọc hiểu, phân tích và viết đoạn nghị luận văn học khoảng 200 chữ","packs":[{"id":"nghi-luan-van-hoc-200-chu","title":"Nghị luận văn học khoảng 200 chữ","subtitle":"Study Pack • Đọc đề, phân tích và luyện viết","content":"<p class=\"pack-meta\"><strong>Nguồn:</strong>  “Megalive 6 tiếng cùng cô Sương Mai – File đọc trước live”, 13 trang</p><p class=\"pack-meta\"><strong>Phạm vi:</strong>  Đề ví dụ về nhân vật Liên và 08 đề luyện thơ – truyện – kí – kịch – tiểu thuyết.</p><p class=\"pack-meta\"><strong>Lưu ý nguồn:</strong>  Tài liệu cung cấp ngữ liệu và yêu cầu đề, không cung cấp bài giải mẫu hoàn chỉnh cho từng đề. Các hướng phân tích dưới đây là gợi ý học tập được xây dựng từ chính ngữ liệu trong tài liệu.</p><hr />\n<h1>1. DASHBOARD &amp; MA TRẬN ƯU TIÊN P1–P4</h1>\n<h2>1.1. Mục tiêu đầu ra</h2>\n<p>Sau khi học gói này, người học cần có thể:</p>\n<ul>\n<li>Xác định đúng đối tượng nghị luận trong đề: nhân vật, cảm xúc, tình huống, hình ảnh, bút pháp, lựa chọn hoặc bi kịch.</li>\n<li>Đọc ngữ liệu để tìm chi tiết then chốt, không kể lại toàn bộ văn bản.</li>\n<li>Nối chi tiết nghệ thuật với ý nghĩa nội dung và thông điệp.</li>\n<li>Viết đoạn văn khoảng 200 chữ có luận điểm rõ, dẫn chứng ngắn, phân tích cụ thể và kết luận có chiều sâu.</li>\n<li>Tự kiểm tra đoạn văn bằng tiêu chí: đúng trọng tâm, đủ bằng chứng, có phân tích, diễn đạt mạch lạc, dung lượng phù hợp.</li>\n</ul>\n<h2>1.2. Ma trận ưu tiên</h2>\n<table>\n<thead>\n<tr>\n  <th>Mức</th>\n  <th>Năng lực</th>\n  <th>Vì sao ưu tiên</th>\n  <th>Dấu hiệu đã đạt</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>P1</td>\n  <td>Đọc đúng yêu cầu đề và chốt luận điểm</td>\n  <td>Lệch đối tượng nghị luận sẽ kéo cả đoạn đi sai hướng</td>\n  <td>Có thể gạch chân đối tượng + động từ yêu cầu trong 10–20 giây</td>\n</tr>\n<tr>\n  <td>P1</td>\n  <td>Chọn 2–3 chi tiết đắt giá và phân tích</td>\n  <td>Đoạn 200 chữ không đủ chỗ kể nhiều</td>\n  <td>Mỗi dẫn chứng đều được giải thích, không chỉ chép lại</td>\n</tr>\n<tr>\n  <td>P1</td>\n  <td>Cấu trúc đoạn nghị luận 200 chữ</td>\n  <td>Giúp bài gọn, có mạch</td>\n  <td>Mở ý – phân tích – đánh giá kết nối tự nhiên</td>\n</tr>\n<tr>\n  <td>P2</td>\n  <td>Nhận diện thể loại và đặc trưng biểu đạt</td>\n  <td>Thơ, truyện, kí, kịch, tiểu thuyết cần cách đọc khác nhau</td>\n  <td>Phân biệt được cảm xúc trữ tình, tình huống truyện, hình ảnh biểu tượng, đối thoại kịch</td>\n</tr>\n<tr>\n  <td>P2</td>\n  <td>Phân tích nghệ thuật gắn với nội dung</td>\n  <td>Tránh nhận xét chung chung kiểu “nghệ thuật đặc sắc”</td>\n  <td>Nêu thủ pháp cụ thể và tác dụng cụ thể</td>\n</tr>\n<tr>\n  <td>P2</td>\n  <td>So sánh, chống nhầm lẫn</td>\n  <td>Giảm lỗi kể lại, suy diễn, phán xét đơn giản</td>\n  <td>Có thể giải thích vì sao một chi tiết tạo nên ý nghĩa</td>\n</tr>\n<tr>\n  <td>P3</td>\n  <td>Active Recall và suy luận ngược</td>\n  <td>Kiểm tra hiểu sâu thay vì học thuộc</td>\n  <td>Từ kết quả trong văn bản, suy ra nguyên nhân hoặc điều kiện</td>\n</tr>\n<tr>\n  <td>P3</td>\n  <td>Tốc độ lập dàn ý</td>\n  <td>Tăng phản xạ trong phòng thi</td>\n  <td>Có dàn ý 3 ý trong khoảng 2 phút</td>\n</tr>\n<tr>\n  <td>P4</td>\n  <td>Tinh chỉnh nhịp câu và phong cách</td>\n  <td>Chỉ tối ưu sau khi đã đúng nội dung</td>\n  <td>Câu gọn, tránh lặp, từ ngữ chính xác</td>\n</tr>\n</tbody>\n</table>\n<h2>1.3. Công thức đoạn văn dùng linh hoạt</h2>\n<ol>\n<li><strong>Câu mở:</strong> Nêu trực tiếp đối tượng và nhận định chính.</li>\n<li><strong>Phân tích 1:</strong> Chọn chi tiết tiêu biểu → giải thích biểu hiện → nêu ý nghĩa.</li>\n<li><strong>Phân tích 2:</strong> Bổ sung chi tiết hoặc thủ pháp nghệ thuật → làm rõ luận điểm.</li>\n<li><strong>Đánh giá:</strong> Khái quát giá trị nhân vật/hình ảnh/tình huống/bút pháp.</li>\n<li><strong>Câu kết:</strong> Rút ra ý nghĩa nhân văn hoặc thông điệp phù hợp với đề.</li>\n</ol>\n<p>Không bắt buộc mỗi đoạn phải đúng năm câu. Đây là khung tư duy, không phải khuôn cứng.</p>\n<h2>1.4. Quy tắc 200 chữ</h2>\n<ul>\n<li>Dành phần lớn dung lượng cho phân tích, không dành quá nhiều chữ giới thiệu tác giả/tác phẩm.</li>\n<li>Dẫn chứng chỉ trích ngắn hoặc diễn đạt lại chính xác.</li>\n<li>Mỗi ý cần trả lời câu hỏi: “Chi tiết này cho thấy điều gì, và vì sao?”</li>\n<li>Không đưa tiểu sử hoặc bối cảnh nếu không giúp giải thích trực tiếp vấn đề.</li>\n<li>Đề yêu cầu “khoảng 200 chữ” thì ưu tiên độ cô đọng và đủ ý; không kéo dài bằng cách lặp luận điểm.</li>\n</ul>\n<hr />\n<h1>2. BẢN ĐỒ KIẾN THỨC — DETAILED KNOWLEDGE GRAPH</h1>\n<h2>2.1. Nút gốc: Viết đoạn nghị luận văn học khoảng 200 chữ</h2>\n<ul>\n<li><strong>Nhánh A — Đọc đề</strong><ul>\n<li>A1. Xác định động từ yêu cầu: cảm nhận, phân tích, nêu cảm xúc, bàn về, lí giải.</li>\n<li>A2. Xác định đối tượng: nhân vật, sự vận động cảm xúc, tình huống bất ngờ, tác dụng thanh lọc, bút pháp miêu tả, hình ảnh biểu tượng, sự lựa chọn, bi kịch.</li>\n<li>A3. Xác định phạm vi: “trong đoạn trích”, “qua nhân vật”, “trong mắt nhân vật khác”, “với anh/chị”.</li>\n</ul>\n</li>\n<li><strong>Nhánh B — Đọc ngữ liệu</strong><ul>\n<li>B1. Chi tiết hành động/lời nói/suy nghĩ.</li>\n<li>B2. Hình ảnh, từ ngữ, âm thanh, màu sắc.</li>\n<li>B3. Điểm chuyển biến: trước–sau, hi vọng–thất vọng, gần gũi–xa cách, vẻ ngoài–bản chất.</li>\n<li>B4. Giọng điệu và thủ pháp.</li>\n</ul>\n</li>\n<li><strong>Nhánh C — Hình thành luận điểm</strong><ul>\n<li>C1. Nêu đặc điểm trung tâm.</li>\n<li>C2. Chọn bằng chứng.</li>\n<li>C3. Giải thích cơ chế tạo nghĩa.</li>\n<li>C4. Đánh giá thông điệp.</li>\n</ul>\n</li>\n<li><strong>Nhánh D — Viết và tự kiểm</strong><ul>\n<li>D1. Câu chủ đề.</li>\n<li>D2. Phân tích bằng chứng.</li>\n<li>D3. Liên kết ý.</li>\n<li>D4. Kiểm tra độ bám đề, độ chính xác và dung lượng.</li>\n</ul>\n</li>\n</ul>\n<h3>Các mối liên hệ</h3>\n<ul>\n<li>[Prerequisite] Đọc đúng đề → là điều kiện để chọn đúng luận điểm.</li>\n<li>[Prerequisite] Hiểu chi tiết ngữ liệu → là điều kiện để phân tích có căn cứ.</li>\n<li>[Consequence] Chọn chi tiết có tính đại diện → giúp đoạn văn tập trung, không sa vào kể lể.</li>\n<li>[Consequence] Giải thích được tác dụng của chi tiết → làm luận điểm thuyết phục hơn.</li>\n<li>[Contrast] Tóm tắt diễn biến ≠ phân tích: tóm tắt trả lời “chuyện gì xảy ra”; phân tích trả lời “chi tiết đó có ý nghĩa gì và tạo ý nghĩa bằng cách nào”.</li>\n<li>[Application] Đọc sự đối lập sáng–tối trong “Hai đứa trẻ” → phân tích không khí phố huyện và tâm trạng Liên.</li>\n<li>[Application] Đọc đối thoại, độc thoại trong “Hồn Trương Ba, da hàng thịt” → phân tích xung đột giữa bản thể và thân xác.</li>\n<li>[Application] Đọc hình ảnh “cửa sau” theo hai lớp nghĩa → phân tích sự chuyển nghĩa từ mái ấm gia đình sang lối đi khuất tất.</li>\n<li>[Application] Theo dõi chuyển biến tâm trạng trong “Một ngày đường từ miền đất trung du” → phân tích vận động cảm xúc của nhân vật trữ tình.</li>\n</ul>\n<h2>2.2. Bản đồ dạng đề trong tài liệu</h2>\n<table>\n<thead>\n<tr>\n  <th>Đề/ngữ liệu</th>\n  <th>Đối tượng nghị luận</th>\n  <th>Lối đọc trọng tâm</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Ví dụ: “Hai đứa trẻ” – Thạch Lam</td>\n  <td>Nhân vật Liên</td>\n  <td>Tâm trạng, cảm giác, lòng thương người, bối cảnh phố huyện</td>\n</tr>\n<tr>\n  <td>Đề 01: “Hoa dại núi Hoàng Liên” – Xuân Quỳnh</td>\n  <td>Sự vận động cảm xúc của nhân vật trữ tình</td>\n  <td>Từ mệt mỏi, cô đơn đến vui mừng, ngỡ ngàng và suy ngẫm về hoa dại</td>\n</tr>\n<tr>\n  <td>Đề 02: “Chân quê” – Nguyễn Bính</td>\n  <td>Hình ảnh “em” trong mắt “anh”</td>\n  <td>Trang phục truyền thống, thay đổi sau khi lên tỉnh, tình yêu và ý thức gìn giữ nét quê</td>\n</tr>\n<tr>\n  <td>Đề 03: “Người ngựa ngựa người” – Nguyễn Công Hoan</td>\n  <td>Tình huống bất ngờ người phụ nữ không trả tiền</td>\n  <td>Nghịch lí, vẻ ngoài và hoàn cảnh thật, bi hài, cảnh đời người lao động nghèo</td>\n</tr>\n<tr>\n  <td>Đề 04: “Nhà mẹ Lê” – Thạch Lam</td>\n  <td>Tác dụng “thanh lọc” tâm hồn người đọc</td>\n  <td>Xót thương, thức tỉnh lòng trắc ẩn, nhận thức về đói nghèo và phẩm giá</td>\n</tr>\n<tr>\n  <td>Đề 05: “Chả cá” – Vũ Bằng</td>\n  <td>Bút pháp miêu tả</td>\n  <td>Cảm giác đa giác quan, chi tiết cụ thể, nhịp điệu sinh động, tình yêu văn hóa Hà Nội</td>\n</tr>\n<tr>\n  <td>Đề 06: “Cửa sau” – Nguyễn Ngọc Tư</td>\n  <td>Hình ảnh “cửa sau”</td>\n  <td>Nghĩa thực và nghĩa ẩn dụ; kí ức gia đình đối lập với “đi cửa sau” tiêu cực</td>\n</tr>\n<tr>\n  <td>Đề 07: “Hồn Trương Ba, da hàng thịt” – Lưu Quang Vũ</td>\n  <td>Sự lựa chọn của hồn Trương Ba</td>\n  <td>Từ chối sống không toàn vẹn, phẩm giá và quyền được sống đúng bản thể</td>\n</tr>\n<tr>\n  <td>Đề 08: “Sống mòn” – Nam Cao</td>\n  <td>Bi kịch người trí thức qua Thứ</td>\n  <td>Ước mơ lớn đối lập với đời sống tù túng; ý thức nhưng bất lực trước hoàn cảnh</td>\n</tr>\n</tbody>\n</table>\n<h2>2.3. Quan hệ giữa các năng lực</h2>\n<ul>\n<li>[Prerequisite] Nhận diện kiểu đề → quyết định tiêu chí chọn dẫn chứng.</li>\n<li>[Consequence] Đề hỏi “sự vận động” → cần ít nhất hai chặng cảm xúc, không chỉ nêu trạng thái cuối.</li>\n<li>[Consequence] Đề hỏi “tình huống bất ngờ” → phải chỉ ra điều người đọc/người trong truyện chờ đợi và điều thực tế xảy ra.</li>\n<li>[Contrast] Hình ảnh theo nghĩa đen ≠ hình ảnh biểu tượng: biểu tượng có thêm tầng nghĩa tư tưởng/cảm xúc.</li>\n<li>[Contrast] Nhân vật có ước mơ ≠ nhân vật có khả năng thực hiện ước mơ: khoảng cách giữa hai điều này có thể tạo bi kịch.</li>\n<li>[Application] Dùng đối lập để làm rõ: phố huyện tối và những nguồn sáng nhỏ; hoa dại và hoa được chăm sóc; bên trong và bên ngoài của Trương Ba; ước vọng và đời sống của Thứ.</li>\n</ul>\n<hr />\n<h1>3. LÝ THUYẾT + FEYNMAN — DEEP DIVE</h1>\n<h2>3.1. Đọc đề và khóa đúng đối tượng</h2>\n<h3>Tại sao cần?</h3>\n<p>Một đề có thể nhắc đến nhiều nhân vật, hình ảnh hoặc sự kiện, nhưng chỉ yêu cầu nghị luận về một đối tượng cụ thể. Nếu viết về toàn bộ tác phẩm, đoạn văn dễ dài mà vẫn không trả lời đúng câu hỏi.</p>\n<h3>Hoạt động như thế nào?</h3>\n<p>Khoanh hai thành phần:</p>\n<ol>\n<li><strong>Động từ nhiệm vụ:</strong> phân tích, cảm nhận, lí giải, nêu tác dụng, trình bày sự lựa chọn.</li>\n<li><strong>Danh từ trung tâm:</strong> nhân vật Liên, sự vận động cảm xúc, hình ảnh “em”, tình huống bất ngờ, bút pháp miêu tả…</li>\n</ol>\n<p>Sau đó viết một câu trả lời sơ bộ: “Đối tượng này nổi bật ở điểm nào?”</p>\n<h3>Bản chất cốt lõi</h3>\n<p>Đề bài chính là ranh giới của đoạn văn. Mọi chi tiết đưa vào phải phục vụ ranh giới đó.</p>\n<p><strong>Feynman Check:</strong> Nếu đề hỏi về “sự lựa chọn của Trương Ba”, em cần phân tích toàn bộ vở kịch hay lí do và ý nghĩa của lựa chọn trong đoạn trích?</p>\n<h2>3.2. Phân tích thay vì kể lại</h2>\n<h3>Tại sao cần?</h3>\n<p>Người chấm cần thấy người viết hiểu chi tiết có ý nghĩa gì, không chỉ nhớ diễn biến.</p>\n<h3>Công thức phân tích một chi tiết</h3>\n<p><strong>Chi tiết → Biểu hiện → Tác dụng/ý nghĩa → Liên hệ luận điểm.</strong></p>\n<p>Ví dụ với “Hai đứa trẻ”: phố huyện còn lại rác chợ, mùi ẩm và trẻ nghèo nhặt nhạnh đồ bỏ lại. Không dừng ở việc kể rằng trẻ đi nhặt rác; cần chỉ ra cảnh sống thiếu thốn, sự đối lập giữa cái nhìn thương cảm của Liên và việc chính chị cũng nghèo, không thể giúp đỡ.</p>\n<h3>Bản chất cốt lõi</h3>\n<p>Phân tích là làm lộ ra quan hệ giữa cái được kể và ý nghĩa nằm sau nó.</p>\n<p><strong>Feynman Check:</strong> Khi trích một chi tiết, em có giải thích được vì sao chi tiết ấy quan trọng không?</p>\n<h2>3.3. Đọc sự vận động cảm xúc trong thơ</h2>\n<h3>Tại sao cần?</h3>\n<p>Đề 01 không chỉ hỏi “nhân vật trữ tình cảm thấy gì” mà hỏi “sự vận động cảm xúc”. Vì vậy, phải nhìn được sự thay đổi theo trình tự bài thơ.</p>\n<h3>Cách đọc</h3>\n<ul>\n<li>Chặng 1: hành trình mệt mỏi, nắng gắt, bụi bay, tiếng ve gây nhói lòng và cảm giác lạc lõng.</li>\n<li>Chặng 2: lên cao, nắng nhạt dần, bất ngờ bắt gặp hoa và chuyển sang vui mừng, ngạc nhiên.</li>\n<li>Chặng 3: quan sát nhiều loài hoa dại, từ cảm xúc cá nhân chuyển sang suy ngẫm về vẻ đẹp âm thầm, ít được chú ý.</li>\n<li>Chặng 4: nhận thức về giá trị riêng của hoa dại, không cần được con người chăm sóc hay ngợi ca mới có ý nghĩa.</li>\n</ul>\n<h3>Bản chất cốt lõi</h3>\n<p>Sự vận động cảm xúc là đường đi của tâm trạng, không phải danh sách cảm xúc rời rạc.</p>\n<p><strong>Feynman Check:</strong> Điều gì khiến tâm trạng nhân vật trữ tình thay đổi từ lạc lõng sang vui mừng?</p>\n<h2>3.4. Đọc nhân vật qua chi tiết và tương phản</h2>\n<h3>Tại sao cần?</h3>\n<p>Nhân vật văn học hiếm khi được hiểu đầy đủ chỉ qua một lời giới thiệu. Tâm trạng và tính cách thường hiện ra qua hành động, lời nói, cảm giác và cách nhân vật nhìn thế giới.</p>\n<h3>Ví dụ: Liên trong “Hai đứa trẻ”</h3>\n<ul>\n<li>Liên cảm nhận buổi chiều bằng nhiều giác quan: màu trời, tiếng ếch nhái, tiếng muỗi, mùi đất.</li>\n<li>Bóng tối dần bao phủ không gian và thấm vào tâm hồn, tạo nỗi buồn man mác.</li>\n<li>Liên động lòng thương trẻ nghèo nhặt nhạnh, nhưng bản thân cũng không có tiền để cho.</li>\n<li>Sự bất lực không xóa đi lòng trắc ẩn; trái lại, làm nổi bật cảnh nghèo chung của phố huyện.</li>\n</ul>\n<h3>Bản chất cốt lõi</h3>\n<p>Nhân vật được khắc họa qua những gì họ cảm nhận, lựa chọn, làm và không thể làm.</p>\n<p><strong>Feynman Check:</strong> Chi tiết Liên thương trẻ nghèo nhưng không có tiền cho thấy điều gì ngoài việc chị nghèo?</p>\n<h2>3.5. Nhận diện tình huống truyện và nghịch lí</h2>\n<h3>Tại sao cần?</h3>\n<p>Đề 03 yêu cầu phân tích tình huống bất ngờ: người phụ nữ trông có vẻ sang trọng lại không trả tiền cho anh phu xe. Trọng tâm không phải kể lại chuyến xe mà là giải thích nghịch lí ấy có tác dụng gì.</p>\n<h3>Cách đọc</h3>\n<ul>\n<li>Hoàn cảnh anh phu xe: vừa ốm dậy, mất tiền dành dụm, cần kiếm tiền đón Tết, mong trở về với vợ con.</li>\n<li>Vẻ ngoài và cách mặc cả của người khách tạo kỳ vọng ban đầu nhưng không bảo đảm khả năng trả tiền.</li>\n<li>Đến lúc giao thừa, anh xe tưởng sắp có khoản tiền để lo cho gia đình; sự thật người khách cũng không có tiền trả.</li>\n<li>Hai người đều lâm vào cảnh túng thiếu, nhưng người lao động phải gánh hậu quả của cuộc mặc cả và chuyến xe không được thanh toán.</li>\n</ul>\n<h3>Bản chất cốt lõi</h3>\n<p>Tình huống bất ngờ làm đảo chiều kỳ vọng, qua đó phơi bày sự trớ trêu của đời sống và tạo hiệu quả châm biếm, xót xa.</p>\n<p><strong>Feynman Check:</strong> Vì sao việc người khách không trả tiền đau đớn hơn đối với anh phu xe vào đêm giao thừa?</p>\n<h2>3.6. “Thanh lọc” tâm hồn qua văn học</h2>\n<h3>Tại sao cần?</h3>\n<p>Đề 04 yêu cầu phản hồi cá nhân trước đoạn trích “Nhà mẹ Lê”, không chỉ phân tích thủ pháp hay kể hoàn cảnh nhân vật.</p>\n<h3>Cách triển khai</h3>\n<ul>\n<li>Nêu cảm xúc được đánh thức: xót thương, day dứt, biết ơn hoặc trân trọng.</li>\n<li>Gắn cảm xúc với chi tiết cụ thể: nhà chật, lao động thuê mướn, mùa đông thất nghiệp, trẻ đói và rét.</li>\n<li>Chỉ ra thay đổi trong nhận thức: nghèo đói không phải điều để khinh miệt; người nghèo cần được nhìn bằng sự cảm thông và tôn trọng.</li>\n<li>Nêu tác động đến cách sống: bớt thờ ơ, biết quan tâm và không vội phán xét.</li>\n</ul>\n<h3>Bản chất cốt lõi</h3>\n<p>“Thanh lọc” ở đây có thể hiểu là tác phẩm giúp người đọc nhìn lại cảm xúc, thái độ và trách nhiệm của chính mình. Không cần tuyên bố thay đổi quá lớn nếu không có căn cứ; một nhận thức chân thật đã đủ thuyết phục.</p>\n<p><strong>Feynman Check:</strong> Sau khi đọc cảnh mẹ Lê ôm con trong ổ rơm, em hiểu thêm điều gì về những người nghèo?</p>\n<h2>3.7. Phân tích bút pháp miêu tả</h2>\n<h3>Tại sao cần?</h3>\n<p>Đề 05 hỏi “bút pháp miêu tả” trong “Chả cá”, do đó phải nói về cách tác giả khiến món ăn và không khí hiện lên sinh động, không chỉ khen món ăn ngon.</p>\n<h3>Những dấu hiệu trong ngữ liệu</h3>\n<ul>\n<li><strong>Miêu tả đa giác quan:</strong> nhìn thấy khói bốc, màu vàng nghệ, rau xanh; nghe tiếng mỡ lép bép, tiếng gọi món; cảm nhận hơi ấm, hương vị và độ béo bùi.</li>\n<li><strong>Chi tiết cụ thể:</strong> bàn ghế cũ, căn gác, người phục vụ chạy nhốn nháo, khách chờ món.</li>\n<li><strong>So sánh và nhân hóa:</strong> cá được ví như những đứa bé nằm chơi; hình ảnh gợi liên tưởng khiến món ăn vừa đẹp vừa gần gũi.</li>\n<li><strong>Nhịp điệu sinh động:</strong> câu văn liệt kê nguyên liệu và thao tác ăn uống tạo cảm giác phong phú, rộn ràng.</li>\n<li><strong>Kết hợp món ăn với không gian văn hóa:</strong> hiệu chả cá phố Chả Cá, ngày rét, bạn bè, người Hà Nội và khách phương xa.</li>\n</ul>\n<h3>Bản chất cốt lõi</h3>\n<p>Miêu tả hiệu quả không chỉ gọi tên sự vật mà tái tạo trải nghiệm để người đọc gần như nhìn, nghe, ngửi và nếm bằng trí tưởng tượng.</p>\n<p><strong>Feynman Check:</strong> Nếu tác giả chỉ viết “món chả cá rất ngon”, điều gì sẽ mất so với đoạn trích?</p>\n<h2>3.8. Hình ảnh biểu tượng và hai lớp nghĩa</h2>\n<h3>Tại sao cần?</h3>\n<p>Đề 06 đặt “cửa sau” trong ngoặc kép ở phần nghĩa xã hội. Dấu hiệu này báo rằng hình ảnh có thể chuyển từ nghĩa vật thể trong ngôi nhà sang nghĩa ẩn dụ về cách làm khuất tất.</p>\n<h3>Hai lớp nghĩa trong “Cửa sau”</h3>\n<ul>\n<li><strong>Nghĩa gia đình/kí ức:</strong> nơi gắn với vườn cây, mộ tổ tiên, công việc của mẹ, hình ảnh cha, bà, chị và tuổi thơ; biểu tượng cho sự đầm ấm, sum vầy, quê nhà.</li>\n<li><strong>Nghĩa xã hội tiêu cực:</strong> “đi cửa sau” gắn với chen lấn, quà cáp và sự thất thoát, làm suy giảm lòng tin, tình thương và sự tôn trọng.</li>\n<li><strong>Mâu thuẫn:</strong> người viết muốn giữ lại hình ảnh trong trẻo của cánh cửa sau gia đình, nhưng cách dùng xã hội đã khiến hình ảnh ấy mang nghĩa buồn.</li>\n</ul>\n<h3>Bản chất cốt lõi</h3>\n<p>Một hình ảnh biểu tượng được tạo ra bởi mạng lưới kí ức, cảm xúc và đối chiếu, không chỉ bởi hình dáng vật chất.</p>\n<p><strong>Feynman Check:</strong> Vì sao cùng là “cửa sau” mà một nghĩa gợi sum vầy, nghĩa kia lại gợi sự mất lòng tin?</p>\n<h2>3.9. Sự lựa chọn và tính toàn vẹn của bản thân</h2>\n<h3>Tại sao cần?</h3>\n<p>Đề 07 hỏi sự lựa chọn của hồn Trương Ba. Điểm chính là nhân vật không chấp nhận tiếp tục sống trong thân xác người khác khi đời sống ấy khiến bên trong và bên ngoài bất nhất.</p>\n<h3>Cách đọc</h3>\n<ul>\n<li>Hồn Trương Ba nhận ra thân xác đang lấn át mình.</li>\n<li>Nhân vật bác bỏ suy nghĩ “chẳng còn cách nào khác”.</li>\n<li>Lời khẳng định “Tôi muốn được là tôi toàn vẹn” thể hiện nhu cầu sống đúng với bản thể và phẩm giá.</li>\n<li>Đế Thích viện dẫn việc nhiều người không thể sống hoàn toàn theo điều mình nghĩ; lời này làm rõ sự xung đột giữa thích nghi với hoàn cảnh và giữ gìn bản thân.</li>\n<li>Trương Ba nhấn mạnh rằng chỉ cho sống thôi chưa đủ; cần quan tâm đến cách sống.</li>\n</ul>\n<h3>Bản chất cốt lõi</h3>\n<p>Sự sống không chỉ là tồn tại về mặt sinh học; còn liên quan đến nhân cách, phẩm giá và sự thống nhất giữa bên trong với bên ngoài.</p>\n<p><strong>Feynman Check:</strong> Vì sao Trương Ba không xem việc được sống tiếp là đủ?</p>\n<h2>3.10. Bi kịch người trí thức trong “Sống mòn”</h2>\n<h3>Tại sao cần?</h3>\n<p>Đề 08 yêu cầu bi kịch người trí thức qua Thứ, vì thế cần phân tích khoảng cách giữa khát vọng và thực tế, đồng thời nhận ra sự bất lực của nhân vật trước hoàn cảnh và chính mình.</p>\n<h3>Cấu trúc bi kịch</h3>\n<ul>\n<li><strong>Khát vọng ban đầu:</strong> học hành, thành đạt, sang Pháp, trở thành người có ích và tạo thay đổi lớn.</li>\n<li><strong>Hiện thực:</strong> công việc và đời sống thu hẹp; từ ước mơ lớn chuyển sang lo chuyện nuôi gia đình, để dành, mua vườn, làm nhà.</li>\n<li><strong>Tự ý thức:</strong> Thứ nhận ra mình đang mòn mỏi, sợ trở thành người “chết mà chưa sống”.</li>\n<li><strong>Bất lực:</strong> dù tức giận và muốn chống lại, nhân vật vẫn hình dung mình sẽ không đủ sức hành động; con tàu tiếp tục đưa y về quê.</li>\n<li><strong>Mở rộng ý nghĩa:</strong> hình ảnh những người sống như Thứ cho thấy đây không chỉ là khủng hoảng cá nhân mà còn là tình trạng của nhiều người trong hoàn cảnh xã hội ấy.</li>\n</ul>\n<h3>Bản chất cốt lõi</h3>\n<p>Bi kịch sâu nhất không chỉ là nghèo khó, mà là có ý thức về cuộc đời bị thu hẹp nhưng không tìm được sức mạnh hoặc con đường để thoát ra.</p>\n<p><strong>Feynman Check:</strong> Điều gì khiến Thứ đau khổ hơn việc đơn thuần không có một công việc tốt?</p>\n<hr />\n<h1>4. BẢNG SO SÁNH &amp; PHÒNG CHỐNG SAI LẦM</h1>\n<h2>4.1. Các cặp khái niệm dễ nhầm</h2>\n<table>\n<thead>\n<tr>\n  <th>Dễ nhầm</th>\n  <th>Khác nhau ở đâu?</th>\n  <th>Cách xử lý</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Kể lại và phân tích</td>\n  <td>Kể lại nói sự việc; phân tích giải thích ý nghĩa</td>\n  <td>Sau mỗi chi tiết, thêm câu “Điều đó cho thấy…”</td>\n</tr>\n<tr>\n  <td>Nêu cảm xúc và phân tích sự vận động cảm xúc</td>\n  <td>Nêu cảm xúc chỉ gọi tên tâm trạng; vận động phải có trình tự thay đổi</td>\n  <td>Chia bài thơ thành các chặng và tìm từ ngữ chuyển biến</td>\n</tr>\n<tr>\n  <td>Tình huống truyện và chủ đề truyện</td>\n  <td>Tình huống là hoàn cảnh then chốt tạo xung đột; chủ đề là vấn đề/ý nghĩa tác phẩm đặt ra</td>\n  <td>Chỉ ra nghịch lí cụ thể trước, rồi mới nêu ý nghĩa</td>\n</tr>\n<tr>\n  <td>Nghĩa đen và nghĩa biểu tượng</td>\n  <td>Nghĩa đen là vật/sự việc; nghĩa biểu tượng là tầng ý nghĩa rộng hơn được gợi ra</td>\n  <td>Tìm sự lặp lại, đối lập và cảm xúc gắn với hình ảnh</td>\n</tr>\n<tr>\n  <td>Miêu tả và liệt kê</td>\n  <td>Miêu tả tạo hình dung cảm giác; liệt kê chỉ xếp các chi tiết nếu thiếu liên kết</td>\n  <td>Nêu cách chi tiết phối hợp để tạo không khí/trải nghiệm</td>\n</tr>\n<tr>\n  <td>Sự sống và sống có ý nghĩa</td>\n  <td>Tồn tại không đồng nghĩa với được sống đúng bản thân</td>\n  <td>Liên hệ lời thoại và xung đột của Trương Ba</td>\n</tr>\n<tr>\n  <td>Ước mơ và khả năng thực hiện</td>\n  <td>Khát vọng có thể lớn nhưng điều kiện sống ngăn cản</td>\n  <td>Phân tích khoảng cách giữa dự định và hành động thực tế</td>\n</tr>\n<tr>\n  <td>Đồng cảm và thương hại</td>\n  <td>Đồng cảm cố hiểu hoàn cảnh và giữ phẩm giá người khác; thương hại có thể chỉ dừng ở cảm xúc từ trên nhìn xuống</td>\n  <td>Tránh phán xét; dùng chi tiết để hiểu điều kiện sống</td>\n</tr>\n<tr>\n  <td>Vẻ ngoài và bản chất/hoàn cảnh</td>\n  <td>Trang phục hay dáng vẻ không đủ để kết luận về đời sống thực</td>\n  <td>Đọc hành động, lời nói và kết cục tình huống</td>\n</tr>\n<tr>\n  <td>Dẫn chứng và phân tích dẫn chứng</td>\n  <td>Trích dẫn không tự chứng minh luận điểm</td>\n  <td>Giải thích từ ngữ, hành động, tương phản hoặc tác dụng sau khi dẫn</td>\n</tr>\n</tbody>\n</table>\n<h2>4.2. Bẫy thường gặp và chiến thuật chống bẫy</h2>\n<table>\n<thead>\n<tr>\n  <th>Bẫy</th>\n  <th>Vì sao sai</th>\n  <th>Chiến thuật</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Mở đoạn quá dài bằng tiểu sử tác giả</td>\n  <td>Tốn dung lượng, làm mờ trọng tâm</td>\n  <td>Chỉ giới thiệu tác giả/tác phẩm khi giúp hiểu trực tiếp vấn đề</td>\n</tr>\n<tr>\n  <td>Chép quá nhiều ngữ liệu</td>\n  <td>Đoạn văn biến thành trích dẫn</td>\n  <td>Chọn 2–3 chi tiết, trích ngắn</td>\n</tr>\n<tr>\n  <td>Dùng từ chung chung: “rất hay”, “rất sâu sắc”</td>\n  <td>Không chứng minh được hiểu biết</td>\n  <td>Nêu cụ thể hay ở hình ảnh, giọng điệu, tương phản hay tình huống nào</td>\n</tr>\n<tr>\n  <td>Gán ý nghĩa không có căn cứ</td>\n  <td>Dễ suy diễn quá mức</td>\n  <td>Mỗi nhận xét phải dựa vào từ ngữ, hành động hoặc cấu trúc có trong đoạn</td>\n</tr>\n<tr>\n  <td>Chỉ nói nhân vật đáng thương/đáng trách</td>\n  <td>Đơn giản hóa nhân vật</td>\n  <td>Xem cả hoàn cảnh, ý thức, lựa chọn và giới hạn hành động</td>\n</tr>\n<tr>\n  <td>Phân tích nghệ thuật tách khỏi nội dung</td>\n  <td>Thành danh sách thuật ngữ</td>\n  <td>Sau tên thủ pháp phải nêu tác dụng cụ thể</td>\n</tr>\n<tr>\n  <td>Không theo trình tự bài thơ</td>\n  <td>Bỏ mất sự chuyển biến</td>\n  <td>Đánh dấu từ chỉ thời gian, trạng thái, bước ngoặt</td>\n</tr>\n<tr>\n  <td>Đọc “cửa sau” chỉ theo một nghĩa</td>\n  <td>Bỏ qua cấu trúc đối lập trung tâm</td>\n  <td>Phân tích nghĩa gia đình trước, nghĩa xã hội sau, rồi chỉ ra sự tương phản</td>\n</tr>\n<tr>\n  <td>Kết luận đạo đức quá to tát</td>\n  <td>Không tự nhiên và thiếu căn cứ</td>\n  <td>Rút ra thông điệp vừa đủ, gắn với chi tiết</td>\n</tr>\n<tr>\n  <td>Cố nhồi mọi ý trong 200 chữ</td>\n  <td>Đoạn rời rạc, thiếu chiều sâu</td>\n  <td>Chọn một luận điểm chính và hai luận cứ mạnh</td>\n</tr>\n</tbody>\n</table>\n<h2>4.3. Danh sách kiểm tra trước khi nộp</h2>\n<ul>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Tôi trả lời đúng đối tượng đề hỏi.</li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Câu đầu có luận điểm rõ.</li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Tôi dùng chi tiết thực sự có trong ngữ liệu.</li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Mỗi dẫn chứng đều được phân tích.</li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Tôi đã chỉ ra ít nhất một quan hệ như đối lập, chuyển biến, nguyên nhân–kết quả hoặc biểu tượng.</li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Tôi không kể lại toàn bộ văn bản.</li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Câu kết khái quát được giá trị/ý nghĩa.</li>\n<li class=\"task-list-item\"><input class=\"task-list-item-checkbox\" type=\"checkbox\" disabled/>Đoạn văn mạch lạc, không lặp ý, phù hợp dung lượng khoảng 200 chữ.</li>\n</ul>\n<hr />\n<h1>5. CẨM NANG DẠNG BÀI — PATTERN RECOGNITION</h1>\n<h2>Pattern 1 — Phân tích cảm nhận về một nhân vật</h2>\n<p><strong>Recognition Sign:</strong> Đề dùng “cảm nhận về nhân vật…”, như nhân vật Liên trong “Hai đứa trẻ”.</p>\n<p><strong>Step-by-step Strategy</strong></p>\n<ol>\n<li>Chốt đặc điểm nổi bật nhất của nhân vật trong đúng đoạn trích.</li>\n<li>Tìm cảm giác, suy nghĩ, lời nói hoặc hành động biểu hiện đặc điểm đó.</li>\n<li>Phân tích ít nhất hai chi tiết liên quan.</li>\n<li>Gắn nhân vật với hoàn cảnh sống và không khí xung quanh.</li>\n<li>Kết lại bằng giá trị nhân văn mà cách khắc họa gợi ra.</li>\n</ol>\n<p><strong>Áp dụng cho Liên</strong></p>\n<ul>\n<li>Không khí chiều tàn được dựng bằng màu trời, âm thanh đồng ruộng, tiếng muỗi và bóng tối.</li>\n<li>Liên có tâm hồn nhạy cảm, buồn man mác trước ngày tàn.</li>\n<li>Liên thương những đứa trẻ nghèo nhặt nhạnh đồ bỏ lại.</li>\n<li>Việc không có tiền cho chúng cho thấy cái nghèo bao trùm cả người quan sát lẫn người được thương; lòng trắc ẩn vẫn hiện hữu trong sự bất lực.</li>\n</ul>\n<p><strong>Common Traps</strong></p>\n<ul>\n<li>Chỉ gọi Liên là “nhân hậu” mà không chứng minh.</li>\n<li>Chỉ tả cảnh mà quên nối cảnh với tâm trạng.</li>\n<li>Biến đoạn văn thành phân tích toàn bộ truyện.</li>\n</ul>\n<h2>Pattern 2 — Phân tích sự vận động cảm xúc trong thơ</h2>\n<p><strong>Recognition Sign:</strong> Đề có cụm “sự vận động cảm xúc”, “diễn biến tâm trạng” hoặc yêu cầu phân tích hành trình cảm xúc.</p>\n<p><strong>Step-by-step Strategy</strong></p>\n<ol>\n<li>Chia văn bản thành 2–4 chặng theo từ ngữ, hình ảnh và điểm ngoặt.</li>\n<li>Gọi tên cảm xúc ở mỗi chặng bằng từ chính xác.</li>\n<li>Chỉ ra tác nhân làm tâm trạng thay đổi.</li>\n<li>Phân tích cách hình ảnh/nhịp thơ/từ ngữ thể hiện chuyển biến.</li>\n<li>Kết luận về nhận thức hoặc ý nghĩa được mở ra từ hành trình đó.</li>\n</ol>\n<p><strong>Áp dụng cho “Hoa dại núi Hoàng Liên”</strong></p>\n<ul>\n<li>Đầu hành trình: bụi, nắng gắt, tiếng ve và nỗi nhớ tạo cảm giác mệt mỏi, cô đơn.</li>\n<li>Bước ngoặt: bắt gặp một nhành hoa khiến nhân vật trữ tình vui mừng.</li>\n<li>Mở rộng: gặp nhiều loài hoa dại, cảm xúc cá nhân chuyển thành suy ngẫm về vẻ đẹp ít được để ý.</li>\n<li>Kết tinh: hoa dại vẫn có giá trị dù không được chăm sóc hay trưng bày.</li>\n</ul>\n<p><strong>Common Traps</strong></p>\n<ul>\n<li>Chỉ liệt kê cảm xúc mà không giải thích sự chuyển biến.</li>\n<li>Bỏ qua vai trò của bước ngoặt “bắt gặp một nhành hoa”.</li>\n<li>Khẳng định ý nghĩa vượt quá những gì bài thơ gợi ra.</li>\n</ul>\n<h2>Pattern 3 — Phân tích hình ảnh một người trong cái nhìn của người khác</h2>\n<p><strong>Recognition Sign:</strong> Đề hỏi “hình ảnh em trong mắt anh”, “cách nhân vật nhìn người khác”.</p>\n<p><strong>Step-by-step Strategy</strong></p>\n<ol>\n<li>Xác định người nhìn và người được nhìn.</li>\n<li>Tìm những chi tiết người nhìn nhớ, khen, chê hoặc mong muốn.</li>\n<li>Đối chiếu hình ảnh hiện tại với hình ảnh quá khứ.</li>\n<li>Phân tích tình cảm và quan niệm ẩn sau cái nhìn ấy.</li>\n<li>Nếu có thể, nhận diện giới hạn/chủ quan trong cách nhìn; không đồng nhất hoàn toàn tiếng nói nhân vật với chân lí của tác phẩm.</li>\n</ol>\n<p><strong>Áp dụng cho “Chân quê”</strong></p>\n<ul>\n<li>“Anh” nhớ trang phục truyền thống như yếm lụa, áo tứ thân, khăn mỏ quạ, quần nái đen.</li>\n<li>Trang phục mới sau khi “em” đi tỉnh về khiến “anh” lo vẻ quê mùa bị phai nhạt.</li>\n<li>Lời van nài thể hiện tình yêu gắn với nếp sống, vẻ đẹp truyền thống và mong muốn giữ gìn bản sắc quê.</li>\n<li>Có thể lưu ý rằng đây là cái nhìn và mong muốn của nhân vật “anh”; khi viết, cần bám vào ngữ liệu, không vội khẳng định đó là quan điểm duy nhất đúng.</li>\n</ul>\n<p><strong>Common Traps</strong></p>\n<ul>\n<li>Chỉ kể tên trang phục.</li>\n<li>Bỏ qua giọng điệu thân mật, nũng nịu và lo lắng trong lời nói.</li>\n<li>Phán xét nhân vật theo quan niệm hiện đại mà không phân tích văn bản.</li>\n</ul>\n<h2>Pattern 4 — Phân tích tình huống truyện bất ngờ/nghịch lí</h2>\n<p><strong>Recognition Sign:</strong> Đề yêu cầu “tình huống bất ngờ”, “nghịch lí”, “tình huống truyện”.</p>\n<p><strong>Step-by-step Strategy</strong></p>\n<ol>\n<li>Nêu kỳ vọng ban đầu của nhân vật hoặc người đọc.</li>\n<li>Chỉ ra sự kiện làm đảo ngược kỳ vọng.</li>\n<li>Giải thích vì sao sự kiện ấy bất ngờ dựa trên chi tiết trước đó.</li>\n<li>Phân tích phản ứng và hậu quả đối với nhân vật.</li>\n<li>Khái quát hiệu quả châm biếm, xót xa hoặc phê phán xã hội.</li>\n</ol>\n<p><strong>Áp dụng cho “Người ngựa ngựa người”</strong></p>\n<ul>\n<li>Anh phu xe hi vọng kiếm được tiền trong đêm giao thừa để về với gia đình.</li>\n<li>Anh tưởng chuyến xe và khoản tiền sắp nhận sẽ giúp khởi đầu năm mới thuận lợi.</li>\n<li>Người phụ nữ lại thú nhận mình cũng không có tiền trả.</li>\n<li>Tình huống làm đảo lộn hi vọng của anh, đồng thời cho thấy vẻ ngoài không bảo đảm khả năng chi trả và cả hai đều bị đẩy vào cảnh túng quẫn.</li>\n<li>Hiệu quả: vừa có nghịch lí trào phúng, vừa tạo nỗi xót xa cho người lao động nghèo.</li>\n</ul>\n<p><strong>Common Traps</strong></p>\n<ul>\n<li>Chỉ kể cuộc mặc cả.</li>\n<li>Gọi người phụ nữ là kẻ lừa đảo nếu đoạn trích chưa đủ căn cứ để kết luận động cơ.</li>\n<li>Bỏ qua ước mơ nhỏ bé của anh phu xe dành cho vợ con.</li>\n</ul>\n<h2>Pattern 5 — Nêu tác động thanh lọc/giá trị nhân văn đối với người đọc</h2>\n<p><strong>Recognition Sign:</strong> Đề hỏi “đoạn trích đã thanh lọc tâm hồn anh/chị ra sao?”</p>\n<p><strong>Step-by-step Strategy</strong></p>\n<ol>\n<li>Nêu cảm xúc hoặc nhận thức mà đoạn trích khơi dậy.</li>\n<li>Chọn một đến hai chi tiết gây tác động.</li>\n<li>Giải thích tác động ấy đối với cách nhìn con người.</li>\n<li>Nêu thay đổi thực tế hoặc định hướng ứng xử có thể có.</li>\n<li>Giữ giọng chân thành, tránh hô khẩu hiệu.</li>\n</ol>\n<p><strong>Áp dụng cho “Nhà mẹ Lê”</strong></p>\n<ul>\n<li>Cảnh gia đình thiếu ăn, trẻ nhỏ lạnh và đói gợi xót thương.</li>\n<li>Lao động của mẹ Lê không bảo đảm được cuộc sống vì việc làm phụ thuộc mùa vụ.</li>\n<li>Đoạn trích giúp nhận ra đói nghèo không đơn giản do thiếu cố gắng cá nhân; hoàn cảnh sống có thể giới hạn cơ hội.</li>\n<li>Từ đó, người đọc có thể bớt thờ ơ, tránh phán xét và biết trân trọng những điều kiện sống mình đang có.</li>\n</ul>\n<p><strong>Common Traps</strong></p>\n<ul>\n<li>Chỉ viết “em rất xúc động”.</li>\n<li>Bịa ra hành động lớn lao mà bản thân sẽ làm.</li>\n<li>Quên nhắc chi tiết trong ngữ liệu.</li>\n</ul>\n<h2>Pattern 6 — Phân tích bút pháp miêu tả</h2>\n<p><strong>Recognition Sign:</strong> Đề hỏi “bút pháp miêu tả”, “nghệ thuật miêu tả”.</p>\n<p><strong>Step-by-step Strategy</strong></p>\n<ol>\n<li>Xác định đối tượng được miêu tả: món ăn, không gian, con người, cảnh vật.</li>\n<li>Gạch các chi tiết thuộc giác quan: nhìn, nghe, ngửi, nếm, cảm nhận.</li>\n<li>Xác định thủ pháp: so sánh, nhân hóa, liệt kê, nhịp câu, tương phản.</li>\n<li>Giải thích tác dụng của từng thủ pháp đối với hình dung và cảm xúc người đọc.</li>\n<li>Kết nối bút pháp với tình yêu/quan niệm của người viết.</li>\n</ol>\n<p><strong>Áp dụng cho “Chả cá”</strong></p>\n<ul>\n<li>Hình ảnh khói, màu cá, rau xanh làm món ăn hiện lên trực quan.</li>\n<li>Tiếng mỡ lép bép và tiếng gọi món tạo âm thanh sống động.</li>\n<li>Liệt kê gia vị và thao tác ăn uống kích thích tưởng tượng vị giác.</li>\n<li>Không gian căn gác và sự đông vui làm trải nghiệm ăn chả cá thành một nét văn hóa đô thị.</li>\n</ul>\n<p><strong>Common Traps</strong></p>\n<ul>\n<li>Chỉ kể nguyên liệu.</li>\n<li>Nêu “so sánh, nhân hóa” nhưng không phân tích tác dụng.</li>\n<li>Quên rằng đề hỏi bút pháp, không phải chỉ hỏi món chả cá có gì hấp dẫn.</li>\n</ul>\n<h2>Pattern 7 — Phân tích hình ảnh mang nghĩa biểu tượng</h2>\n<p><strong>Recognition Sign:</strong> Một hình ảnh được đặt trong ngoặc kép hoặc xuất hiện với nghĩa khác nhau, như “cửa sau”.</p>\n<p><strong>Step-by-step Strategy</strong></p>\n<ol>\n<li>Giải thích nghĩa cụ thể ban đầu của hình ảnh.</li>\n<li>Tìm các kí ức, cảm xúc, con người và cảnh vật gắn với nó.</li>\n<li>Tìm nghĩa chuyển/ẩn dụ được văn bản phát triển.</li>\n<li>Đặt hai lớp nghĩa cạnh nhau và giải thích tương phản.</li>\n<li>Nêu cảm xúc và thông điệp được tạo ra từ sự đối lập.</li>\n</ol>\n<p><strong>Áp dụng cho “Cửa sau”</strong></p>\n<ul>\n<li>Cửa sau trong ngôi nhà quê là khung chứa kí ức về người thân, vườn cây, hương hoa và sự sum vầy.</li>\n<li>Khi ra phố, “cửa sau” được dùng để chỉ cách làm khuất tất, gắn với quà cáp và mất lòng tin.</li>\n<li>Tương phản giữa hai lớp nghĩa tạo nỗi buồn vì một hình ảnh thân thuộc bị phủ lên nghĩa tiêu cực.</li>\n<li>Người viết muốn bảo vệ kí ức trong trẻo của gia đình và những giá trị bình dị.</li>\n</ul>\n<p><strong>Common Traps</strong></p>\n<ul>\n<li>Chỉ viết về cửa vật lí.</li>\n<li>Chỉ lên án “đi cửa sau” mà quên phần kí ức gia đình.</li>\n<li>Không giải thích tác dụng của dấu ngoặc kép và sự đối lập.</li>\n</ul>\n<h2>Pattern 8 — Phân tích sự lựa chọn của nhân vật kịch</h2>\n<p><strong>Recognition Sign:</strong> Đề hỏi lựa chọn, quyết định, xung đột hoặc quan điểm sống trong đoạn kịch.</p>\n<p><strong>Step-by-step Strategy</strong></p>\n<ol>\n<li>Xác định hai phía xung đột.</li>\n<li>Trích lời thoại thể hiện nhận thức và quyết tâm.</li>\n<li>Nêu lựa chọn nhân vật từ chối/chấp nhận.</li>\n<li>Giải thích cái giá của lựa chọn và giá trị nhân vật bảo vệ.</li>\n<li>Khái quát thông điệp nhân sinh.</li>\n</ol>\n<p><strong>Áp dụng cho hồn Trương Ba</strong></p>\n<ul>\n<li>Xung đột giữa hồn Trương Ba và thân xác anh hàng thịt; bên trong và bên ngoài không hòa hợp.</li>\n<li>Trương Ba không chấp nhận lí lẽ “chẳng còn cách nào khác”.</li>\n<li>Lựa chọn của ông là không tiếp tục kiểu sống khiến mình đánh mất bản thân.</li>\n<li>Lời thoại trực tiếp làm xung đột rõ, tăng sức triết lí và kịch tính.</li>\n<li>Thông điệp: sống không chỉ là kéo dài tồn tại mà còn phải giữ gìn nhân cách và sự toàn vẹn.</li>\n</ul>\n<p><strong>Common Traps</strong></p>\n<ul>\n<li>Chỉ viết “Trương Ba muốn sống thật”.</li>\n<li>Quên phân tích lời đối đáp với Đế Thích.</li>\n<li>Biến đoạn văn thành bàn luận chung mà không bám lựa chọn cụ thể.</li>\n</ul>\n<h2>Pattern 9 — Phân tích bi kịch nhân vật</h2>\n<p><strong>Recognition Sign:</strong> Đề dùng “bi kịch”, “mâu thuẫn”, “ước mơ và hiện thực”, như nhân vật Thứ trong “Sống mòn”.</p>\n<p><strong>Step-by-step Strategy</strong></p>\n<ol>\n<li>Xác định khát vọng và phẩm chất ban đầu.</li>\n<li>Đặt khát vọng cạnh hiện thực trong đoạn trích.</li>\n<li>Phân tích ý thức của nhân vật về tình trạng của mình.</li>\n<li>Chỉ ra điều ngăn nhân vật thay đổi: hoàn cảnh, tâm lí, trách nhiệm hoặc sự thiếu quyết đoán.</li>\n<li>Nêu chiều sâu bi kịch và ý nghĩa xã hội nếu ngữ liệu hỗ trợ.</li>\n</ol>\n<p><strong>Áp dụng cho Thứ</strong></p>\n<ul>\n<li>Thứ từng mơ học cao, sang Pháp, trở thành người tạo thay đổi lớn.</li>\n<li>Hiện thực khiến ước vọng co lại thành chuyện kiếm sống, nuôi gia đình.</li>\n<li>Thứ hiểu mình đang mòn mỏi và sợ “chết mà chưa sống”.</li>\n<li>Dù có lúc muốn chống lại, y vẫn dự cảm mình sẽ không hành động được.</li>\n<li>Bi kịch là khoảng cách giữa ý thức/khát vọng và khả năng hành động, trong bối cảnh xã hội ngột ngạt.</li>\n</ul>\n<p><strong>Common Traps</strong></p>\n<ul>\n<li>Gọi Thứ là lười biếng mà không xét hoàn cảnh.</li>\n<li>Chỉ nói xã hội bất công, bỏ qua sự tự ý thức và nhu nhược của nhân vật.</li>\n<li>Tóm tắt cả cuộc đời Thứ thay vì tập trung đoạn trích.</li>\n</ul>\n<hr />\n<h1>6. BỘ THẺ GHI NHỚ — FLASHCARDS DẠNG BẢNG</h1>\n<table>\n<thead>\n<tr>\n  <th>Mặt trước (Câu hỏi)</th>\n  <th>Mặt sau (Đáp án ngắn)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Đoạn nghị luận 200 chữ cần ưu tiên điều gì?</td>\n  <td>Đúng trọng tâm, có luận điểm, dẫn chứng chọn lọc, phân tích cụ thể và kết luận phù hợp.</td>\n</tr>\n<tr>\n  <td>Khác nhau cốt lõi giữa kể lại và phân tích?</td>\n  <td>Kể lại nói chuyện gì xảy ra; phân tích giải thích chi tiết có ý nghĩa gì và vì sao.</td>\n</tr>\n<tr>\n  <td>Công thức phân tích chi tiết?</td>\n  <td>Chi tiết → biểu hiện → tác dụng/ý nghĩa → liên hệ luận điểm.</td>\n</tr>\n<tr>\n  <td>Đề hỏi “sự vận động cảm xúc” cần làm gì?</td>\n  <td>Chia thành các chặng, gọi tên cảm xúc, xác định bước ngoặt và giải thích sự chuyển biến.</td>\n</tr>\n<tr>\n  <td>Bước ngoặt cảm xúc trong “Hoa dại núi Hoàng Liên” là gì?</td>\n  <td>Nhân vật trữ tình bất ngờ bắt gặp một nhành hoa sau hành trình mệt mỏi, lạc lõng.</td>\n</tr>\n<tr>\n  <td>Điều nổi bật ở Liên trong đoạn “Hai đứa trẻ”?</td>\n  <td>Tâm hồn nhạy cảm, buồn man mác trước chiều tàn và động lòng thương trẻ nghèo.</td>\n</tr>\n<tr>\n  <td>Chi tiết Liên không có tiền cho trẻ nghèo có ý nghĩa gì?</td>\n  <td>Lòng thương người tồn tại trong cảnh nghèo chung; Liên muốn giúp nhưng bị hoàn cảnh giới hạn.</td>\n</tr>\n<tr>\n  <td>Nghịch lí trung tâm của tình huống “Người ngựa ngựa người”?</td>\n  <td>Anh phu xe hi vọng có tiền đón Tết nhưng người khách trông có vẻ sang lại không thể trả tiền.</td>\n</tr>\n<tr>\n  <td>Tác dụng của tình huống bất ngờ?</td>\n  <td>Đảo ngược kỳ vọng, tạo hiệu quả trào phúng và làm nổi bật cảnh đời túng quẫn.</td>\n</tr>\n<tr>\n  <td>“Thanh lọc tâm hồn” nên viết thế nào?</td>\n  <td>Nêu cảm xúc/nhận thức được đánh thức, gắn với chi tiết và chỉ ra thái độ sống có thể thay đổi.</td>\n</tr>\n<tr>\n  <td>Bút pháp miêu tả trong “Chả cá” nổi bật ở đâu?</td>\n  <td>Miêu tả đa giác quan, chi tiết cụ thể, so sánh/nhân hóa và không khí sinh hoạt sinh động.</td>\n</tr>\n<tr>\n  <td>Vì sao miêu tả đa giác quan hiệu quả?</td>\n  <td>Giúp người đọc hình dung gần như nhìn, nghe, ngửi, nếm và cảm nhận sự vật.</td>\n</tr>\n<tr>\n  <td>Hai lớp nghĩa của “cửa sau” là gì?</td>\n  <td>Cửa sau gia đình gợi kí ức, sum vầy; “đi cửa sau” gợi cách làm khuất tất và mất lòng tin.</td>\n</tr>\n<tr>\n  <td>Trương Ba từ chối điều gì?</td>\n  <td>Từ chối tiếp tục sống trong thân xác người khác khi bên trong và bên ngoài bất nhất.</td>\n</tr>\n<tr>\n  <td>Thông điệp trọng tâm từ lựa chọn của Trương Ba?</td>\n  <td>Sống không chỉ là tồn tại; cần giữ nhân cách, phẩm giá và sự toàn vẹn của bản thân.</td>\n</tr>\n<tr>\n  <td>Bi kịch của Thứ là gì?</td>\n  <td>Khát vọng lớn bị hiện thực thu hẹp, nhân vật ý thức được sự mòn mỏi nhưng không đủ sức thoát ra.</td>\n</tr>\n<tr>\n  <td>Cách tránh phân tích nghệ thuật chung chung?</td>\n  <td>Gọi tên thủ pháp rồi giải thích nó tạo hình ảnh, nhịp điệu, cảm xúc hay ý nghĩa gì.</td>\n</tr>\n<tr>\n  <td>Làm sao nhận ra hình ảnh biểu tượng?</td>\n  <td>Xem hình ảnh có nhiều lớp nghĩa, gắn với cảm xúc/kí ức và được đặt trong tương phản hay không.</td>\n</tr>\n<tr>\n  <td>Một đoạn văn cần bao nhiêu dẫn chứng?</td>\n  <td>Không có con số cố định; thường 2–3 chi tiết được phân tích tốt hơn nhiều chi tiết chỉ liệt kê.</td>\n</tr>\n<tr>\n  <td>Câu tự kiểm quan trọng nhất sau mỗi dẫn chứng?</td>\n  <td>“Chi tiết này chứng minh luận điểm như thế nào?”</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h1>7. NGÂN HÀNG ACTIVE RECALL — 5 CẤP ĐỘ + SUY LUẬN NGƯỢC</h1>\n<h2>Cấp 1 — Nhớ</h2>\n<ol>\n<li>Đề ví dụ trong tài liệu yêu cầu cảm nhận về nhân vật nào trong “Hai đứa trẻ”?</li>\n<li>Tác giả bài thơ “Hoa dại núi Hoàng Liên” là ai theo tài liệu?</li>\n<li>Đề 05 yêu cầu nghị luận về yếu tố nào trong đoạn “Chả cá”?</li>\n<li>Hình ảnh trung tâm của đề 06 là gì?</li>\n<li>Nhân vật trung tâm của đề “Sống mòn” là ai?</li>\n</ol>\n<h2>Cấp 2 — Hiểu</h2>\n<ol start=\"6\">\n<li>Vì sao Liên buồn khi ngày tàn dù không hiểu rõ nguyên nhân?</li>\n<li>Vì sao việc bắt gặp hoa làm thay đổi cảm xúc của nhân vật trữ tình trong “Hoa dại núi Hoàng Liên”?</li>\n<li>Trong “Chân quê”, những chi tiết trang phục truyền thống giúp bộc lộ điều gì về cái nhìn của “anh”?</li>\n<li>Vì sao đoạn “Chả cá” không chỉ miêu tả món ăn mà còn gợi văn hóa Hà Nội?</li>\n<li>Vì sao “cửa sau” có thể mang hai nghĩa đối lập?</li>\n</ol>\n<h2>Cấp 3 — Vận dụng</h2>\n<ol start=\"11\">\n<li>Hãy viết một câu chủ đề cho đoạn văn phân tích Liên.</li>\n<li>Chọn hai chi tiết trong “Người ngựa ngựa người” để chứng minh tình huống có tính nghịch lí.</li>\n<li>Hãy nêu một thủ pháp miêu tả trong “Chả cá” và phân tích tác dụng trong hai câu.</li>\n<li>Viết một câu kết cho đề “sự lựa chọn của hồn Trương Ba” mà không dùng lời sáo rỗng.</li>\n<li>Tạo một dàn ý ba ý cho bi kịch của Thứ.</li>\n</ol>\n<h2>Cấp 4 — Phân tích</h2>\n<ol start=\"16\">\n<li>Phân tích mối quan hệ giữa bóng tối phố huyện và tâm trạng Liên.</li>\n<li>Phân tích bước chuyển từ cảm giác lạc lõng sang niềm vui khi bắt gặp hoa trong bài thơ.</li>\n<li>Vì sao tình huống người phụ nữ không trả tiền vừa gây trớ trêu vừa gợi thương cảm?</li>\n<li>Phân tích sự tương phản giữa cửa sau của kí ức và “cửa sau” trong đời sống xã hội.</li>\n<li>Phân tích mâu thuẫn giữa ước vọng của Thứ và hành động thực tế của nhân vật.</li>\n</ol>\n<h2>Cấp 5 — Đánh giá/Hiểu sâu</h2>\n<ol start=\"21\">\n<li>Trong đoạn “Hai đứa trẻ”, vì sao sự bất lực của Liên không làm giảm giá trị lòng thương người?</li>\n<li>Từ “Chân quê”, hãy đánh giá mối quan hệ giữa tình yêu cá nhân và mong muốn gìn giữ truyền thống, đồng thời tránh biến nhân vật “anh” thành chân lí tuyệt đối.</li>\n<li>Đoạn “Nhà mẹ Lê” có thể khiến người đọc thay đổi cách nhìn người nghèo như thế nào? Trả lời bằng chi tiết cụ thể.</li>\n<li>Vì sao lời “Tôi muốn được là tôi toàn vẹn” có sức nặng hơn một lời khẳng định đơn thuần rằng Trương Ba muốn sống?</li>\n<li>Theo đoạn trích “Sống mòn”, tại sao nhận thức được bi kịch chưa chắc đã giúp nhân vật thoát khỏi bi kịch?</li>\n</ol>\n<h2>Câu hỏi suy luận ngược bắt buộc</h2>\n<ol start=\"26\">\n<li><strong>Kết quả đã cho:</strong> Người đọc cảm thấy xót xa cho anh phu xe ở cuối tình huống. Hãy suy ngược lại những điều kiện và chi tiết trước đó tạo nên cảm xúc này.</li>\n<li><strong>Kết quả đã cho:</strong> Cảm xúc trong bài “Hoa dại núi Hoàng Liên” chuyển từ cô đơn sang vui mừng rồi suy ngẫm. Hãy chỉ ra các tác nhân hình ảnh dẫn đến từng lần chuyển biến.</li>\n<li><strong>Thay đổi A:</strong> Nếu trong “Hai đứa trẻ”, Liên nhìn thấy trẻ nghèo nhưng không hề động lòng thương, cách cảm nhận về nhân vật sẽ thay đổi thế nào? Chi tiết nào của đoạn trích hiện tại khiến ta đọc Liên theo hướng giàu trắc ẩn?</li>\n<li><strong>Thay đổi A:</strong> Nếu “cửa sau” chỉ xuất hiện với nghĩa vật lí, không có nghĩa “đi cửa sau” trong xã hội, cấu trúc tư tưởng của tùy bút sẽ mất điều gì?</li>\n<li><strong>Suy ngược điều kiện:</strong> Muốn kết luận Thứ rơi vào bi kịch “chết mà chưa sống”, cần những bằng chứng nào về ước mơ, hiện thực, ý thức và sự bất lực của nhân vật?</li>\n<li><strong>Dự đoán hệ quả:</strong> Nếu Trương Ba chấp nhận tiếp tục sống trong thân xác anh hàng thịt, mâu thuẫn bên trong–bên ngoài có được giải quyết không? Giải thích dựa trên lời thoại trong đoạn trích.</li>\n<li><strong>Suy ngược từ nghệ thuật:</strong> Nếu đoạn “Chả cá” chỉ dùng tính từ “ngon” mà bỏ tiếng động, màu sắc, mùi vị và hoạt động của thực khách, trải nghiệm người đọc sẽ thay đổi thế nào?</li>\n<li><strong>Suy ngược từ cảm xúc:</strong> Vì sao những bông hoa dại ít được chú ý vẫn có thể làm người đi đường vui mừng và suy ngẫm? Hãy nối trải nghiệm quan sát với ý nghĩa bài thơ.</li>\n<li><strong>Thay đổi điều kiện:</strong> Nếu người phụ nữ trong “Người ngựa ngựa người” trả tiền đúng hẹn, tình huống có còn tạo ra cùng một nghịch lí và hiệu quả châm biếm không? Điều gì sẽ biến mất?</li>\n<li><strong>Suy luận ngược:</strong> Muốn viết đoạn văn có phân tích chứ không kể lại, sau khi đưa một dẫn chứng em phải thực hiện thao tác tư duy nào?</li>\n</ol>\n<h2>Gợi ý đáp án ngắn</h2>\n<ul>\n<li><ol>\n<li>Liên.</li>\n</ol>\n</li>\n<li><ol start=\"2\">\n<li>Xuân Quỳnh.</li>\n</ol>\n</li>\n<li><ol start=\"3\">\n<li>Bút pháp miêu tả.</li>\n</ol>\n</li>\n<li><ol start=\"4\">\n<li>“Cửa sau”.</li>\n</ol>\n</li>\n<li><ol start=\"5\">\n<li>Thứ.</li>\n</ol>\n</li>\n<li><ol start=\"6\">\n<li>Không khí ngày tàn, âm thanh và bóng tối tác động lên tâm hồn nhạy cảm của Liên.</li>\n</ol>\n</li>\n<li><ol start=\"7\">\n<li>Hoa xuất hiện như phát hiện bất ngờ giữa hành trình mệt mỏi, tạo niềm vui và mở ra suy ngẫm.</li>\n</ol>\n</li>\n<li><ol start=\"8\">\n<li>“Anh” gắn vẻ đẹp của “em” với trang phục và nếp quê truyền thống.</li>\n</ol>\n</li>\n<li><ol start=\"9\">\n<li>Món ăn được đặt trong không gian, âm thanh, thói quen và trải nghiệm của người Hà Nội.</li>\n</ol>\n</li>\n<li><ol start=\"10\">\n<li>Một nghĩa là không gian gia đình; nghĩa kia là lối làm khuất tất, được tạo bởi sự chuyển nghĩa và tương phản.</li>\n</ol>\n</li>\n<li>11–15. Đáp án có thể khác nhau nếu bám đề, có căn cứ và diễn đạt rõ.</li>\n<li>16–20. Cần nối chi tiết cụ thể với tâm trạng, nghịch lí, tương phản hoặc mâu thuẫn; không chỉ nhắc lại nội dung.</li>\n<li><ol start=\"21\">\n<li>Lòng trắc ẩn được thể hiện ở cảm xúc và cách nhìn; giới hạn vật chất không làm mất đi phẩm chất ấy.</li>\n</ol>\n</li>\n<li><ol start=\"22\">\n<li>Cần phân tích mong muốn của “anh” qua lời thơ, đồng thời nhận ra đây là góc nhìn nhân vật.</li>\n</ol>\n</li>\n<li><ol start=\"23\">\n<li>Cảnh đói rét, lao động bấp bênh cho thấy hoàn cảnh có thể khiến người nghèo khổ dù họ vẫn cố gắng.</li>\n</ol>\n</li>\n<li><ol start=\"24\">\n<li>Câu nói nêu yêu cầu sống thống nhất với bản thể, không chỉ kéo dài sự tồn tại.</li>\n</ol>\n</li>\n<li><ol start=\"25\">\n<li>Nhận thức có thể tồn tại song song với nỗi sợ, sự yếu đuối và ràng buộc hoàn cảnh.</li>\n</ol>\n</li>\n<li>26–35. Trả lời theo quan hệ chi tiết → nguyên nhân/tác động → ý nghĩa; chấp nhận nhiều cách diễn đạt có căn cứ.</li>\n</ul>\n<hr />\n<h1>8. LỊCH ÔN TẬP D0 → D90</h1>\n<h2>Nguyên tắc</h2>\n<ul>\n<li>Mỗi lượt ôn phải có truy hồi chủ động: đóng tài liệu và tự trả lời trước khi xem lại.</li>\n<li>Mỗi lần viết đoạn nên tự giới hạn thời gian để luyện phản xạ.</li>\n<li>Ôn lại những lỗi đã mắc, không chỉ đọc lại phần đã biết.</li>\n<li>Lịch dưới đây là khung đề xuất; điều chỉnh theo lịch học thực tế.</li>\n</ul>\n<table>\n<thead>\n<tr>\n  <th>Ngày</th>\n  <th>Nhiệm vụ</th>\n  <th>Sản phẩm cần tạo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>D0</td>\n  <td>Đọc dashboard, bản đồ kiến thức và 9 Pattern</td>\n  <td>Tự nói lại khung đoạn 200 chữ trong 60 giây</td>\n</tr>\n<tr>\n  <td>D1</td>\n  <td>Ôn đọc đề và phân biệt kể lại/phân tích</td>\n  <td>Phân loại 5 yêu cầu đề trong tài liệu</td>\n</tr>\n<tr>\n  <td>D3</td>\n  <td>Ôn nhân vật Liên và “Chân quê”</td>\n  <td>Mỗi đề viết 1 câu chủ đề + 2 dẫn chứng</td>\n</tr>\n<tr>\n  <td>D7</td>\n  <td>Ôn vận động cảm xúc và tình huống truyện</td>\n  <td>Lập dàn ý “Hoa dại núi Hoàng Liên” và “Người ngựa ngựa người”</td>\n</tr>\n<tr>\n  <td>D10</td>\n  <td>Ôn “Nhà mẹ Lê” và “Chả cá”</td>\n  <td>Viết hai đoạn 180–220 chữ hoặc hai dàn ý chi tiết</td>\n</tr>\n<tr>\n  <td>D14</td>\n  <td>Ôn biểu tượng và lựa chọn nhân vật</td>\n  <td>Trả lời miệng câu 19 và 24 trong Active Recall</td>\n</tr>\n<tr>\n  <td>D21</td>\n  <td>Ôn bi kịch Thứ và toàn bộ bảng bẫy</td>\n  <td>Viết đoạn về “Sống mòn”, tự đánh dấu checklist</td>\n</tr>\n<tr>\n  <td>D30</td>\n  <td>Làm bài trộn thể loại</td>\n  <td>Chọn ngẫu nhiên 3 đề, lập dàn ý mỗi đề trong 2 phút</td>\n</tr>\n<tr>\n  <td>D45</td>\n  <td>Kiểm tra lỗi lặp lại</td>\n  <td>Ghi 3 lỗi cá nhân và viết lại một đoạn đã sửa</td>\n</tr>\n<tr>\n  <td>D60</td>\n  <td>Kiểm tra phản xạ suy luận ngược</td>\n  <td>Trả lời câu 26–35 không xem gợi ý</td>\n</tr>\n<tr>\n  <td>D75</td>\n  <td>Mô phỏng bài kiểm tra</td>\n  <td>Viết 2 đoạn trong điều kiện thời gian tự đặt</td>\n</tr>\n<tr>\n  <td>D90</td>\n  <td>Tổng ôn</td>\n  <td>Tạo bản đồ kiến thức từ trí nhớ và làm lại đề yếu nhất</td>\n</tr>\n</tbody>\n</table>\n<h2>Chu trình mỗi buổi 20–30 phút</h2>\n<ol>\n<li>3 phút: ghi lại điều nhớ được mà không mở tài liệu.</li>\n<li>5 phút: trả lời 3 câu Active Recall.</li>\n<li>10–15 phút: lập dàn ý hoặc viết một đoạn ngắn.</li>\n<li>3–5 phút: tự chấm theo checklist và ghi một lỗi cần sửa.</li>\n</ol>\n<h2>Thước đo tiến bộ</h2>\n<table>\n<thead>\n<tr>\n  <th>Năng lực</th>\n  <th>Mức đầu</th>\n  <th>Mục tiêu sau ôn</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Nhận diện đối tượng đề</td>\n  <td>Cần đọc lại nhiều lần</td>\n  <td>Chốt được đối tượng và yêu cầu trong 20 giây</td>\n</tr>\n<tr>\n  <td>Chọn dẫn chứng</td>\n  <td>Chọn nhiều nhưng chưa đúng trọng tâm</td>\n  <td>Chọn 2–3 chi tiết có sức chứng minh</td>\n</tr>\n<tr>\n  <td>Phân tích</td>\n  <td>Hay kể lại</td>\n  <td>Mỗi dẫn chứng có câu giải thích ý nghĩa</td>\n</tr>\n<tr>\n  <td>Tổ chức đoạn</td>\n  <td>Ý rời rạc</td>\n  <td>Luận điểm → dẫn chứng → phân tích → đánh giá</td>\n</tr>\n<tr>\n  <td>Suy luận ngược</td>\n  <td>Khó giải thích nguyên nhân</td>\n  <td>Từ kết quả truy ra chi tiết và điều kiện tạo nên kết quả</td>\n</tr>\n<tr>\n  <td>Tự sửa</td>\n  <td>Chỉ đọc lại chung chung</td>\n  <td>Chỉ ra lỗi cụ thể và sửa được câu/ý đó</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h1>9. MẪU DÀN Ý SIÊU NHANH CHO 8 ĐỀ LUYỆN</h1>\n<h2>Đề 01 — “Hoa dại núi Hoàng Liên”</h2>\n<ul>\n<li>Luận điểm: Cảm xúc của nhân vật trữ tình vận động từ mệt mỏi, lạc lõng đến vui mừng, ngỡ ngàng rồi suy ngẫm về vẻ đẹp âm thầm của hoa dại.</li>\n<li>Dẫn chứng 1: bụi bay, nắng gắt, tiếng ve, nỗi nhớ, cảm giác vắng ngắt.</li>\n<li>Dẫn chứng 2: bắt gặp một nhành hoa, sau đó là nhiều loài hoa.</li>\n<li>Dẫn chứng 3: hoa dại không được chăm sóc hay trưng bày nhưng vẫn nở cho núi rừng.</li>\n<li>Kết: cuộc gặp gỡ với hoa mở rộng cảm xúc cá nhân thành nhận thức về vẻ đẹp không cần phô bày.</li>\n</ul>\n<h2>Đề 02 — “Chân quê”</h2>\n<ul>\n<li>Luận điểm: “Em” hiện lên qua cái nhìn yêu thương nhưng lo lắng của “anh”, gắn với vẻ đẹp chân quê và trang phục truyền thống.</li>\n<li>Dẫn chứng 1: sự thay đổi trang phục sau khi đi tỉnh về.</li>\n<li>Dẫn chứng 2: những câu hỏi nhớ tiếc yếm, áo tứ thân, khăn mỏ quạ…</li>\n<li>Dẫn chứng 3: lời van nài giữ nguyên vẻ quê mùa.</li>\n<li>Kết: đoạn thơ thể hiện tình yêu với nếp quê và nỗi lo mai một bản sắc; cần giữ rõ đây là góc nhìn của “anh”.</li>\n</ul>\n<h2>Đề 03 — “Người ngựa ngựa người”</h2>\n<ul>\n<li>Luận điểm: Tình huống người phụ nữ không trả tiền tạo nghịch lí giữa vẻ ngoài và thực cảnh, vừa châm biếm vừa xót xa.</li>\n<li>Dẫn chứng 1: anh phu xe vừa ốm dậy, cố kiếm tiền đón Tết.</li>\n<li>Dẫn chứng 2: anh mơ khoản tiền sẽ mang về cho vợ con.</li>\n<li>Dẫn chứng 3: người khách thú nhận không có tiền trả.</li>\n<li>Kết: cú đảo chiều làm vỡ hi vọng nhỏ bé và phơi bày cảnh túng quẫn của người lao động.</li>\n</ul>\n<h2>Đề 04 — “Nhà mẹ Lê”</h2>\n<ul>\n<li>Luận điểm: Đoạn trích khơi dậy lòng trắc ẩn và giúp người đọc nhìn sâu hơn vào nỗi khổ của người nghèo.</li>\n<li>Dẫn chứng 1: căn nhà chật chội, điều kiện sống thiếu thốn.</li>\n<li>Dẫn chứng 2: công việc thuê mướn phụ thuộc mùa vụ.</li>\n<li>Dẫn chứng 3: trẻ nhỏ đói rét, mẹ ôm con để sưởi ấm.</li>\n<li>Kết: tác phẩm nhắc người đọc tránh thờ ơ, phán xét và biết tôn trọng phẩm giá con người.</li>\n</ul>\n<h2>Đề 05 — “Chả cá”</h2>\n<ul>\n<li>Luận điểm: Bút pháp miêu tả giàu cảm giác và chi tiết khiến món ăn hiện lên hấp dẫn, đồng thời tái tạo không khí văn hóa Hà Nội.</li>\n<li>Dẫn chứng 1: không gian căn gác cũ, khách đông, hơi ấm.</li>\n<li>Dẫn chứng 2: màu sắc, tiếng mỡ, mùi vị và các nguyên liệu.</li>\n<li>Dẫn chứng 3: so sánh cá với trẻ nhỏ, nhịp kể rộn ràng.</li>\n<li>Kết: miêu tả không chỉ gợi vị ngon mà còn lưu giữ một trải nghiệm văn hóa.</li>\n</ul>\n<h2>Đề 06 — “Cửa sau”</h2>\n<ul>\n<li>Luận điểm: “Cửa sau” là hình ảnh hai lớp nghĩa, từ biểu tượng gia đình sum vầy đến ẩn dụ xã hội tiêu cực.</li>\n<li>Dẫn chứng 1: kí ức về cha, mẹ, bà, chị, vườn cây và hương hoa.</li>\n<li>Dẫn chứng 2: “cửa sau” trong đời sống xã hội gắn với quà cáp, thất thoát và mất lòng tin.</li>\n<li>Dẫn chứng 3: người viết khẳng định cửa sau mình nhớ không phải hình ảnh tiêu cực ấy.</li>\n<li>Kết: sự tương phản tạo nỗi buồn và khát vọng gìn giữ vẻ đẹp bình dị.</li>\n</ul>\n<h2>Đề 07 — “Hồn Trương Ba, da hàng thịt”</h2>\n<ul>\n<li>Luận điểm: Trương Ba lựa chọn không tiếp tục tồn tại trong một hình thức sống khiến bên trong và bên ngoài bất nhất.</li>\n<li>Dẫn chứng 1: nhận thức thân xác lấn át linh hồn.</li>\n<li>Dẫn chứng 2: bác bỏ ý nghĩ “chẳng còn cách nào khác”.</li>\n<li>Dẫn chứng 3: khẳng định muốn được là mình toàn vẹn.</li>\n<li>Kết: lựa chọn khẳng định phẩm giá và ý nghĩa của việc sống đúng với bản thân.</li>\n</ul>\n<h2>Đề 08 — “Sống mòn”</h2>\n<ul>\n<li>Luận điểm: Thứ mang bi kịch của người trí thức có khát vọng nhưng bị hiện thực thu hẹp và không đủ sức thoát khỏi vòng mòn mỏi.</li>\n<li>Dẫn chứng 1: ước vọng học cao, sang Pháp, tạo thay đổi.</li>\n<li>Dẫn chứng 2: thực tế chỉ còn lo kiếm sống, nuôi gia đình.</li>\n<li>Dẫn chứng 3: muốn phản kháng nhưng tự biết mình nhu nhược, để con tàu đưa đi.</li>\n<li>Kết: bi kịch nằm ở khoảng cách giữa ý thức và hành động, giữa khát vọng và điều kiện sống.</li>\n</ul>\n<hr />\n<h1>10. QUY TRÌNH TỰ CHẤM ĐOẠN VĂN</h1>\n<p>Chấm mỗi tiêu chí 0–2 điểm; tổng 10 điểm để tự theo dõi tiến bộ (đây là thang tự luyện, không phải thang điểm chính thức của đề thi).</p>\n<table>\n<thead>\n<tr>\n  <th>Tiêu chí</th>\n  <th>0 điểm</th>\n  <th>1 điểm</th>\n  <th>2 điểm</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Bám đề</td>\n  <td>Lạc đề</td>\n  <td>Đúng một phần</td>\n  <td>Đúng đối tượng, đúng yêu cầu</td>\n</tr>\n<tr>\n  <td>Luận điểm</td>\n  <td>Không rõ</td>\n  <td>Có nhưng chung</td>\n  <td>Rõ, có thể chứng minh</td>\n</tr>\n<tr>\n  <td>Dẫn chứng</td>\n  <td>Thiếu/sai</td>\n  <td>Có nhưng chưa chọn lọc</td>\n  <td>Chính xác, tiêu biểu</td>\n</tr>\n<tr>\n  <td>Phân tích</td>\n  <td>Chủ yếu kể</td>\n  <td>Có giải thích nhưng còn mỏng</td>\n  <td>Giải thích rõ chi tiết và ý nghĩa</td>\n</tr>\n<tr>\n  <td>Diễn đạt</td>\n  <td>Rối, lặp, thiếu liên kết</td>\n  <td>Tương đối rõ</td>\n  <td>Gọn, mạch lạc, kết luận phù hợp</td>\n</tr>\n</tbody>\n</table>\n<p>Sau khi chấm, chỉ chọn <strong>một lỗi ưu tiên sửa trong lần viết kế tiếp</strong>. Sửa một lỗi cụ thể tốt hơn đọc lại toàn bộ mà không biết cần thay đổi điều gì.</p>\n<hr />\n<h1>11. NGUYÊN TẮC CHỐT</h1>\n<ul>\n<li>Bám sát văn bản được cung cấp; không tự thêm tình tiết ngoài ngữ liệu.</li>\n<li>Mọi nhận xét cần có dấu vết chứng minh từ từ ngữ, hình ảnh, lời thoại, hành động hoặc cấu trúc.</li>\n<li>Ưu tiên phân tích sâu một vài chi tiết hơn là liệt kê nhiều chi tiết.</li>\n<li>Khi đề hỏi sự vận động, phải chỉ ra trình tự; khi hỏi tình huống, phải chỉ ra kỳ vọng và đảo chiều; khi hỏi biểu tượng, phải phân tích các lớp nghĩa; khi hỏi lựa chọn, phải nêu xung đột và giá trị được bảo vệ; khi hỏi bi kịch, phải đặt khát vọng cạnh hiện thực và khả năng hành động.</li>\n<li>Các gợi ý trong Study Pack là khung học tập. Khi viết bài hoàn chỉnh, hãy diễn đạt bằng lời của mình và điều chỉnh theo yêu cầu cụ thể của đề.</li>\n</ul>\n","tags":["Nghị luận văn học","Đoạn văn 200 chữ","Đọc hiểu","Study Pack"],"estimatedMinutes":90}]}]};
const STORAGE_KEY='knowledge-universe-v12';
const REVIEW_DAYS=[0,1,3,7,14,30,60,90];
const DATA_STORAGE_KEY='knowledge-universe-data-v12';
try{const savedData=JSON.parse(localStorage.getItem(DATA_STORAGE_KEY)||'null');if(savedData&&Array.isArray(savedData.subjects)){const merged=savedData.subjects.slice();for(const seeded of DATA_STORE.subjects){if(!merged.some(existing=>existing.id===seeded.id))merged.push(seeded)}DATA_STORE.subjects.splice(0,DATA_STORE.subjects.length,...merged)}}catch(e){}
const state={view:'home',subjectId:null,packId:null,showFab:true,search:''};
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function readStore(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{reviews:{},settings:{showFab:true},completed:{}}}catch(e){return {reviews:{},settings:{showFab:true},completed:{}}}}
let store=readStore(); state.showFab=store.settings?.showFab!==false;
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3200)}
function storageInfo(){let used=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);used+=(k.length+(localStorage.getItem(k)||'').length)*2}}catch(e){};return {used,limit:5*1024*1024,pct:used/(5*1024*1024)*100}}
function saveStore(next=store){const info=storageInfo();if(info.pct>=100){alert(' LỖI: Đã đầy bộ nhớ! Không thể lưu thêm dữ liệu.');return false}try{localStorage.setItem(STORAGE_KEY,JSON.stringify(next));store=next;const after=storageInfo();if(after.pct>=80)alert(' Cảnh báo: Bộ nhớ sắp đầy! Hãy xóa bài cũ để tránh lỗi.');return true}catch(e){alert(' LỖI: Đã đầy bộ nhớ! Không thể lưu thêm dữ liệu.');return false}}
function persistData(){try{localStorage.setItem(DATA_STORAGE_KEY,JSON.stringify(DATA_STORE));const info=storageInfo();if(info.pct>=80)alert(' Cảnh báo: Bộ nhớ sắp đầy! Hãy xóa bài cũ để tránh lỗi.');return true}catch(e){alert(' LỖI: Đã đầy bộ nhớ! Không thể lưu thêm dữ liệu.');return false}}
function makeId(prefix='lesson'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function allPacks(includeHidden=false){return DATA_STORE.subjects.flatMap(s=>s.packs.filter(p=>includeHidden||!p.hidden).map(p=>({...p,subject:s})))}
function getSubject(){return DATA_STORE.subjects.find(s=>s.id===state.subjectId)}function getPack(){return allPacks(true).find(p=>p.id===state.packId)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inlineMd(s){let x=escapeHtml(s);x=x.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\[(.*?)\]\((https?:\/\/[^ )]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');return x}
function renderMarkdown(md){const lines=md.replace(/\r/g,'').split('\n');let out='',i=0;while(i<lines.length){let l=lines[i];if(!l.trim()){i++;continue}if(l.trim().startsWith('```')){let code=[];i++;while(i<lines.length&&!lines[i].trim().startsWith('```'))code.push(lines[i++]);i++;out+='<pre><code>'+escapeHtml(code.join('\n'))+'</code></pre>';continue}if(/^\s*\|.*\|\s*$/.test(l)){let rows=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i]))rows.push(lines[i++]);rows=rows.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r));if(rows.length){const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());out+='<table><thead><tr>'+cells(rows[0]).map(c=>'<th>'+inlineMd(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+cells(r).map(c=>'<td>'+inlineMd(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}continue}if(/^#{1,6}\s/.test(l)){const m=l.match(/^(#{1,6})\s+(.*)/);const n=m[1].length;out+=`<h${n}>${inlineMd(m[2])}</h${n}>`;i++;continue}if(/^\s*---+\s*$/.test(l)){out+='<hr>';i++;continue}if(/^\s*>/.test(l)){let q=[];while(i<lines.length&&/^\s*>/.test(lines[i]))q.push(lines[i++].replace(/^\s*>\s?/,''));out+='<blockquote>'+q.map(inlineMd).join('<br>')+'</blockquote>';continue}if(/^\s*[-*+]\s+/.test(l)){let items=[];while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i]))items.push('<li>'+inlineMd(lines[i++].replace(/^\s*[-*+]\s+/,''))+'</li>');out+='<ul>'+items.join('')+'</ul>';continue}if(/^\s*\d+\.\s+/.test(l)){let items=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i]))items.push('<li>'+inlineMd(lines[i++].replace(/^\s*\d+\.\s+/,''))+'</li>');out+='<ol>'+items.join('')+'</ol>';continue}let para=[l.trim()];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|```|\s*\||\s*>|\s*[-*+]\s+|\s*\d+\.\s+|\s*---)/.test(lines[i]))para.push(lines[i++].trim());out+='<p>'+para.map(inlineMd).join(' ')+'</p>'}return out}

function accordionize(html){
  // Keep parent headings as parent accordions and place numbered subheadings inside them.
  const source=document.createElement('div');
  source.innerHTML=html;
  const roots=[];
  const stack=[];
  const isPrefix=(a,b)=>a.length<b.length&&a.every((part,i)=>part===b[i]);
  function headingPath(title){
    const text=title.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim();
    const numbered=text.match(/^(\d+(?:\.\d+)*)(?:[.)])?\s+/);
    if(numbered)return numbered[1].split('.').map(part=>'N:'+part);
    const alphaNumbered=text.match(/^([A-Z])[.)]?\s+(\d+)\s*[.)]?\s+/);
    if(alphaNumbered)return ['L:'+alphaNumbered[1],'N:'+alphaNumbered[2]];
    const letter=text.match(/^([A-Z])[.)]\s+/);
    if(letter)return ['L:'+letter[1]];
    return null;
  }
  function addHtml(node){
    const target=stack.length?stack[stack.length-1].children:roots;
    const value=node.outerHTML!==undefined?node.outerHTML:node.textContent;
    if(value)target.push({type:'html',html:value});
  }
  [...source.childNodes].forEach(node=>{
    if(node.nodeType===Node.ELEMENT_NODE && /^H[1-6]$/.test(node.tagName)){
      const title=node.innerHTML.trim();
      let path=headingPath(title);
      // If a lettered parent (A., B., ...) is active, plain numbered headings 1., 2., 3. are its children.
      if(path&&path.length===1&&path[0].startsWith('N:')){
        const letterParent=[...stack].reverse().find(section=>section.path.length===1&&section.path[0].startsWith('L:'));
        if(letterParent)path=[letterParent.path[0],...path];
      }
      if(!path){
        const target=stack.length?stack[stack.length-1].children:roots;
        target.push({type:'html',html:`<h4>${title}</h4>`});
        return;
      }
      while(stack.length && !isPrefix(stack[stack.length-1].path,path))stack.pop();
      const section={type:'section',title,path,children:[]};
      (stack.length?stack[stack.length-1].children:roots).push(section);
      stack.push(section);
    }else addHtml(node);
  });
  function renderItems(items,depth=0){
    return items.map(item=>{
      if(item.type==='html')return item.html;
      const firstRoot=depth===0&&roots.filter(x=>x.type==='section')[0]===item;
      return `<details class="accordion ${depth?'accordion-nested':''}" data-section-path="${item.path.join('-')}" ${firstRoot?'open':''}><summary>${item.title}</summary><div class="accordion-body markdown">${renderItems(item.children,depth+1)}</div></details>`;
    }).join('');
  }
  return `<div class="markdown-structure">${renderItems(roots)}</div>`;
}
function renderPack(){const p=getPack();if(!p){state.view='home';return renderHome()}const stage=reviewIndex(p.id),next=dueDate(p.id),info=storageInfo();return `<section class="view"><div class="crumbs"><button data-nav="home">Trang chủ</button> / <button data-nav="subjects">Môn học</button> / <button data-subject="${p.subject.id}">${escapeHtml(p.subject.name)}</button> / ${escapeHtml(p.title)}</div><div class="detail-layout"><div><header class="card article-head"><div class="eyebrow">${escapeHtml(p.subject.name)} · ${escapeHtml(p.subtitle)}</div><h1>${escapeHtml(p.title)}</h1><p>Học chủ động, tự kiểm tra và quay lại đúng lịch. Nội dung được lấy từ study pack đã cung cấp.</p><div class="article-tools"><button class="btn green" id="markLearned">✓ ${store.reviews?.[p.id]?'Đã bắt đầu ôn':'Bắt đầu học / ghi nhận D0'}</button><button class="btn" id="toggleAll">Mở / đóng tất cả mục</button><button class="btn" id="copyTitle">Sao chép tên gói</button></div></header><article class="card content"><div class="markdown" id="markdownContent">${accordionize(p.content)}</div></article></div><aside class="sidebar"><section class="card side-card"><h3>TIẾN ĐỘ ÔN TẬP</h3><div class="metric"><span>Trạng thái</span><strong>${escapeHtml(reviewStatus(p.id))}</strong></div><div class="metric"><span>Lần ôn hiện tại</span><strong>D${REVIEW_DAYS[stage]??90}</strong></div><div class="metric"><span>Ngày ôn tiếp theo</span><strong>${fmtDate(next)}</strong></div><div class="srsline">${REVIEW_DAYS.map((d,i)=>`<span class="srs-chip ${i===stage?'active':''}">D${d}</span>`).join('')}</div><button class="btn green" id="reviewDone" style="width:100%">Đã ôn xong → lịch kế tiếp</button><p class="muted" style="font-size:11px;margin:10px 0 0">Mỗi lần bấm sẽ chuyển sang mốc ôn kế tiếp.</p></section><section class="card side-card"><h3>THÔNG TIN GÓI</h3><div class="metric"><span>Thời lượng gợi ý</span><strong>${p.estimatedMinutes} phút</strong></div><div class="metric"><span>Nội dung</span><strong>${(p.conten const add=$('#addLesson');if(add)add.onclick=()=>{const title=prompt('Tên bài học mới:','Bài học mới');if(!title||!title.trim())return;const subj=getSubject();if(!subj)return;const pack={id:makeId('pack'),title:title.trim(),subtitle:'Bài học tự tạo',estimatedMinutes:30,tags:['Tự tạo'],content:'<h3>Mục tiêu học tập</h3><p>Thêm nội dung của bạn vào phần này.</p><h3>Ghi chú</h3><p></p>',hidden:false};subj.packs.push(pack);if(persistData()){toast('Đã thêm bài học.');render()}else{subj.packs.pop()}};
$$('[data-action]').forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();const id=btn.dataset.packId;const subj=getSubject();const idx=subj?.packs.findIndex(p=>p.id===id)??-1;if(!subj||idx<0)return;const pack=subj.packs[idx];if(btn.dataset.action==='rename'){const title=prompt('Nhập tên mới cho bài học:',pack.title);if(!title||!title.trim())return;const old=pack.title;pack.title=title.trim();if(persistData()){toast('Đã đổi tên bài học.');render()}else pack.title=old}else if(btn.dataset.action==='visibility'){pack.hidden=!pack.hidden;if(persistData()){toast(pack.hidden?'Đã ẩn bài học khỏi danh sách chính.':'Đã hiện lại bài học.');render()}else pack.hidden=!pack.hidden}else if(btn.dataset.action==='delete'){if(!confirm(`Xóa bài học “${pack.title}” khỏi môn học? Thao tác này không thể hoàn tác.`))return;const removed=subj.packs.splice(idx,1)[0];if(persistData()){delete store.reviews?.[id];saveStore();toast('Đã xóa bài học.');render()}else subj.packs.splice(idx,0,removed)}})}
function scheduleReview(packId,stage){const next=new Date();next.setHours(12,0,0,0);next.setDate(next.getDate()+REVIEW_DAYS[stage]);const nextStore={...store,reviews:{...store.reviews,[packId]:{stage,nextReviewDate:next.toISOString(),updatedAt:new Date().toISOString()}}};if(saveStore(nextStore)){toast(stage===0?'Đã ghi nhận D0. Lịch ôn tiếp theo đã được tạo.':`Hoàn thành ôn tập — mốc kế tiếp D${REVIEW_DAYS[stage]}.`);render()}}
// Điều hướng dùng event delegation ở capture phase để vẫn hoạt động trên thẻ và mọi phần tử con, kể cả trình duyệt di động.
document.addEventListener('click',e=>{const subjectEl=e.target.closest('[data-subject]');if(subjectEl){e.preventDefault();e.stopImmediatePropagation();goSubject(subjectEl.dataset.subject);return}const packEl=e.target.closest('[data-pack]');if(packEl){e.preventDefault();e.stopImmediatePropagation();goPack(packEl.dataset.pack);return}const navEl=e.target.closest('[data-nav]');if(navEl){e.preventDefault();e.stopImmediatePropagation();setView(navEl.dataset.nav==='subjects'?'subjects':navEl.dataset.nav);return}},true);
$('#fabToggle').onclick=()=>{const wrap=$('#fabWrap');wrap.classList.toggle('open');$('#fabToggle').setAttribute('aria-expanded',wrap.classList.contains('open')?'true':'false')};render();
</script></body></html>
